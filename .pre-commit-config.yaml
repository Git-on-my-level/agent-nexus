default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: static-checks
        name: Static checks (no tests or downloads)
        entry: make check-static
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      # Verbose so the advisory route list reaches the committer: pre-commit
      # prints a passing hook's output only when the hook asks for it.
      - id: route-drift
        name: HTTP route changes vs origin/main
        entry: make check-routes
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-commit]
      - id: test-fast
        name: Changed-module unit tests
        entry: make test-fast
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
