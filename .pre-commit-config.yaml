default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: static-checks
        name: Static checks (no tests or downloads)
        entry: make check-static
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: test-fast
        name: Changed-module unit tests
        entry: make test-fast
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
