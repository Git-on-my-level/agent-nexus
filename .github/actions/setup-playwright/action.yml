name: Verify Playwright container
description: Verify the installed Playwright matches the official CI browser image.

runs:
  using: composite
  steps:
    - name: Verify Playwright version and bundled Chromium
      shell: bash
      run: |
        node --input-type=module - <<'JS'
        import { createRequire } from "node:module";
        import { existsSync } from "node:fs";
        const require = createRequire(`${process.cwd()}/web-ui/package.json`);
        const version = require("@playwright/test/package.json").version;
        if (version !== "1.58.2") throw new Error(`Update the CI Playwright image for ${version}`);
        if (!existsSync(require("@playwright/test").chromium.executablePath())) {
          throw new Error("CI must run in the matching official Playwright image");
        }
        JS
