name: Setup Playwright Chromium
description: Cache Chromium for the installed Playwright version; always install Linux system libraries.

runs:
  using: composite
  steps:
    - name: Read Playwright version
      id: version
      shell: bash
      working-directory: web-ui
      run: echo "value=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

    - name: Restore Playwright browsers
      id: browsers
      uses: actions/cache@v5.0.3
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.value }}-chromium

    - name: Install Chromium on cache miss
      if: steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm -C web-ui exec playwright install chromium

    # Browser archives do not contain the runner's apt-installed libraries.
    - name: Install Chromium system dependencies
      shell: bash
      run: pnpm -C web-ui exec playwright install-deps chromium
