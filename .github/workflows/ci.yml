name: CI

on:
  merge_group:
    types: [checks_requested]
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  oss-boundary-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Check OSS identifiers
        env:
          OSS_BOUNDARY_EXTRA_PATTERNS: ${{ (github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.OSS_BOUNDARY_DENYLIST || '' }}
        run: make oss-boundary-check

  changes:
    runs-on: ubuntu-latest
    outputs:
      automation: ${{ steps.filter.outputs.automation }}
      go_shared: ${{ steps.filter.outputs.go_shared }}
      node_shared: ${{ steps.filter.outputs.node_shared }}
      contracts: ${{ steps.filter.outputs.contracts }}
      core: ${{ steps.filter.outputs.core }}
      cli: ${{ steps.filter.outputs.cli }}
      mcp: ${{ steps.filter.outputs.mcp }}
      web_ui: ${{ steps.filter.outputs.web_ui }}
      auth_e2e_smoke: ${{ steps.filter.outputs.auth_e2e_smoke }}
      platform_constraints: ${{ steps.filter.outputs.platform_constraints }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v4.0.1
        with:
          filters: |
            automation:
              - '.github/**'
            go_shared:
              - '.github/actions/setup-go/**'
              - '.github/workflows/ci.yml'
              - 'scripts/check-performance-shards.py'
              - 'scripts/tests/test_performance_shards.py'
            node_shared:
              - '.github/actions/setup-node-pnpm/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-playwright/**'
              - '.github/e2e-timings.json'
              - 'scripts/ci-e2e.mjs'
              - 'scripts/tests/ci-automation.test.mjs'
              - 'scripts/check-performance-shards.py'
              - 'scripts/tests/test_performance_shards.py'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
            contracts:
              - 'contracts/**'
              - 'Makefile'
              - 'scripts/contract-*'
              - 'scripts/check-visual-report-conformance.mjs'
              - 'core/cmd/contract-gen/**'
            core:
              - 'core/**'
            cli:
              - 'cli/**'
              # CLI integration fixtures open core databases and exercise migrations.
              - 'core/internal/storage/**'
              - 'VERSION'
              - 'scripts/read-version.sh'
              - 'scripts/set-version.sh'
              - 'scripts/sync-version.sh'
            mcp:
              - 'mcp/**'
            web_ui:
              - 'web-ui/**'
            auth_e2e_smoke:
              - 'contracts/**'
              - 'core/cmd/anx-core/**'
              - 'core/internal/auth/**'
              - 'core/internal/server/**'
              - 'scripts/e2e-smoke'
            platform_constraints:
              - 'scripts/check-platform-constraints.sh'

  workflow-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.automation == 'true' || needs.changes.outputs.node_shared == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node And pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Test CI gate and shard coverage
        run: |
          node --test scripts/tests/ci-automation.test.mjs
          python3 -m unittest discover -s scripts/tests -p "test_performance_shards.py"

      - name: Check GitHub automation formatting
        run: pnpm -C web-ui exec prettier --check "../.github/**/*.{yml,yaml}"

  contracts-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.contracts == 'true' || needs.changes.outputs.go_shared == 'true' || needs.changes.outputs.node_shared == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Setup Node And pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify generated contracts
        run: ./scripts/contract-check --committed

  core-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.go_shared == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Run core check
        # Match local validation's CPU/package concurrency for SQL-backed
        # fixtures. Leave setup and inventory room beyond the package budget.
        env:
          GOMAXPROCS: "2"
          GOFLAGS: "-p=1"
        run: make -C core check-ci GO_TEST_TIMEOUT=25m

      - name: Verify route inventory matches the router
        run: make route-inventory-check

  core-performance-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.go_shared == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Scale route and query-plan shard
        working-directory: core
        env:
          ANX_PERFORMANCE_TEST: "1"
          ANX_PERFORMANCE_SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p ../.tmp/performance
          rm -f ../.tmp/performance/route-report.json
          go test -c -o ../.tmp/performance/route-tests ./internal/server
          pids=()
          for worker in 1 2 3; do
            worker_dir="${GITHUB_WORKSPACE}/.tmp/performance/workers/worker-${worker}"
            mkdir -p "$worker_dir"
            worker_gomax=2
            worker_niceness=0
            if [ "$worker" = 3 ]; then
              worker_gomax=1
              worker_niceness=10
            fi
            (
              cd internal/server
              GOMAXPROCS="$worker_gomax" ANX_PERFORMANCE_WORKER="$worker" ANX_PERFORMANCE_REPORT="$worker_dir/worker-report.json" \
                nice -n "$worker_niceness" "${GITHUB_WORKSPACE}/.tmp/performance/route-tests" -test.parallel=1 -test.timeout=20m -test.count=1 -test.v -test.run='^TestPerformanceRoutes$'
            ) > "$worker_dir/worker.log" 2>&1 &
            pids+=("$!")
          done
          result=0
          for pid in "${pids[@]}"; do
            if wait "$pid"; then :; else result=1; fi
          done
          cat ../.tmp/performance/workers/worker-*/worker.log
          python3 ../scripts/check-performance-shards.py ../.tmp/performance/workers --merge-workers ../.tmp/performance/route-report.json
          exit "$result"

      - name: Upload this shard's executed samples and SQL plans
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: core-performance-routes-${{ matrix.shard }}
          path: |
            .tmp/performance/route-report.json
            .tmp/performance/workers/**/worker-report.json
            .tmp/performance/workers/**/worker.log
          include-hidden-files: true
          if-no-files-found: error

  core-performance-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.go_shared == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Legacy regressions, cache controls and startup budgets
        working-directory: core
        env:
          GOMAXPROCS: "2"
          ANX_PERFORMANCE_TEST: "1"
        run: |
          mkdir -p ../.tmp/performance
          set -o pipefail
          go test -p=1 -parallel=1 -timeout=10m -count=1 -v ./internal/server ./internal/storage -run '^TestPerformance|^TestResourceAccess(CommonReadPerformance|LargeDenialPrepareAndPMRoutes)$' -skip '^TestPerformanceRoutes$' | tee ../.tmp/performance/legacy.log
          go test -p=1 -count=1 -v ./internal/testutil/perfguard | tee ../.tmp/performance/perfguard.log

      - name: Upload legacy and startup measurements
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: core-performance-legacy
          path: .tmp/performance/*.log
          include-hidden-files: true
          if-no-files-found: error

  core-performance-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, core-performance-routes]
    if: always() && (needs.changes.outputs.core == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.go_shared == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Download every route shard
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: core-performance-routes-*
          path: .tmp/performance/shards

      - name: Assert executed union covers all cases and both principals
        run: python3 scripts/check-performance-shards.py .tmp/performance/shards

  mcp-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.mcp == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.go_shared == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum

      - name: Check MCP tool policy covers the command registry
        run: node mcp/scripts/check-tool-policy.mjs

      - name: Run MCP tests
        working-directory: mcp
        run: go test ./...

  cli-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.go_shared == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Verify version metadata
        run: ./scripts/sync-version.sh --check

      - name: Run CLI check
        working-directory: cli
        run: go test ./...

      - name: Run CLI integration tests
        working-directory: cli
        # Give the full real-core suite an explicit package budget below the
        # job deadline so timed-out runs still report diagnostics.
        run: go test -timeout=13m -tags=integration ./integration/...

  # Cheap deterministic checks (lint, unit tests, bundle audit). Runs on every web-ui-related change.
  web-ui-static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.web_ui == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.node_shared == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node And pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run web-ui check
        run: make -C web-ui check

      - name: Build standalone UI and enforce commercial source/output boundary
        run: pnpm -C web-ui run build

  # Run every browser spec, including the base-path project. Keep this separate
  # from visual QA so a selected-spec command cannot silently drop route coverage.
  web-ui-e2e-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.web_ui == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.node_shared == 'true' || needs.changes.outputs.go_shared == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Setup Node And pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup Playwright Chromium
        uses: ./.github/actions/setup-playwright

      - name: Allow sandboxed Chromium on Ubuntu runners
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run full browser suite (balanced shard ${{ matrix.shard }}/5)
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/e2e-report.json
        run: node scripts/ci-e2e.mjs ${{ matrix.shard }}/5

      - name: Upload browser timings
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: web-ui-e2e-timings-${{ matrix.shard }}
          path: web-ui/test-results/e2e-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: web-ui-e2e-shard-${{ matrix.shard }}
          path: web-ui/test-results/e2e/**
          if-no-files-found: ignore
          retention-days: 7

  # Browser-based visual QA against committed baselines (after static checks).
  web-ui-visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - changes
      - web-ui-static-check
    if: needs.changes.outputs.web_ui == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.node_shared == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Setup Node And pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup Playwright Chromium
        uses: ./.github/actions/setup-playwright

      - name: Render visual report examples and browser checks
        run: pnpm -C web-ui exec playwright test tests/e2e/visual-reports.spec.js --project=default --retries=0 --max-failures=1 --output=test-results/visual-reports

      - name: Upload visual report examples
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: web-ui-visual-report-examples
          path: web-ui/test-results/visual-reports/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Run task participation browser checks
        run: pnpm -C web-ui exec playwright test tests/e2e/participation.spec.js --project=default

      - name: Upload task participation browser artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: web-ui-participation-artifacts
          path: web-ui/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Run visual QA diff
        run: pnpm -C web-ui run qa:diff

      - name: Upload visual QA artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: web-ui-visual-artifacts
          path: |
            web-ui/.qa-current/**
            web-ui/.qa-diff/**
          if-no-files-found: ignore
          include-hidden-files: true

  cross-platform-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.go_shared == 'true'
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Cross-compile CLI (${{ matrix.goos }}/${{ matrix.goarch }})
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: CGO_ENABLED=0 go build -trimpath ./cmd/anx

  platform-constraints:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.go_shared == 'true' || needs.changes.outputs.platform_constraints == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Check platform build constraints
        run: ./scripts/check-platform-constraints.sh

  auth-e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.changes.outputs.auth_e2e_smoke == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Setup Node And pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run end-to-end smoke
        env:
          SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/.tmp/e2e-smoke
        run: make e2e-smoke

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: auth-e2e-smoke-artifacts
          path: .tmp/e2e-smoke/**
          if-no-files-found: ignore

  ci-ok:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - oss-boundary-check
      - changes
      - workflow-checks
      - contracts-check
      - core-checks
      - core-performance-routes
      - core-performance-legacy
      - core-performance-coverage
      - mcp-checks
      - cli-checks
      - web-ui-static-check
      - web-ui-e2e-check
      - web-ui-visual-check
      - cross-platform-build
      - platform-constraints
      - auth-e2e-smoke
    steps:
      - name: Require successful or intentionally skipped jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS_JSON" | jq -e '.changes.result == "success" and all(.[]; .result == "success" or .result == "skipped")'
