# anx-schema.yaml
#
# Shared contract for Agent Nexus (anx-core and clients).
# The canonical workspace model exposes topics, documents, boards, and cards as
# first-class resources. Threads remain backing infrastructure for evidence,
# sequencing, and timeline inspection.

version: "0.6.0"

enums:
  host_bridge_job:
    enum_policy: strict
    values: [answers, wake, git, files, spool]

  priority:
    enum_policy: strict
    description: >
      Canonical work and ask priority. Writers emit p0..p3. Input edges that
      have historically taken word spellings (ask --priority, ask payloads,
      inbox severity) still accept the aliases below and fold them to the
      canonical value, so older clients and stored asks keep their rank.
      Work-item priority writes stay strict p0..p3.
    values: [p0, p1, p2, p3]
    aliases:
      critical: p0
      urgent: p0
      high: p1
      medium: p2
      normal: p2
      low: p3

  lifecycle_state:
    enum_policy: strict
    description: >
      Canonical lifecycle buckets shared by first-class resources and list
      filters. Derived precedence is trashed, then archived, then active.
    values: [active, archived, trashed]

  work_item_risk:
    enum_policy: strict
    values: [low, medium, high, critical]

  card_resolution:
    enum_policy: strict
    description: >
      Terminal resolution for a card in the done column. Null/absent while the
      card is active. Abandoned work uses card trash/archive, not resolution.
    values: [done]

  agent_notification_status:
    enum_policy: strict
    values: [unread, read, dismissed]

  run_state:
    enum_policy: strict
    values: [starting, running, completed, failed, cancelled, unknown]

  run_liveness:
    enum_policy: strict
    values: [alive, stale, unknown]

  derived_agent_state:
    enum_policy: strict
    values: [waiting_on_human, working, idle, stale]

  human_attention_response_outcome:
    enum_policy: strict
    description: >
      A proposal or free reply is answered; explicit review Approve and Reject actions
      are approved and rejected; closing without an answer is acknowledged.
    values: [answered, approved, rejected, acknowledged, needs_context, resolved]

  board_column_key:
    enum_policy: strict
    values: [backlog, ready, in_progress, blocked, review, done]

  event_type:
    enum_policy: strict
    description: >
      Canonical event ledger types. Unknown values are rejected at write time.
    values:
      - topic_created
      - topic_updated
      - topic_archived
      - topic_restored
      - topic_trashed
      - message_posted
      - document_created
      - document_revised
      - document_trashed
      - document_restored
      - board_created
      - board_updated
      - card_created
      - card_updated
      - card_moved
      - card_archived
      - card_trashed
      - card_resolved
      - run_recorded
      - receipt_added
      - review_completed
      - exception_raised
      - human_attention_requested
      - human_attention_responded
      - human_attention_withdrawn
      - attention_feedback
      - agent_notification_read
      - agent_notification_dismissed
    groups:
      messages: [message_posted]
      topics: [topic_created, topic_updated, topic_archived, topic_restored, topic_trashed]
      documents: [document_created, document_revised, document_trashed, document_restored]
      boards: [board_created, board_updated]
      cards: [card_created, card_updated, card_moved, card_archived, card_trashed, card_resolved]
      attention: [human_attention_requested, human_attention_responded, human_attention_withdrawn, attention_feedback]
      notifications: [agent_notification_read, agent_notification_dismissed]
      runs: [run_recorded]
      reviews: [receipt_added, review_completed]
      exceptions: [exception_raised]
    backing_event_types:
      - document_created
      - document_revised
      - document_trashed
      - document_restored
      - card_created
      - card_updated
      - card_moved
      - card_archived
      - card_trashed
      - card_resolved

  artifact_kind:
    enum_policy: strict
    values: [doc, card, agent_wake, attachment]
    backing_kinds: [doc, card]

  backing_scope:
    enum_policy: strict
    values: [all, standalone, backing_only]

  event_group:
    enum_policy: strict
    values: [messages, topics, documents, boards, cards, attention, notifications, runs, reviews, exceptions]

  provenance_source:
    enum_policy: open
    description: Discrete evidence label. Never a numeric confidence score.
    examples:
      - "event:<event_handle>"
      - "inferred"

ref_format:
  description: >
    Typed refs are the public identity model for durable Agent Nexus resources.
    All strings in `ref`, `refs`, `*_ref`, and `*_refs` fields MUST use typed
    prefixes so consumers can parse the target deterministically.
  prefixes:
    "actor:<id>": "References an actor by durable actor id"
    "artifact:<handle>": "References an artifact by public handle"
    "event:<handle>": "References an event by public handle"
    "thread:<handle>": "References a backing thread by public handle"
    "topic:<handle>": "References a topic by public handle"
    "document:<handle>": "References a document lineage by public handle"
    "document_revision:<handle>": "References a document revision by public handle"
    "board:<handle>": "References a board by public handle"
    "card:<handle>": "References a card by public handle"
    "card_revision:<handle>": "References a card content revision by public handle"
    "inbox:<handle>": "References a derived inbox item by public handle"
    "host:<handle>": "References an enrolled workspace host by slug"
    "run:<handle>": "References a launcher run by public handle"
    "series:<name>[?<label>=<value>&_range=30d&_baseline=<number>]": "Workspace series metric; URL-encoded label selectors, range 1s..90d (default 30d), optional finite numeric baseline. Reserved options begin with underscore. Ambiguous streams return no value. Visibility follows series/report reads."
    "url:<url>": "References an external URL"
  rules:
    - "All refs MUST start with a typed prefix followed by a colon and value."
    - "Consumers MUST parse the prefix; they MUST NOT infer ref kind from raw ids."
    - "Public APIs SHOULD accept typed refs and resource handles before falling back to internal UUID lookup."
    - "Reverse lookups MUST be derived from typed refs and ref_edge records."
    - "Unknown prefixes MUST be preserved and round-tripped."
    - "A browser link for any typed ref is `<web_url>/r/<path-escaped ref>`, where `web_url` comes from the workspace handshake. The web UI resolves the ref (handle or id) to its page, or shows a not-found page. Clients MUST NOT guess a web URL when `web_url` is absent."

identity_concepts:
  ResourceRef:
    type: typed_ref
    description: >
      Public typed reference in the form `<kind>:<handle>`. This is the
      canonical cross-resource identity value for API payloads, refs, links,
      and operator-visible routing.
  ResourceHandle:
    type: string
    description: >
      Public, kind-scoped resource handle. A handle is stable enough for URLs,
      command arguments, and human-readable references, but clients should carry
      the full typed `ref` whenever the resource kind is not otherwise known.
  CardHandle:
    type: string
    description: >
      Client-chosen card handles use lowercase ASCII letters and digits separated
      by single hyphens, 1-64 characters; reserved resource names and UUIDs are
      rejected. Existing handles and aliases remain reserved (409 conflict).
      CardCreateInput and board batch id/card_id select the internal storage ID,
      including UUIDs, independently of handle; card_id takes precedence over id.
      Only handle selects the public slug. Existing storage-ID validation and
      request-key replay behavior are unchanged, as is WorkCreateRequest.id.
      Omitted handles derive from the title, at most 40 characters on a word
      boundary where possible; no existing handles are rewritten.
  InternalResourceUUID:
    type: string
    description: >
      Internal storage UUID or storage id. UUIDs are explicit debug/admin
      identifiers and MUST NOT be described as the primary public identity for
      workspace resources.

provenance:
  description: >
    Standardized provenance object used on mutable domain resources, events, and
    restricted fields so evidence-backed changes remain explainable.
  fields:
    sources:
      type: "list<string>"
      required: true
      description: Provenance source labels (see provenance_source enum)
    notes:
      type: string
      required: false
      description: Free-text explanation
    by_field:
      type: "map<string, list<string>>"
      required: false
      description: >
        Per-field provenance for restricted fields. Key is the field name and
        value is the list of provenance source labels supporting that field.

actor:
  description: >
    Actors are opaque IDs. Agent Nexus does not encode human versus agent distinctions
    in the durable schema.
  registry_fields:
    id: { type: string, required: true }
    display_name: { type: string, required: true }
    tags: { type: "list<string>", required: false }
    created_at: { type: datetime, required: true }

primitives:
  host:
    description: Workspace-local machine principal with exactly one active Ed25519 key. No auth-admin capability or bearer session; can sign for its own derived agents and update its own display name/exclusions. Host revocation cascades to all child credentials in one transaction and emits one audit entry.
    fields:
      id: { type: string, required: true }
      ref: { type: typed_ref, required: true }
      handle: { type: string, required: true }
      slug: { type: string, required: true, description: "Unique per workspace, lowercase [a-z0-9-], 1-63 chars, no leading/trailing hyphen." }
      display_name: { type: string, required: true }
      os_user: { type: string, required: true }
      hostname: { type: string, required: true }
      discovered_adapters: { type: "list<string>", required: true }
      key_id: { type: string, required: true }
      excluded_names: { type: "list<string>", required: true }
      created_at: { type: datetime, required: true }
      revoked_at: { type: datetime, required: false }
  derived_agent:
    description: Workspace-local principal for an immutable (host_id, name) pair. Handle is <name>.<host_slug>; actor ID remains stable across exclusion and later re-derivation. Adopted agents keep the existing actor ID and history while old standalone keys and sessions are revoked.
    fields:
      id: { type: string, required: true }
      actor_id: { type: string, required: true }
      host_id: { type: string, required: true }
      name: { type: string, required: true, description: "Lowercase [a-z][a-z0-9-]*, 1-32 chars. Known adapter or explicit persona." }
      handle: { type: string, required: true }
      created_at: { type: datetime, required: true }
      revoked_at: { type: datetime, required: false }
  run:
    description: Launcher-neutral execution observation; unique immutable key (launcher, host_id, external_id). A terminal run does not complete its card.
    fields:
      id: { type: string, required: true }
      ref: { type: typed_ref, required: true }
      handle: { type: string, required: true }
      launcher: { type: string, required: true }
      external_id: { type: string, required: true }
      host_id: { type: string, required: true }
      agent_id: { type: string, required: true }
      adapter: { type: string, required: true }
      model: { type: string, required: false }
      state: { type: string, required: true, ref: enums.run_state }
      liveness: { type: string, required: true, ref: enums.run_liveness }
      result_collected: { type: boolean, required: true }
      labels: { type: "list<string>", required: true }
      card_ref: { type: typed_ref, required: false }
      repository: { type: string, required: false }
      branch: { type: string, required: false }
      started_at: { type: datetime, required: false }
      ended_at: { type: datetime, required: false }
      last_observed_at: { type: datetime, required: true }
  agent_presence:
    description: Latest self-reported card and progress; working freshness is 30 minutes, independent from bridge connectivity.
    fields:
      agent_id: { type: string, required: true }
      current_card_ref: { type: typed_ref, required: false }
      note: { type: string, required: false }
      observed_at: { type: datetime, required: true }
  event:
    description: >
      Append-only. Never edited or deleted. Corrections are new events.
      Event types that appear in Home MUST declare a deterministic Home render
      family and required payload fields. Event types without a Home render
      family remain Events-only and must still be inspectable by raw type,
      summary, refs, and payload.
    home_feed:
      preset_id: home_feed
      group_ownership: >
        Home resolves events to typed groups. Resolution order:
        1. Direct `topic:<handle>` ref → topic group.
        2. `thread:<handle>` or event.thread_ref through topic or board backing thread → owning group.
        3. `board:<handle>` ref → board group.
        Events that cannot be assigned to any group are excluded from Home and
        remain visible on Events.
      reader_scope: >
        Read cursors are keyed by authenticated principal plus group_ref (a typed
        ref string such as "topic:<handle>" or "board:<handle>"). Development legacy
        actor mode may pass a reader id explicitly for local operation.
      cursor: "Per-group `(last_read_event_ts, last_read_event_id)` keyed by group_ref; id breaks equal-timestamp ties."
      eligible_types:
        message_posted:
          family: message
          required_payload_fields: [body]
        card_created:
          family: card_created
          required_payload_fields: [card_id]
        card_updated:
          family: card_updated
          required_payload_fields: [card_id]
        card_moved:
          family: card_moved
          required_payload_fields: [card_id, from_column_key, column_key]
        card_closed:
          family: card_closed
          required_payload_fields: [card_id]
        card_resolved:
          family: card_closed
          required_payload_fields: [card_id]
        card_restored:
          family: card_restored
          required_payload_fields: [card_id]
        card_archived:
          family: card_closed
          required_payload_fields: [card_id]
        card_trashed:
          family: card_closed
          required_payload_fields: [card_id]
        topic_priority_changed:
          family: priority
          required_payload_fields: [from, to]
        topic_lifecycle_changed:
          family: lifecycle
          required_payload_fields: [from, to]
        topic_updated:
          family: lifecycle
          required_payload_fields: [changed_fields]
        topic_archived:
          family: lifecycle
          required_payload_fields: []
        topic_restored:
          family: lifecycle
          required_payload_fields: []
        topic_trashed:
          family: lifecycle
          required_payload_fields: []
        human_attention_requested:
          family: ask_opened
          required_payload_fields: [title]
        human_attention_responded:
          family: ask_resolved
          required_payload_fields: [title]
        human_attention_withdrawn:
          family: ask_resolved
          required_payload_fields: [reason]
        document_created:
          family: doc
          required_payload_fields: [document_id, title]
        document_revision_created:
          family: doc
          required_payload_fields: [document_id, title]
        document_revised:
          family: doc
          required_payload_fields: [document_id, title]
    fields:
      ref: { type: typed_ref, required: true, ref: identity_concepts.ResourceRef }
      handle: { type: string, required: true, ref: identity_concepts.ResourceHandle }
      id: { type: string, required: false, ref: identity_concepts.InternalResourceUUID }
      ts: { type: datetime, required: true }
      type: { type: string, required: true, ref: enums.event_type }
      actor_id: { type: string, required: true }
      thread_ref: { type: typed_ref, required: false, description: "Backing thread when the event is thread-scoped." }
      refs: { type: "list<typed_ref>", required: true }
      summary: { type: string, required: true }
      payload: { type: object, required: false }
      provenance: { type: object, required: true, ref: provenance }

  thread:
    description: >
      Backing workspace infrastructure record. Threads support event ordering,
      low-level inspection, and timeline reconstruction. They are not the
      primary planning surface.
    fields:
      ref: { type: typed_ref, required: true, ref: identity_concepts.ResourceRef }
      handle: { type: string, required: true, ref: identity_concepts.ResourceHandle }
      id: { type: string, required: false, ref: identity_concepts.InternalResourceUUID }
      topic_ref: { type: typed_ref, required: false }
      title: { type: string, required: false }
      state:
        type: string
        required: true
        ref: enums.lifecycle_state
        description: >
          Canonical lifecycle state derived from `trashed_at` / `archived_at`
          (same precedence as document.state).
      latest_event_at: { type: datetime, required: false }
      created_at: { type: datetime, required: true }
      created_by: { type: string, required: true }
      updated_at: { type: datetime, required: true }
      updated_by: { type: string, required: true }
      provenance: { type: object, required: true, ref: provenance }
      archived_at: { type: datetime, required: false }
      archived_by: { type: string, required: false }
      trashed_at: { type: datetime, required: false }
      trashed_by: { type: string, required: false }
      trash_reason: { type: string, required: false }

  artifact:
    description: >
      Immutable blob. New versions are new artifacts linked through refs. Document
      and card revision artifacts are system-owned and managed through their wrappers;
      all other kinds remain opaque content. File attachments (`kind: attachment`)
      store bytes via POST /artifacts/attachments; metadata includes optional
      mime_type, original_filename, size_bytes, preview_status, and scan_status,
      while `content_type` holds the concrete MIME type served from GET .../content.
    fields:
      ref: { type: typed_ref, required: true, ref: identity_concepts.ResourceRef }
      handle: { type: string, required: true, ref: identity_concepts.ResourceHandle }
      id: { type: string, required: false, ref: identity_concepts.InternalResourceUUID }
      created_at: { type: datetime, required: true }
      created_by: { type: string, required: true }
      kind: { type: string, required: true, ref: enums.artifact_kind }
      content_type: { type: string, required: true }
      content_hash: { type: string, required: true }
      refs: { type: "list<typed_ref>", required: true }
      summary: { type: string, required: false }
      trashed_at: { type: datetime, required: false }
      trashed_by: { type: string, required: false }
      trash_reason: { type: string, required: false }

  ref_edge:
    description: >
      Normalized directional lookup edge derived from typed refs. Used for fast
      reverse traversal and cross-resource navigation.
    fields:
      source_ref: { type: typed_ref, required: true }
      target_ref: { type: typed_ref, required: true }
      relation: { type: string, required: true }
      discovered_at: { type: datetime, required: true }
      source_event_ref: { type: typed_ref, required: false }
      source_artifact_ref: { type: typed_ref, required: false }

resources:
  topic:
    description: >
      First-class durable work subject. Topics are the canonical place to track
      lifecycle state, intent, and linked evidence for organizational work.
    fields:
      ref: { type: typed_ref, required: true, ref: identity_concepts.ResourceRef }
      handle: { type: string, required: true, ref: identity_concepts.ResourceHandle }
      id: { type: string, required: false, ref: identity_concepts.InternalResourceUUID }
      state:
        type: string
        required: true
        ref: enums.lifecycle_state
        description: >
          Canonical lifecycle state derived from `trashed_at` / `archived_at`
          like document.state.
      title: { type: string, required: true }
      summary:
        type: string
        required: true
        description: "Short description; stored in the workspace `topics.summary` column (not in topic JSON extensions)."
      owner_refs: { type: "list<typed_ref>", required: true }
      thread_id: { type: string, required: false, description: "Backing thread id for topic timeline and events." }
      document_refs: { type: "list<typed_ref>", required: true }
      board_refs: { type: "list<typed_ref>", required: true }
      related_refs: { type: "list<typed_ref>", required: true }
      created_at: { type: datetime, required: true }
      created_by: { type: string, required: true }
      updated_at: { type: datetime, required: true }
      updated_by: { type: string, required: true }
      provenance: { type: object, required: true, ref: provenance }
      archived_at: { type: datetime, required: false }
      archived_by: { type: string, required: false }
      trashed_at: { type: datetime, required: false }
      trashed_by: { type: string, required: false }
      trash_reason: { type: string, required: false }
      timeline_message_count:
        type: integer
        required: false
        description: >
          Derived `/topics` list enrichment: non-trashed `message_posted` timeline events on
          `thread_id`; omitted elsewhere; clients treat omission as zero.

  document:
    description: >
      Canonical mutable document lineage anchored to a typed subject ref. The
      contract surface is `subject_ref`, `head_revision_ref`, `state`, and
      `refs` plus standard lifecycle/provenance fields. `state` is the sole
      document lifecycle field and uses enums.lifecycle_state. Docs are the
      cross-machine knowledge base for agents: `source` points at the canonical
      origin when a doc aggregates, and `tags` (including `knowledge`) mark
      agent-facing entries. Comments are the backing-thread discussion, exposed
      with stable event refs (`event:<handle>`) that survive document revisions.
      Threaded replies use `reply_to`. Authors may edit or delete their own comments.
      Git-repo ingest/sync is a follow-up, not this contract.
    fields:
      ref: { type: typed_ref, required: true, ref: identity_concepts.ResourceRef }
      handle: { type: string, required: true, ref: identity_concepts.ResourceHandle }
      id: { type: string, required: false, ref: identity_concepts.InternalResourceUUID }
      title: { type: string, required: true }
      summary:
        type: string
        required: false
        description: >
          Optional short blurb for list and detail headers; stored on the document row
          (distinct from per-revision artifact summary).
      source:
        type: string
        required: false
        description: >
          Canonical origin this document aggregates: a URL or typed ref. Empty when
          the document itself is the source of truth. Knowledge docs should always set this.
      tags:
        type: "list<string>"
        required: false
        description: >
          Operator/agent labels. Tag `knowledge` marks docs meant for agents
          (see `GET /docs?knowledge=true` and `tag=`).
      hosts:
        type: "list<string>"
        required: false
        description: >
          Host names this knowledge fact applies to (machine hostname or operator alias).
          Empty means unspecified. `GET /docs/search?host=` matches documents whose
          `hosts` list contains that name.
      verified_at:
        type: datetime
        required: false
        description: >
          When an agent last verified this knowledge fact on the recorded hosts.
          Omitted when never verified.
      subject_ref: { type: typed_ref, required: true }
      head_revision_ref: { type: typed_ref, required: true }
      state:
        type: string
        required: true
        ref: enums.lifecycle_state
        description: >
          Canonical document lifecycle state derived from lifecycle detail
          fields: `trashed_at` present -> `trashed`, `archived_at` present ->
          `archived`, otherwise `active`.
      refs: { type: "list<typed_ref>", required: true }
      created_at: { type: datetime, required: true }
      created_by: { type: string, required: true }
      updated_at: { type: datetime, required: true }
      updated_by: { type: string, required: true }
      provenance: { type: object, required: true, ref: provenance }
      revision_count:
        type: integer
        required: false
        description: >
          Derived `/documents` list enrichment: count of immutable rows in revision lineage for this document.
      head_revision_character_count:
        type: integer
        required: false
        description: >
          Derived list enrichment only: approximate Unicode scalar values (decoded UTF-8 rune count)
          for the durable head revision body. Omitted when the blob is large or unreadable.
      timeline_message_count:
        type: integer
        required: false
        description: >
          Derived `/documents` list enrichment when backing `thread_id` is present (`message_posted`
          timeline, excluding trashed events). Not returned from document-by-id payloads; clients treat
          omission as zero for list rows.
      last_comment:
        type: object
        required: false
        description: >
          Derived `/documents` list enrichment: the most recent `message_posted` comment on the
          backing thread (excluding trashed events). Omitted when the document has no comments.
        fields:
          body: { type: string, required: true }
          created_at: { type: datetime, required: true }
          created_by: { type: string, required: false }

  document_revision:
    description: >
      Immutable append-only revision in a document lineage. Revision lineage is
      expressed canonically through typed refs (`document_ref`,
      `prev_revision_ref`, `artifact_ref`) even when runtime/storage layers also
      expose convenience fields such as revision numbers.
    fields:
      ref: { type: typed_ref, required: true, ref: identity_concepts.ResourceRef }
      handle: { type: string, required: true, ref: identity_concepts.ResourceHandle }
      revision_id: { type: string, required: false, ref: identity_concepts.InternalResourceUUID }
      document_ref: { type: typed_ref, required: true }
      prev_revision_ref: { type: typed_ref, required: false }
      artifact_ref: { type: typed_ref, required: true }
      revision_number: { type: integer, required: true }
      summary: { type: string, required: false }
      created_at: { type: datetime, required: true }
      created_by: { type: string, required: true }

  board:
    description: >
      Durable coordination surface over topics and cards. Boards own layout,
      column policy, and operator-facing grouping, while linked resources are
      represented through typed refs.
    fields:
      ref: { type: typed_ref, required: true, ref: identity_concepts.ResourceRef }
      handle: { type: string, required: true, ref: identity_concepts.ResourceHandle }
      id: { type: string, required: false, ref: identity_concepts.InternalResourceUUID }
      role: { type: string, required: false, description: "Open board role; initiatives selects active board cards for Overview. Empty clears; patch omission preserves." }
      title: { type: string, required: true }
      summary:
        type: string
        required: false
        description: >
          Optional one-line description for list rows and board headers (operator-facing).
      state:
        type: string
        required: true
        ref: enums.lifecycle_state
        description: >
          Canonical lifecycle state derived from `trashed_at` / `archived_at`
          like document.state.
      primary_topic_ref: { type: typed_ref, required: false }
      thread_id: { type: string, required: false, description: "Backing thread id for board timeline and events." }
      document_refs: { type: "list<typed_ref>", required: true }
      card_refs: { type: "list<typed_ref>", required: true }
      card_refs_truncated: { type: boolean, required: false, description: "Single-card create echoes only the created membership; list board cards for the collection." }
      pinned_refs: { type: "list<typed_ref>", required: true }
      created_at: { type: datetime, required: true }
      created_by: { type: string, required: true }
      updated_at: { type: datetime, required: true }
      updated_by: { type: string, required: true }
      provenance: { type: object, required: true, ref: provenance }
      archived_at: { type: datetime, required: false }
      archived_by: { type: string, required: false }
      trashed_at: { type: datetime, required: false }
      trashed_by: { type: string, required: false }
      trash_reason: { type: string, required: false }

  card:
    description: >
      First-class board work item. Cards can point at a topic, a backing thread,
      and supporting documents, but card identity is not derived from those refs.
      On create, the server allocates a backing thread id; clients MUST NOT send
      thread_id on board-card writes.
    fields:
      ref: { type: typed_ref, required: true, ref: identity_concepts.ResourceRef }
      handle: { type: string, required: true, ref: identity_concepts.ResourceHandle }
      id: { type: string, required: false, ref: identity_concepts.InternalResourceUUID }
      board_ref: { type: typed_ref, required: true }
      topic_ref: { type: typed_ref, required: false }
      thread_id: { type: string, required: true, description: "Backing thread id for the card; server-assigned when persisted." }
      document_ref: { type: typed_ref, required: false }
      head_revision_ref: { type: typed_ref, required: true }
      head_revision_number: { type: integer, required: true }
      title: { type: string, required: true }
      summary: { type: string, required: true }
      column_key: { type: string, required: true, ref: enums.board_column_key }
      plan: { type: object, required: false, ref: initiative_plan }
      plan_state: { type: object, required: false, ref: initiative_plan.computed }
      rank: { type: string, required: true }
      assignee_refs: { type: "list<typed_ref>", required: true }
      due_at: { type: datetime, required: false, description: "Optional due instant for the work item." }
      definition_of_done: { type: "list<string>", required: false, description: "Acceptance lines for completing the card." }
      risk: { type: string, required: true, ref: enums.work_item_risk }
      resolution: { type: string, required: false, ref: enums.card_resolution, description: "Null while active; `done` only when the card is in the done column with evidence in resolution_refs." }
      resolution_refs: { type: "list<typed_ref>", required: true }
      related_refs: { type: "list<typed_ref>", required: true }
      created_at: { type: datetime, required: true }
      created_by: { type: string, required: true }
      updated_at: { type: datetime, required: true }
      updated_by: { type: string, required: true }
      provenance: { type: object, required: true, ref: provenance }

  card_revision:
    description: >
      Immutable append-only content revision in a card lineage. Placement and
      state changes stay on the mutable card row; only title, summary, and
      definition_of_done are versioned here.
    fields:
      ref: { type: typed_ref, required: true, ref: identity_concepts.ResourceRef }
      handle: { type: string, required: true, ref: identity_concepts.ResourceHandle }
      revision_id: { type: string, required: false, ref: identity_concepts.InternalResourceUUID }
      card_ref: { type: typed_ref, required: true }
      prev_revision_ref: { type: typed_ref, required: false }
      artifact_ref: { type: typed_ref, required: true }
      revision_number: { type: integer, required: true }
      summary: { type: string, required: false }
      created_at: { type: datetime, required: true }
      created_by: { type: string, required: true }

reference_conventions:
  description: >
    Required refs per event kind.
    Thread-scoped events are durably anchored by `event.thread_id` and a matching
    `thread:<thread_id>` ref when they belong to a backing timeline. Human
    coordination uses `human_attention_requested`, `human_attention_responded`,
    and `human_attention_withdrawn`;
    legacy decision/intervention event types are not part of the current product
    vocabulary.

  event_refs:
    _rule: "Thread-scoped events SHOULD set thread_ref on the event payload."

    topic_created:
      refs_must_include: ["topic:<topic_handle>"]

    topic_updated:
      refs_must_include: ["topic:<topic_handle>"]

    topic_archived:
      refs_must_include: ["topic:<topic_handle>"]

    topic_restored:
      refs_must_include: ["topic:<topic_handle>"]

    topic_trashed:
      refs_must_include: ["topic:<topic_handle>"]

    message_posted:
      thread_id: "required as thread_ref when the message belongs to a backing thread"
      optional_payload:
        next:
          description: >
            The author's promise for the next signal on the subject: {at, what}. `at` uses
            the review_by grammar (UTC date, zoned RFC3339 timestamp or positive s/m/h/d
            duration resolved from the event ts); `what` is free text of at most 160
            characters and is never validated. A missing or far promise never rejects a write.
        evidence_refs:
          description: >
            Typed refs that evidence progress. A note resets the promise clock only when at
            least one evidence ref resolves (bounded check, at most 8 refs). A note that only
            moves `next` records a promise move.

    document_created:
      refs_must_include: ["document:<document_handle>", "document_revision:<revision_handle>", "artifact:<artifact_handle>"]

    document_revised:
      refs_must_include: ["document:<document_handle>", "document_revision:<revision_handle>", "artifact:<artifact_handle>"]

    document_trashed:
      refs_must_include: ["document:<document_handle>"]

    document_restored:
      refs_must_include: ["document:<document_handle>"]

    board_created:
      refs_must_include: ["board:<board_handle>"]

    board_updated:
      refs_must_include: ["board:<board_handle>"]

    card_created:
      refs_must_include: ["card:<card_handle>", "board:<board_handle>", "card_revision:<revision_handle>", "artifact:<artifact_handle>"]

    card_updated:
      refs_must_include: ["card:<card_handle>", "board:<board_handle>"]

    card_moved:
      refs_must_include: ["card:<card_handle>", "board:<board_handle>"]
      payload_must_include: ["column_key"]

    card_archived:
      refs_must_include: ["card:<card_handle>", "board:<board_handle>"]

    card_trashed:
      refs_must_include: ["card:<card_handle>", "board:<board_handle>"]

    card_resolved:
      refs_must_include: ["card:<card_handle>", "board:<board_handle>"]
      payload_must_include: ["resolution"]

    run_recorded:
      refs_must_include: ["card:<card_handle>"]
      payload_must_include: ["run_id", "outcome"]
      description: >
        A generic recurring-work receipt. Exactly one subject card ref; card plus run_id
        replays the original event atomically. Summary is one line, 1..280 characters.
        Unknown payload/experiment keys are rejected. run_id is 1..200 characters;
        outcome is acted, measured, no_op or infra_error. Optional started_at and
        finished_at are RFC3339 (finished_at defaults to event time). metrics has at
        most 16 series-name keys (120 characters) with finite numeric values.
        experiment requires candidate (1..200) and decision (kept, reverted, rejected),
        with optional finite score_before/score_after. effect_refs has at most 10
        typed refs or HTTP/HTTPS URLs (including url: refs; schemes are case-insensitive).

    exception_raised:
      payload_must_include: ["subtype"]

    human_attention_requested:
      refs_must_include: ["thread:<thread_id>"]
      payload_must_include: ["kind", "title", "subject_ref", "requester_actor_id", "response_proposals"]
      optional_payload:
        by:
          description: >
            The requester's deadline for the human (review_by grammar, resolved from the
            request event ts). Core derives decide_by and overdue_for from it. It is not a
            promise by the agent.
        blocks:
          description: >
            Typed refs (at most 20) this decision blocks. A blocks ref that reaches a
            terminal state stops counting automatically; readers only see refs they can read.
        priority:
          description: Optional agent-set badge, p0..p3. Writers send the canonical value; readers still fold the enums.priority aliases (critical/urgent, high, medium/normal, low) found in older asks. A sort key after decide_by and blocks, never a deadline.
      authoring: >
        Reuse payload.title for a one-line decision (recommended maximum 100 Unicode
        characters; hard maximum 160 on new writes) and payload.body for Markdown
        context, options with consequences, recommendation and evidence. Missing
        body warns in the CLI. Historical titles remain readable without migration.

    human_attention_responded:
      refs_must_include: ["inbox:<inbox_item_id>"]
      payload_must_include: ["inbox_item_id", "kind", "response_text", "outcome", "responding_actor_id"]

    human_attention_withdrawn:
      refs_must_include: ["event:<request_event_id>"]
      payload_must_include: ["request_event_id", "request_event_ref", "withdrawn_by_actor_id", "reason"]

    agent_notification_read:
      refs_must_include: ["artifact:<wakeup_id>"]

    agent_notification_dismissed:
      refs_must_include: ["artifact:<wakeup_id>"]

derived:
  board_summary:
    fields:
      card_count: { type: integer, required: true }
      cards_by_column: { type: object, required: true }
      unresolved_card_count: { type: integer, required: true }
      resolved_card_count: { type: integer, required: true }
      document_count: { type: integer, required: true }
      latest_activity_at: { type: datetime, required: false }

  board_card_summary:
    fields:
      decision_request_count: { type: integer, required: true }
      decision_count: { type: integer, required: true }
      recommendation_count: { type: integer, required: true }
      document_count: { type: integer, required: true }
      inbox_count: { type: integer, required: true }
      latest_activity_at: { type: datetime, required: false }
      due_at: { type: datetime, required: false }

  projection_freshness:
    description: Derived freshness metadata for projection-backed scan surfaces.

  inbox_item:
    description: >
      Human attention queue item derived from explicit human_attention_requested
      events, closed by human_attention_responded events, or withdrawn by its requester.
      Pinned authored-report review reminders are derived without an attention event
      and are visible only to their recipient with current subject access.
    fields:
      id: { type: string, required: true }
      kind: { type: string, required: true, description: "Open classifier; v1 known values are ask, review, escalate and report_review. report_review is an author-only deadline reminder." }
      response_proposals:
        type: "list<string>"
        required: true
        description: >
          Ordered response suggestions from the requesting agent. report_review returns
          an empty list; attention request kinds require minimum 1 and maximum 6
          entries after trimming, dropping empty strings, and exact-string deduplication
          (first occurrence wins). Each entry is at most 240 Unicode characters. The first
          entry is the recommended response for operator UI.
      thread_id: { type: string, required: false, description: "Backing thread id for the inbox item and response correlation." }
      subject_ref: { type: typed_ref, required: true }
      request_event_ref: { type: typed_ref, required: false }
      source_event_ref: { type: typed_ref, required: false }
      title: { type: string, required: true }
      body: { type: string, required: false }
      related_refs: { type: "list<typed_ref>", required: true }
      recipient_actor_id: {type: string, required: false, description: Principal-specific visibility; current subject privacy still applies.}
      panel_id: {type: string, required: false}
      revision_ref: {type: typed_ref, required: false}
      subtype: {type: string, required: false}
      requester_actor_id: { type: string, required: false }
      requester_agent_id: { type: string, required: false }
      requester_label: { type: string, required: false }
      severity: { type: string, required: false }
      batch:
        type: object
        required: false
        description: >
          Present on one ask-batch inbox item derived from 2-10 human_attention_requested events
          filed through POST /asks/batch. Holds `id` (shared batch id) and `asks`: the still-open
          members with their own request_event_ref, title, body, subject_ref and
          response_proposals. One response answers every member atomically; the item disappears
          when the last member is answered or withdrawn. Top-level response_proposals then carry
          the first member's proposals for compatibility; decision UIs use batch.asks entries.

  agent_notification:
    fields:
      wakeup_id: { type: string, required: true }
      status: { type: string, required: true, ref: enums.agent_notification_status }
      target_handle: { type: string, required: true }
      target_actor_id: { type: string, required: true }
      thread_ref: { type: typed_ref, required: false }
      trigger_event_ref: { type: typed_ref, required: true }
      related_refs: { type: "list<typed_ref>", required: false, description: "All ask and answer events included in one debounced answer wake." }
      created_at: { type: datetime, required: true }
      read_at: { type: datetime, required: false }
      dismissed_at: { type: datetime, required: false }

lifecycle_rules:
  mutation_model:
    - "Events and artifacts are append-only."
    - "Topics, documents, boards, and cards are mutable resources with explicit provenance."
    - "Document revisions are immutable append-only records."

  concurrency_tokens:
    - "topic.updated_at"
    - "document.updated_at"
    - "board.updated_at"
    - "card.updated_at"

  ref_lookup_rules:
    - "Reverse navigation MUST be reconstructible from typed refs and ref_edge rows."
    - "Cards resolve related evidence through resolution_refs and related_refs."

grounding_rules:
  restricted_fields:
    description: >
      Evidence-backed mutations require explicit provenance and refs. Topic,
      board, document, and card lifecycle state is derived from archive/trash
      timestamps; card resolution remains the restricted terminal work-state
      mutation.
    fields:
      - "card.resolution -> done"
      - "any shipped/sent/deployed assertion"

  interpretive_fields:
    description: May change without supporting revision artifacts when clearly marked as interpretive.
    fields:
      - "topic.summary"
      - "card.summary"

operational:
  secret:
    description: >
      Workspace-scoped encrypted credential. Secrets store sensitive values
      (API keys, tokens, service accounts) that agents consume via environment
      injection. Values are encrypted at rest with AES-256-GCM; only metadata
      is returned by default — the plaintext requires an explicit reveal action.
    fields:
      id: { type: string, required: true }
      name: { type: string, required: true, description: "Unique human-readable key (e.g. OPENAI_API_KEY). Used as the env var name in `anx secret exec`." }
      description: { type: string, required: false, description: "Optional human note about this secret's purpose." }
      created_at: { type: datetime, required: true }
      updated_at: { type: datetime, required: true }
      created_by: { type: string, required: true }
      updated_by: { type: string, required: true }

staleness:
  rule: >
    Launch threads do not carry cadence or next-check-in semantics in JSON, so the
    core does not infer staleness from backing-thread bodies. Operators may still
    record `exception_raised` with subtype `stale_topic` manually; derived inbox
    treats that like other risk exceptions.

# Unified work tracking extends cards, never a second commitment identity.
work_tracking:
  version: "1"
  canonical_entity: card
  project_entity: topic
  source_identity: [authority, connection_id, native_id]
  source_authority_immutable: true
  decision_revision: nonempty external source.revision, otherwise <work_metadata.version>.<head_revision_number> (decimal components; metadata and card content mutations both change the fence)
  phase: [backlog, ready, in_progress, blocked, review, done, cancelled, unknown]
  freshness: [unknown, fresh, stale, error]
  observation_status: [reported, verified, uncertain, error]
  refresh_error: [policy_denied, rate_limited, permission, unavailable, not_found, configuration, invalid_output, resource_limit, isolation_unavailable]
  remote_verification: reported
  local_annotations: [cadence, goal, labels, roles, project_ref, priority, next_actor, next_action, blockers, wake_condition, start_at, due_at, relations, executions, source_refs]
  invariants:
    - External workflow fields can only be projected from attributed observations.
    - Observation timestamps do not imply source activity or meaningful progress.
    - Failed refreshes retain the last good observation with its age and error.
    - refresh.last_error and freshness.last_error share {code, message}; code is the collector kind, not a generic read_failed.
    - Replay keys bind content; conflicting reuse is rejected.
    - On read, next_action stays the stored annotation unless a live note promise is newer than that write. The note's next step replaces a stored next_action whose server stamp is missing or earlier than the note. An annotation or ask outcome written after the note keeps its text. The stamp is server-owned and is not a writable annotation. context, brief and card summaries name the same stated next: the live note promise when one exists, otherwise the earliest dated open plan step.
    - Source sequence wins over observer clocks; older observations remain in history.
    - Native completion requires existing non-trashed workspace resolution refs, checked in the canonical write transaction.
    - Source completion is an attributed claim, not independent acceptance verification.
    - Queued refresh is not a successful read.

conversational_pm:
  onboarding_state: [not_onboarded, connected, offline]
  onboarding_fields: [state, last_seen, runner, host]
  onboarding_error_code: pm_not_onboarded
  connection_ttl_seconds: 90
  storage: workspace_sqlite
  work_identity: card
  conversation_scope: [workspace_id, actor_id]
  decision_read_scope: workspace
  decision_answer_scope: actor_id
  decision_dispatch_scope: actor_id
  action_acknowledgement_scope: actor_id
  undeliverable_pending_acknowledgement: preserves_approval_and_detail_requires_fresh_proposal_to_deliver
  action_acknowledgement_fields: [acknowledged_by, acknowledged_at, closed_without_delivery]
  turn_lease_error_codes: [lease_required, lease_mismatch]
  turn_failure_kind: [expired, pm_not_onboarded]
  decision_provenance: [proposed_by, origin_kind, turn_id]
  decision_origin_kind: [human, pm_turn, channel]
  phase_action_target: payload.phase
  decision_status: [awaiting_answer, answered, declined, superseded]
  action_status: [pending_delivery, sending, delivered, acknowledged, source_reported, verified, failed, unknown]
  channel_identity: [transport, tenant_id, channel_id, thread_id, external_user_id]
  invariants:
    - Conversations persist at most eight pinned context_refs including legacy work_ref; turns copy these refs for scoped runner prompts.
    - Only the configured PM actor holding the live lease may append turn activity via heartbeat. Increasing sequence numbers make identical retries idempotent; conflicting retries fail. Retain at most fifty short status or tool labels and targets, never raw tool payloads.
    - Partial answer snapshots require an increasing partial_sequence, are bounded by max_output_bytes, and remain drafts until complete; reads share conversation visibility and never expose lease credentials.
    - All work.phase proposals validate payload shape before persistence using the dispatch validation sentence.
    - Identical request-key proposal replays return HTTP 200 with response-only replayed true; non-awaiting decisions also expose replayed_terminal_status without creating another request.
    - Decision deliverable and delivery_path are read-only projections of the action executor registry; absent delivery routes project none.
    - Closing an undeliverable pending action records closed_without_delivery and a human-readable receipt naming the actor and stating nothing was sent.
    - Done proposals validate every resolution ref; decision payload.resolution is read-only and derived at response time.
    - Runner leases use ANX_PM_LEASE_TTL (default 60s), bounded by the turn deadline. Token-authenticated heartbeat renews the lease; runners renew at a cadence strictly less than TTL/2. Expired leases are reclaimable without failing the turn or clearing history.
    - Same-runner claims recover the existing unexpired lease before allocating; owner release requires runner_id and lease_token and returns sending with claimed false.
    - Expired turns carry failure_kind expired; turn_closed errors expose the reason and name the deadline.
    - Human acknowledgement preserves later read-only reconciliation and its acknowledgement metadata; it never enables reconciliation for unsent failures.
    - Human acknowledgement handles failed or unresolvable unknown actions without modifying receipt history; it is not proof of delivery.
    - PM authentication failures use the core 401 auth error contract; authorization failures remain 403.
    - PM turn response operations require the configured PM actor; an empty identity fails closed.
    - Identical turn proposals reuse the awaiting decision for workspace, actor, work_ref, scope, target revision, payload and instruction; changed intent supersedes it atomically with superseded_by and superseded_reason.
    - Reusing a request key with a changed target revision conflicts with existing_decision_id in error details; source revisions are opaque and cannot be ordered.
    - Direct proposals require a human; agents propose through turns addressed to a requesting human. Human channel proposals retain origin_kind human and store channel identity in origin.
    - A different non-human proposal is blocked by an awaiting human-origin decision only on the same approver actor, work, and scope in the workspace.
    - Claim returns 429 busy with reason capacity, in_flight, limit and waiting when eligible waiting work exists at the workspace lease cap; runners sleep one poll interval. No waiting work returns 204 even at capacity; owned lease recovery remains allowed.
    - Open turns expire on reads and periodic maintenance even without a runner.
    - Action deliverable reflects configured executors; unavailable dispatch records no attempt and leaves the action unchanged.
    - Pending actions and failed actions with no sent attempt have nothing to reconcile and return invalid_request.
    - Failed action status never regresses to unknown during read-back.
    - attempts.sent_at records entry into executor handoff, not confirmed delivery; preflight failures and confirmed native failures before commit omit it; native commit uncertainty is resolved by canonical read-back when possible.
    - New decisions record proposed_by and origin_kind; PM turn proposals also record turn_id. Supersession preserves each record's proposer.
    - Rejected decisions are declined; legacy superseded records without superseded_by are read as declined. Superseded is reserved for replacements.
    - Superseded decisions persist superseded_by_proposed_by and superseded_by_origin_kind from their replacement when known.
    - Native post-commit canonical store read-back is independently verified in dispatch; external reports remain source_reported.
    - Open turn complete, fail, propose and context require an active lease; release or lease expiry requires claiming first.
    - Replacement proposals persist supersedes with the replaced decision ID and supersedes_proposed_by / supersedes_origin_kind when known; create/propose responses, replays and reads expose this attribution.
    - Human approval and scope-specific authority are required for downstream actions.
    - Answer and durable delivery intent are atomic; an answer is not an applied outcome.
    - Revalidate source revision before dispatch; source tools must enforce the same precondition.
    - Unknown remote sends require reconciliation and cannot be blindly replayed.
    - Read-back evidence is required for independent verification.
    - Channel mappings are exact and do not inherit personal credentials or permission.
    - Missing PM provider or action executor returns unavailable, never fabricated success.

command_center:
  version: "1"
  enrollment_ttl_seconds: 600
  assertion_max_skew_seconds: 300
  presence_fresh_seconds: 1800
  stale_signal_seconds: 86400
  adapter_names: [claude, codex, cursor, omp, generic]
  run_attribution_header: X-ANX-Run-Id
  run_attribution_format: "agentctl/<external_id>"
  run_state_order: [unknown, starting, running, terminal]
  terminal_run_states: [completed, failed, cancelled]
  agent_state_precedence: [waiting_on_human, working, idle, stale]
  errors:
    host_slug_taken: { status: 409, meaning: Requested host slug is already enrolled or reserved. }
    adoption_proof_invalid: { status: 401, meaning: An adoption key or signature is invalid, revoked, or does not bind this request. }
    adoption_conflict: { status: 409, meaning: Adoption would duplicate a host/name or re-parent an already derived principal. }
    enrollment_pending: { status: 409, meaning: Interactive completion preceded human approval. }
    enrollment_denied: { status: 403, meaning: Human denied this enrollment. }
    enrollment_expired: { status: 410, meaning: Enrollment expired after ten minutes. }
    enrollment_consumed: { status: 409, meaning: Enrollment was already completed or otherwise finalized. }
    enrollment_capacity: { status: 429, meaning: Too many pending host enrollment requests for this workspace or requester source. }
    auth_admin_required: { status: 403, meaning: This action requires a human or explicitly granted auth-admin agent. }
    host_self_revoke: { status: 403, meaning: An agent cannot revoke its own host. }
    human_required: { status: 403, meaning: This action requires a human principal. }
    idempotency_conflict: { status: 409, meaning: An idempotency key was reused with a different response body or target. }
    host_revoked: { status: 403, meaning: Host or its key was revoked. }
    agent_excluded: { status: 403, meaning: This host excludes the requested agent name. }
    agent_revoked: { status: 403, meaning: The derived agent principal was revoked and cannot receive new tokens. }
    agent_handle_taken: { status: 409, meaning: A standalone principal already owns the derived handle; adopt or rename it first. }
    run_identity_conflict: { status: 409, meaning: Composite run key was previously bound to a different agent or immutable identity. }
    run_state_regression: { status: 409, meaning: An observation would replace a terminal state or regress a known state. }
    run_attribution_invalid: { status: 400, meaning: Run header is malformed or does not resolve to the authenticated host and agent. }
  invariants:
    - Bootstrap creates only a human passkey principal; host enrollment requires human or explicitly granted auth-admin approval, or an auth-admin-created headless token.
    - Host assertion and adoption proofs are single-use, timestamp or nonce bound, Ed25519 verified, and recorded transactionally against replay.
    - Excluding a name blocks new token derivation and revokes outstanding derived-agent sessions without deleting its actor or history.
    - A locally excluded legacy profile is omitted from adoption and remains usable only until revoked; no new standalone agent registration exists.
    - Hosts never hold auth-admin. Only a human can grant or revoke auth-admin on an agent; grants are audited and read from durable state on every request.
    - Auth-admin agents cannot issue human invitations or mint human identities or credentials. Human invite redemption requires a human issuer, including in the credential creation transaction.
    - Administration writes revalidate the active principal and its current grant in the write transaction. A removed grant cannot authorize a later commit from an earlier request snapshot.
    - Granting a host-backed agent trusts every process able to read that host's shared key and derive a bearer for that exact agent name; the grant audit includes its host and name.
    - An auth-admin agent cannot revoke its own host. Host patch and all other human-only gates retain their existing policy.
    - Run state is monotonic. Unknown is provisional; terminal states are absorbing. A late running callback cannot replace completed.
    - Run attribution is resolved from the authenticated agent and its host; an unknown external run creates a provisional unknown-state run before recording the write.
    - Waiting on human takes precedence over working, and bridge online is separate from agent state.

# Generic existing-agent participation metadata; not auth enrollment or orchestration.
session_participation:
  version: "1"
  activity_lease_seconds: 120
  session_identity: [authenticated_agent_id, provider, host_scope, native_session_id]
  session_activities: [active, idle, closed]
  participant_identity: [card_id, session_id]
  participant_activities: [active, idle, left]
  capability_states: [supported, unsupported, unknown]
  required_capabilities: [resume, history, logs]
  invariants:
    - Existing authenticated agent principals register sessions without creating authentication grants or credentials.
    - A session is a provider and host-scoped native context, independent of stable ANX principal and per-attempt run.
    - Native identifiers are opaque correlation values; no transcript upload, resume target, or credential is accepted.
    - Session details are owner-only; task reads expose only task-scoped participation and omit another principal's session ID.
    - Session and task activity expire independently after 120 seconds using the server clock; activity is never a lock.
    - Closed sessions are terminal; closing a session never changes task status, ownership, assignees, or source fields.
    - Participant upserts are idempotent on card and session and never imply assignment, dispatch, or task completion.
    - Native and source-owned tasks use the same nonlocking participation records and retain their existing authority.
    - Per-record caller sequences order writes; identical retries do not extend leases, and stale or conflicting sequences fail.
    - Enrolled host namespace is resolved from the authenticated agent; supplied host scope cannot impersonate another host.

# Presentation placement for visual reports. Layout is optional; the renderer
# decides columns from available width and each panel's content.
visual_report_layout:
  schema_version: 1
  nodes: [panel, stack, grid, section, tabs, disclosure]
  limits: {nodes: 100, depth: 6, children_per_container: 32, tabs_per_group: 8}
  grid: {columns: {values: [2, 3, 4], required: false, meaning: Maximum columns; omitted means the responsive default.}}
  row_minimum_widths_px: {tight: 260, text: 380}
  claims_full_row_above_px: 640
  rules:
    - Layout is optional and placement fields are overrides. A report that omits layout, and any panel a layout does not reference, flows through the same responsive grid.
    - Grid columns are a maximum, never a requirement. A grid adds a column only when every panel sharing the row still clears its own minimum useful width, and drops to one column below that.
    - Panel minimum width comes from panel type and the content the panel actually carries, not from the window size or an authored hint. A minimum is what a panel reads at; a column narrower than every minimum still gets the width there is rather than overflowing.
    - A named column count is a maximum at every width, so a grid that names more columns than its panels can read in renders fewer.
    - Wide content claims the full row: plan graphs, charts, series timelines and tables with real columns. Content decides, so an empty table or a planless initiative list is not wide.
    - A nearly empty panel never claims a wide row and never raises its row's minimum, so it cannot push other panels into fewer columns.
    - A panel left alone on a row takes the whole row rather than half of one. Full-row content splits its neighbours into separate groups, and leftovers are decided per group in reading order; panels are never reordered to fill a row.
    - A live panel still reading keeps its type's placement; placement changes only when an observation arrives, never while waiting for one.
    - A span of 2 or more is the full-width override in a grid with no columns. A grid whose children declare spans keeps exact tracks and exact spans, and collapses to one column on narrow screens.
    - Child order in the layout tree is reading order on every width; the renderer never reorders panels to fill a row.

# Additive presentation format carried in existing document revisions.
visual_report_live_panels:
  schema_version: 1
  types: [live-collection, live-loops, live-loop, live-initiatives, live-asks, live-work-mix, live-activity, live-fleet-health, live-cards, live-timeline]
  panel_roles: [primary, secondary, context]
  role_defaults: {live-activity: secondary, authored_text: context, collections_loops_charts: primary}
  collections: [initiatives, loops, agents]
  collection_limit: {default: 24, maximum: 48}
  pins: {maximum: 12, identity: requesting_principal, fallback: workspace_default}
  goal_label: {type: string, max_length: 200}
  query_schema: anx-openapi.yaml#/components/schemas/LiveReportQuery
  materialized_schema: anx-openapi.yaml#/components/schemas/LiveReportResponse
  rules:
    - Static and live panels share projects and the existing layout grammar.
    - Live panel data declares a query, never a stored observation or fetch URL.
    - Reports keep author, provenance, observed_at, freshness and source_ids for compatibility; live observations come only from materialization.
    - Work is open when phase is neither done nor cancelled and lifecycle is active; its board must be active.
    - Checklist parsing counts Markdown dash checkboxes outside fenced code, including uppercase X.
    - Asks include ask, review and escalate requests, with optional answers from the last 168 hours by default.
    - Initiatives and asks may filter to one visible card with card_ref; answered_only on live-asks returns only answered asks and includes recent answers.
    - Fleet health reads declared fleet.* series with provenance and the native host inventory; pending enrollment details are visible only to humans and auth admins. If no fleet.* series is declared, the panel says so and still shows host inventory.
    - Activity retains ref, type, summary, actor_id, ts and count, and adds actor_label, subject (ref, title, kind or null), verb, detail and impact. Current subject titles are batch-resolved with reader access; inaccessible titles are never returned.
    - Activity min_impact accepts high, normal or low and defaults to low for existing panels. Filtering occurs after coalescing and before the response limit.
    - High impact includes creation of an initiative, completion/cancellation/reopening, column or phase moves, asks created or answered, completed plan steps and promise dates set or changed (including already-past dates). Promise notes use message_posted.next; plain messages are excluded. Elapsed time alone does not invent a new historical event.
    - Normal impact includes plan edits without a completed step or date change, meaningful card edits (title, priority, assignee, risk or summary), new cards and authorized PM decision proposals. Board metadata and cosmetic card edits are low impact.
    - Activity bursts coalesce by actor and subject within thirty minutes of the newest event; unknown or inaccessible card subjects never fall back to their board. Highest impact wins and counts sum. Equal-impact ties keep the newest event's verb, summary and detail, including an empty detail; output remains newest first. All reads retain the 200-candidate request budget.
    - Bounded or limited results declare truncated; source read failures are unavailable, never empty success.

initiative_plan:
  description: One optional plan per initiative card; agents add linked steps and never select a view.
  max_steps: 200
  max_dependencies_per_step: 50
  step:
    required: [id, title]
    fields:
      id: {type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', max_length: 64}
      title: {type: string, max_length: 500}
      ref: {type: string, description: 'card:, doc:, document:, topic: or series: ref, or absolute HTTP(S) URL. External GitHub refs/URLs and opaque adapter-published identifier aliases use ingested observations or generic structured source_refs; no network fetch.'}
      after: {type: 'list<string>', description: Existing step ids; unique; graph must be acyclic.}
      due: {type: datetime, description: RFC3339 instant or YYYY-MM-DD date.}
      status: {type: string, values: [done, active, blocked, not_started], description: Fallback only when ref has no known workflow state.}
  computed:
    fields: [steps, progress, critical_path, next_steps, shape, last_movement_at]
    progress: {fields: [done, total]}
    shape: [chain, dag, lanes]
    semantics:
      - A chain is a connected path (including an empty plan); lanes are multiple disconnected paths; all other graphs are dag.
      - Critical path maximizes unfinished steps through sink nodes; done steps have zero weight. Ties use lexicographic step ids.
      - plan_state carries no health; plan_health.state is the one promise vocabulary (see promises).
      - Next steps are unfinished, unblocked steps whose dependencies are all done.
      - Known card/source workflow states override fallback status; context refs (docs/topics/series) have lifecycle state only and use fallback status; done/published/closed/resolved map to done, blocked to blocked, in_progress/in_review/active/review/open to active; other states map to not_started.
      - Source activity and meaningful progress reset recency; unchanged observation timestamps do not. Plan edits reset recency.
      - Plan writes require if_updated_at from cards get or plan show; edits and before/after plans are atomic card_updated events, visible in the card timeline.
      - Live initiatives keep the existing progress and needs array; a plan supplies computed progress, blocked step titles in needs, plan_state and health. Cards without plans keep the existing summary projection.

batch_ref_resolve:
  max_refs: 200
  aggregate_plan_ref_budget: 4000
  evidence_candidates_per_key: 33
  input: {refs: 'list<string>'}
  output: {items: 'list<object>'}
  fields: [ref, kind, title, metric, phase, status, owner, owner_display, board, priority, last_moved_at, next_step, progress, url, resolvable, authority, native_id, connection_id, observed_at, source, plan_health, plan_resolution_truncated, status_mismatch, possibly_moot]
  semantics:
    - Preserve input order and duplicates. Unknown, ambiguous or inaccessible refs remain resolvable false without metadata.
    - Read-side batches authorize candidates, not the request's ref strings. A key shared with an inaccessible publisher still returns its visible evidence; hidden and unknown entries do not reject the batch. Ownership checks remain mandatory when writing refs.
    - Resolve card, doc/document, topic, and board refs by exact handle or internal id. External keys resolve only from visible source observations or generic structured source_refs by their exact published native_id, authority-prefixed native_id, URL, identifier or aliases. Core never parses provider spellings, generates provider URLs or infers authority; adapters publish any desired variants.
    - Series refs use URL-encoded label selectors plus reserved _range (default 30d, maximum 90d) and _baseline options. The metric contains exact latest and baseline observations, delta and freshness; unknown, inaccessible or ambiguous stream selectors stay unresolved without metadata.
    - URLs for native card/document entities are workspace-relative paths; topics and boards have no current UI detail surface and omit url. No caller-supplied origin is trusted.
    - Read access is checked for every resource and referenced plan step. Published evidence keys carry their containing card ownership to referencing plans and work through the central graph before projections, limits or counts; numeric evidence projection IDs are internal. Publishing a key does not itself reference another publisher of that key. Unavailable refs never expose hidden state.

# Push-only data, declared before use; no external URL or credential lives in core.
live_series:
  kinds: [gauge, counter, state]
  aggregations: [last, avg, sum, min, max, count]
  raw_retention_days: 90
  daily_rollup_lifetime: forever
  caps: {series: 1000, label_keys: 8, label_value_utf8_bytes: 128, label_sets_per_series: 100, points_per_day: 100000, push_requests_per_minute: 2400, adapter_push_requests_per_minute: 1200, concurrent_pushes: 4, adapter_concurrent_pushes: 2, query_buckets: 200, query_range_days: 3650, query_step_min_seconds: 1, query_step_max_days: 3650, raw_query_points: 4096, daily_query_rows: 20000, daily_query_edge_points: 200000, out_of_order_days: 90, future_skew_seconds: 300}
  rules:
    - Safety bounds apply to self-hosted and all other deployments independently of commercial quotas.
    - Humans and explicitly granted auth-admins declare, list, revoke and delete workspace-local adapters.
    - Adapters belong to an active enrolled host agent and declare all writable series.
    - Series-write tokens use the existing access-token store, are scoped to one adapter, have no refresh token and allow only point pushes.
    - Default-deny operation/resource capabilities are checked at the request boundary and inside the write transaction; scoped credentials inherit no auth-admin powers.
    - Fixed UTC-minute push request budgets count exact retries, persist across restart, and are shared by all tokens for the same adapter; accepted new or corrected points also consume the daily ingestion budget.
    - Admission bounds reject excess adapter traffic before body reads or database access for recognized scoped credentials; normal human operations do not share these limits.
    - Grant, owner, host, token expiry and revocation are rechecked inside each write transaction.
    - Exact point retries are idempotent; same-timestamp raw corrections are permitted and count toward the daily ingestion cap.
    - An adapter's owning agent can exchange its ordinary authenticated token for a short-lived series-write token.
    - Revoked adapters cannot be reactivated; deletion retains the grant tombstone and invalidates outstanding tokens.
    - Raw points older than 90 days are compacted into daily count, sum, min, max and last rollups; state rollups preserve last state.
    - Rollup update and raw deletion form one atomic idempotent checkpoint; daily rollups have no expiry.
    - Query range and step are bounded, labels are exact-match filters, and query results expose provenance and per-label freshness.
    - Queries use read-only snapshots; steps of at least one day use daily summaries for fully covered interior UTC days and exact retained raw observations for partial edge days. Neither observations nor freshness timestamps include future points. Retention compaction runs separately in maintenance.
    - Raw aggregation examines at most 4096 observations per query. Dense ranges of at least one day downsample to a UTC daily bucket grid without widening the requested interval; shorter dense ranges require a narrower range or label filter.
    - Daily aggregation examines at most 20000 summary rows and 200000 partial-edge raw observations per query; larger requests require a narrower range or label filter. Expired raw edges cannot be reconstructed from daily rollups, so archived summaries contribute only fully covered UTC days. These safety bounds are independent of commercial quotas.
    - Default query steps round up to fit the bucket limit; historical ranges round up to whole days before choosing a whole-day step.
    - Series are stale when now minus the latest observation exceeds twice the adapter expected_interval.
    - Chart, metric, metric-strip and table panels bind source series and may carry a timestamped static fallback.

# Durable notification and wake delivery queue.
delivery:
  channels: {bridge: "agent wake; mirrored from agent_wakeups", others: "declared by adapters via delivers; push and digest for humans"}
  backoff: {initial_seconds: 30, factor: 2, max_seconds: 3600, max_attempts: 6}
  receipts: [notification_delivered, notification_failed]
  addressing: {settings: "address entered by the person; off until set", principal: "no address; on by default for every person; adapter resolves the recipient"}
  rules:
    - One durable queue holds every delivery. Wakes on the bridge channel are mirrored from agent_wakeups; push and digest deliveries go to humans on channels they enable.
    - Each delivery has an idempotency key; enqueueing a repeated key returns the existing row unchanged.
    - Adapters claim due deliveries under a lease with a claim token. Only the owning agent of an active adapter whose declaration delivers the channel may claim or receipt. An expired lease makes the delivery claimable again.
    - Failed retryable deliveries back off from 30 seconds, doubling to 1 hour, and fail permanently after 6 attempts.
    - Receipts notification_delivered and notification_failed are stored in the queue, not the event log.
    - Escalation: when an ask's decide_by passes unanswered, push immediately if the ask's window (decide_by minus asked_at) is at most 2 hours or the ask blocks 3 or more refs; otherwise include it in the daily digest. The PM is woken to answer, withdraw or re-ask.
    - Privacy: push and digest content is built only for principals who can read the ask. The heartbeat attention_summary carries counts and times only.
    - A declaration may limit the kinds its channels accept; core never queues a kind a channel does not accept. Every active declaration of one channel must agree on addressing and kinds.
    - Only a grant from the trusted issuer may declare a principal-addressed channel; host adapter declarations always use settings addressing, so no channel reaches people who did not opt in unless the operator's trusted issuer declared it.
    - A principal-addressed channel needs no address and is on by default for every human principal; a saved setting with both toggles off turns it off. A claim on such a channel carries recipient.external_issuer and external_subject only for humans signed in through an external identity grant, and only to the channel's adapter.
    - A workspace managed-agent grant from the configured trusted issuer may carry a delivers claim {channel, addressing, kinds, label, manage_url} declaring one channel adapter owned by the agent the grant creates; a delivers claim with an empty channel revokes it. Revoking that agent revokes the declaration and a later grant cannot restore it. manage_url, when set, is an absolute https URL of at most 512 bytes, exposed in notification settings channel_options.
    - A claim re-checks that the recipient can still read the ask behind a push; a delivery that can no longer be delivered is canceled and its payload cleared.
    - A skipped receipt closes a claimed delivery as canceled without a failure receipt.
    - The heartbeat attention_summary lists principals who receive notifications with the channels that reach them, their due/overdue/earliest_decide_by over asks they can read, counts_complete, and external_issuer/external_subject for external-grant humans; pending_deliveries counts claimable deliveries per channel. Per-principal counts are read from materialized readability (one row per notified principal and open ask, refreshed in bounded steps by the escalation clock), never computed on the heartbeat path; they may lag an access change by a bounded number of steps.

initiative_overview:
  max_initiatives: 2000
  geometry_max_nodes: 24
  fields: [plan_state, plan_health, plan_resolution_truncated, next_step, plan_step_digest, status_mismatch, possibly_moot, geometry]
  semantics:
    - If any board has role initiatives, only its cards appear as initiatives. Other active cards remain in work. Without a designated board, Overview keeps the existing selection and returns initiatives.hint suggesting the role.
    - Overview uses the same principal-scoped batch plan computation as card reads and live reports, never one query per initiative.
    - Planless initiatives return null plan_state and geometry; plan_health still reads the promise state from the card due_at, wake_condition and notes. Summary progress is preserved.
    - plan_health carries the promise state (past_promise, moving, no_promise, done) and a computed reason. Geometry contains shape, nodes (id, status, layer, after), total_nodes and collapsed_nodes.
    - Geometry uses dependency depth as layer, topological order with lexicographic ties, and at most 24 nodes. Edges only name included nodes; collapsed_nodes counts omitted nodes.
    - plan_step_digest answers what just finished, what is moving and what is next as three lists of at most 3 steps each with the remainder counted in more, from the same steps and referenced facts the read already loaded. completed lists steps a linked resource finished whose resource moved within window_hours (168), newest movement first; a step marked done inline, or linked to a resource whose state says nothing, has no completion time and is omitted rather than dated from a plan edit or a comment. current lists active and blocked steps and next lists ready unstarted steps, so one step never appears in both; both keep the topological order with lexicographic ties that geometry uses. Null without a plan. Overview initiatives only: card and work reads keep their existing plan fields.
    - Open initiatives are selected before closed history, newest update first; counts describe the visible bounded candidate set and truncated declares that additional candidates exist.
    - Ref preview owner_display resolves workspace actor names, falling back to the owner ref. Board metadata requires independent board visibility.
    - Native preview url is a workspace-relative route. Hosted clients prefix it with /o/<org>/w/<ws>; absolute source URLs are used as-is. Never concatenate a hosted prefix onto an absolute URL.
overview_brief:
  route: GET /overview (brief)
  section_limit: 5
  throughput_hours: 24
  fields: [status, generated_at, section_limit, throughput_hours, decisions, since_last_look, at_risk, machine, initiatives]
  semantics:
    - Five computed answers above the fold: what needs a decision, what changed since the previous visit, what is off track and why, whether agents are working, and where each initiative is. No field is hand-maintained and no section depends on a posted report.
    - Derived only from rows the same request already loaded and already filtered - the bounded visit work snapshot, the assembled needs_you rows, since_you_last_looked and the agent roster. The brief adds no query, no new route and no O(workspace) pass; its cost is one pass over data already in memory.
    - Counts describe the authorized set. Denied access lowers a count and never surfaces as a hidden-item hint; blocks counts only dependents the caller can see and is a lower bound.
    - decisions ranks needs_you by blocking open work (1000 per visible dependent), then overdue (600) or due within 48 hours (300), then priority (critical/p0 320, high/p1 200, medium/p2 80, low/p3 20), then a blocked phase (150), then age at a third of a point per hour capped at 30 days (240); ties break oldest first then by id. Work priorities p0-p3 and the word spellings fold to one scale. Age tops out below critical so a stale question cannot outrank a fresh p0. reason carries at most three computed clauses.
    - since_last_look groups changes against the previous visit baseline; first_visit distinguishes no baseline from no change. Groups are ordered and empty groups omitted. A completed-step row carries step_id, because two steps of one initiative share its ref.
    - newly_blocked counts transitions, not current state: the visit snapshot records each card's phase, and a card already blocked at the previous visit, or one whose previous phase is unknown, is reported as updated. Editing a blocked card is not a new blocker.
    - at_risk reports only past_promise rows with a computed reason, longest past first; a row without a computed reason is omitted.
    - machine reuses the roster's derived states and the three-way silence split: stuck requires an open run or a held card, so offline and never-enrolled identities are not alarms. finished_24h and agents_finished_24h come from visible cards closed inside throughput_hours and survive a roster read failure.
    - initiatives orders by the shared promise order (past_promise, no_promise, moving, done) and reports by_state counts for all of them, so no_promise is visible as a gap rather than reported as moving.
overview_changes:
  route: GET /overview/changes
  max_items: 100
  max_event_candidates: 200
  baseline_scope: Authenticated principal within this workspace database (one workspace per deployment).
  semantics:
    - GET /overview includes since_you_last_looked computed against the previous visit, then atomically records the current visit timestamp and bounded state snapshot. The changes endpoint reads without advancing the baseline.
    - A first visit or unauthenticated dev read has null since and no changes; no anonymous shared baseline is stored.
    - Steps completed and promise transitions are net changes from previously visible plan step statuses and promise state; newly visible initiatives have no prior state and are not reported as transitions.
    - Completed steps include now-closed initiatives. An initiative newly past its promise is reported once relative to the saved baseline as initiative_past_promise, including time-only transitions.
    - Asks answered use canonical human_attention_responded events in (since, generated_at]; new decisions use permission-filtered PM records created in that interval.
    - Items expose only current readable refs and generic answer or decision labels, never private conversation text. Ref visibility is rechecked before publication.
    - Results are capped at 100; truncated covers candidate or output limits and bounded snapshots. Repeated digest reads do not change the baseline.

plan_health:
  fields: [state, reason, since, promise, past_promise_for_seconds, promise_moves, last_evidence_at]
  states: [past_promise, moving, no_promise, done]
  semantics:
    - Added on card reads, lists, refs resolve, reports and initiative overview alongside existing plan_state and progress.
    - The state is the promise fold (see promises). A live note promise is the stated next, so reason names that note's next step and date. Open plan-step due dates, the effective card due_at, and the first RFC3339 instant or YYYY-MM-DD date inside wake_condition (date-only resolves to midnight UTC; the first 1024 bytes are scanned) are milestones and supply the counted promise only when no live note promise remains. A done or cancelled card is done.
    - Resets that meet a note promise are a linked plan-step resource moving, a plan-step status change, a changed source observation and a note carrying resolved evidence. A plan edit meets milestone promises inside the horizon and updates last evidence; it does not meet a note promise. Card discussion without evidence is not a reset.
    - There is no inactivity threshold and no per-card horizon. NoPromiseFallback (7 days) only orders no_promise rows by last evidence.
    - since is promise.at for past_promise, last_evidence_at for moving and no_promise, and null for done or when unknown.
    - next_step contains id/title/ref of a ready unblocked unfinished step, preferring critical path then lexicographic id; unreadable linked resources are skipped. Null when none is ready.
    - status_mismatch is true only for backlog cards with completed plan steps. Computation never changes phase.

possibly_moot:
  fields: [flagged, reason, sources, code, ask_ref, decided_at]
  shape: {flagged: boolean, reason: string, sources: integer, code: string, ask_ref: string, decided_at: timestamp}
  semantics:
    - Emitted beside status_mismatch on card reads, lists, refs resolve, the plan response and the initiative overview, always present there as flagged false when not flagged. On inbox items the field appears only on an open ask-shaped item whose linked sources the page's resolver actually evaluated; anything else omits the key, so the scoped readmodel hydration mirrors the HTTP payload byte for byte.
    - Only sources ANX has actually observed count as terminal: a done card, or a PR observed merged or closed through the observation cache. A card stored in backlog or ready is flagged possibly moot when at least one linked source is known and every linked source has reached a terminal state (done, cancelled, closed, merged, published or resolved). An open ask is flagged on the same rule over its subject_ref and related_refs.
    - Linked sources are the card's plan step refs and its related_refs annotation, resolved through the same batched evidence-backed resolution as plan facts; a PR URL resolves merged through the ingested observation that published it, never through a network fetch at read time.
    - Context-only refs (document, topic, board, thread) neither contribute to nor block the set. Every other linked source must be observed: a ref with no fact, an unresolved one (including a card invisible to the reader, or a ref dropped by the shared ref budget), or one whose workflow state is unknown withholds the linked-source rule entirely — an unobserved or unknown source never counts as terminal, and the evidence never names it. sources counts the known sources. Zero sources withholds the linked-source rule. The next-ask rule can flag with sources still zero.
    - reason is evidence, not advice; "all 2 linked sources are merged" uses the common source status when uniform, otherwise "all N linked sources are done". When the next-ask rule is what flags the card, reason is the code next_ask_decided. If both rules flag, reason stays the linked-source sentence and code carries next_ask_decided.
    - The ask rule uses the phase the brief shows (placement), not the raw column key. A card placed in backlog, ready, in_progress, or review is flagged when its newest live note (the note brief.v1 shows as note; the same note supplies a note promise when it carries next) contains an explicit event:<id> ref to an inbox ask or review. Stored blocked is placed in in_progress and stored in_review is placed in review, so both are eligible. done and cancelled stay closed. The ref must resolve to a human_attention_requested the reader can see whose state is answered (including outcome resolved, but not needs_context), withdrawn, or expired (resolution or expires_at in the past; expiry is decided even when the outcome is needs_context). At most 8 event refs are read from that note, in appearance order. Prose that does not cite event:<id> is ignored. A newer note that does not cite the ref clears the flag. ask_ref is event:<id> and decided_at is the answer, withdrawal, or expiry instant. The linked-source rule stays on stored backlog and ready.
    - An ask the reader cannot see — hidden by the scoped events relation or by the same PM-private filter as other brief rows — does not flag and is not named. The evidence never reveals that a withheld ask was answered.
    - The ask lookup is skipped unless the latest note cites an event ref. It is one indexed seek per batch of at most 200 refs (brief_asks primary key, plus idx_events_handle_unique for a handle spelling), bounded by the page, never by workspace size.
    - Computation never mutates phase or closes anything. The flag only surfaces evidence so a human or agent can close the card or ask itself; it may be stale the moment it is computed and never suppresses asks or notifications on its own.

inbox_summary:
  route: GET /inbox/summary
  semantics:
    - Workspace-local open human ask count and top N visible asks, priority then oldest first then id. Default 5, limit 0..50; zero returns only the count.
    - Uses the caller's existing workspace permissions; excludes private threads and hidden subjects before counting. Shared workspace human asks are visible to every authorized human reader.
    - Reads existing materialized inbox rows without workspace-wide freshness scan. No cross-workspace identity or aggregation in core.

source_refs:
  storage: Card-backed work annotation; writable by any adapter through work.create or version-fenced work.patch.
  max_items: 2000
  identity: [authority, connection_id, native_id]
  fields: [authority, connection_id, native_id, identifier, identifier_aliases, aliases, title, url, status, phase, observed_at, source_activity_at]
  semantics:
    - Source identity fields are required nonempty strings; identities are unique within a list. Authority and status are open strings and unknown fields round-trip.
    - URL is absolute HTTP(S) without credentials; observed_at and source_activity_at are optional RFC3339 timestamps. identifier_aliases contains at most 50 unique nonempty strings of at most 2048 bytes; legacy identifier is also read as an exact alias. These same caps apply to source, observation facts, and evidence; evidence contains at most 2000 objects. Every indexed string is at most 2048 UTF-8 bytes. Evidence is stored once with bounded lookup references; migration projects at most 2000 entries and 50 aliases per spelling from each legacy array. Core never recognizes provider-specific identifier prefixes.
    - Omission preserves the list; an explicit array replaces it and an empty array clears it. Readers and ref resolution honor the card and board access scope.
    - Core consumes only structured annotations, source identities and observations. Adapter markdown is never parsed, and unchanged source polls are not meaningful activity.

plan_health_inputs:
  semantics:
    - Effective due_at uses an explicitly present work annotation (including clearing) before cards.due_at. Unchanged source polls are not observations.
    - Aggregated plan refs resolve in batches of at most 200; source evidence uses an indexed, transactionally maintained projection and candidate pages of at most 200.

# Compatibility: aliases is an exact-key alternate spelling of identifier_aliases.

access_requests:
  grants: [auth-admin]
  statuses: [pending, approved, denied]
  semantics:
    - Agents request grants only for their authenticated principal with a reason.
    - Requests are durable and idempotent per principal and grant; retries preserve the original reason and terminal decision.
    - Only active humans approve or deny. Approval performs the existing auth-admin grant in the same transaction as the decision and Inbox response.
    - Each request creates a review Inbox item. Its access_request_id, requested_grant and requester_principal_id correlate the structured request.
    - The existing Inbox respond flow accepts approved or rejected for access requests; answered and acknowledged return 400 invalid_request without any response event or mutation.
    - Pending counts include requests and unexpired host enrollments awaiting completion (pending or approved).
    - Inbox correlation is server-owned in the persisted access-request row. Generic attention-event payload fields never authorize grants or choose their target.
    - The requesting agent awaits access-request:<id> through the existing ask subscription and outcome stream. Approved exits 0 and denied exits 9. Another agent cannot read that request by typed ref, event id, or public event handle. The decision reuses the ask answer wake.

visual_report_review:
  provenance_classes: [live, authored]
  panel_fields:
    authored_at: {type: timestamp, required: false}
    review_by: {type: string, required: false, description: UTC date, zoned timestamp or positive s/m/h/d duration of at most 3650d from authored_at.}
  rules:
    - Live query panels and series bindings resolve as live; all other panels resolve as authored.
    - New authored panels carry author, authored_at and review_by. authored_at requires review_by; legacy panels missing both remain valid.
    - Legacy authored_at falls back to report.generated_at; missing review_by defaults to authored_at plus 7 days, exposed as review_by_defaulted.
    - Explicit review_by must resolve after authored_at. Newly introduced or changed deadlines must not be in the past at document write time. Revisions may retain an expired deadline for the same panel, author and authored_at when its resolved deadline is unchanged.
    - Status-like authored panels warn with a live alternative, without invalidating the report.
    - Pinned-dashboard read checks create at most 32 review reminders, deduplicated durably per panel and revision; identity resolution is independent of reader-visible actor profiles, and recipients must have current subject access.
    - report_review reminders are informational, with no reply, acknowledge or dismiss mutation; clients may open the dashboard. Revising or unpinning the dashboard hides obsolete reminders.
    - live-cards filters bounded card candidates by board_refs, label, role and status; closed phases are included only for this panel type.
    - live-timeline binds an existing state or numeric series through source; core never fetches external events.

work_summary:
  schema: WorkSummary
  read_field: work_summary
  migrated_alias: summary (opt-in via summary=1)
  prose_read_field: summary_text
  semantics:
    - Supported card-bearing reads opt in with summary=1 to computed work_summary.status with state, label and reason. Default card collections preserve legacy shapes and complete results. Board roles select cards only.
    - Card and work write inputs retain their string summary. Card revision content remains prose. Default responses add no summary fields or pagination; summary=1 adds work_summary, aliases it at summary and preserves prose in summary_text. Stored phase and legacy plan fields remain unchanged.
    - status is the card's promise state (past_promise, moving, no_promise, done), identical to plan_health.state, with a computed label and reason. Placement (the stored phase) is not a status. no_plan is never a summary status; hints contains no_plan for absent or empty plans. Clients decide whether that hint matters in context.
    - Agent detail opts in with summary=1 to at most 50 recent-card candidates, selected through indexed assignment and current/recent-run refs before hydration and batch enrichment; cards_truncated marks the bounded preview and is always true for scoped readers so hidden candidate counts cannot be inferred.
    - Progress appears for a nonempty plan or explicit child relations; steps appear only for a plan. next names the live note promise when one exists, otherwise a ready plan step. Owner, due, age, last_movement_at and external source appear only when known.
    - Opt-in card and board-card pages contain at most 50 cards with next_cursor. Topic and card timeline bundles and board workspace computed previews cap candidates at 50 before enrichment and signal cards_truncated; their legacy bundles remain complete. Summary SQL batches contain at most 50 card ids. Plan/child refs share bounded resolution and truncated refs remain unknown. Attention samples indexed oldest-first candidates before canonical visibility and recipient checks; a truncated count is a lower bound.
    - Series refs in card refs, related_refs and plan step refs expose at most eight metrics per card, under a shared 200-ref budget. Metrics compare the exact latest raw point to the first point in the selected range (up to 90 days) or a declared numeric baseline; state values compare without numeric delta. Missing, denied or ambiguous streams expose no value.
    - Attention links through subject_ref and related_refs, deduplicates asks and exposes oldest waiting age in seconds; needs_you rows sort oldest wait first.
    - Inbox related_cards is a bounded batch of readable card previews, never an authority grant. Work search uses the same summary as work lists; document-only search contains no cards.
    - Inbox stream identity uses canonical summary inputs, creation and oldest-ask timestamps. Elapsed age, oldest_age, rolling digest windows and timer-only health changes never change event IDs; underlying plan, progress, ownership, due, movement, source and attention changes do.

curation:
  description: >
    Formula and PM curation proposals. A proposal is never an action: it is a
    human_attention_requested ask (kind ask) whose payload.curation names the
    action and its targets, addressed to a human. response_proposals[0] accepts;
    any other answer dismisses. Accepting performs the action as the answering
    human through normal authority and posts an undo trail (message_posted with
    payload.curation_applied) in the proposal thread. No new object type.
  payload:
    curation:
      action: { type: string, enum: [withdraw, merge, batch], required: true }
      targets: { type: array, items: ref, required: true, description: "withdraw: [event:<ask id>]; merge: [duplicate card ref, kept card ref]; batch: 2-10 member ask event refs." }
      key: { type: string, required: true, description: Stable key over action and sorted targets; one open proposal per key, none after dismissal. }
      source: { type: string, enum: [formula, pm], required: true }
      rationale: { type: string, required: true }
  rules:
    - Withdraw as moot reuses possibly_moot. Only sources observed as terminal count; one unknown or unresolved source means no proposal; sources are counted, never named.
    - Withdrawing another principal's ask is only ever proposed (I4). A requester withdraws its own ask directly.
    - Restricted asks and initiatives are never formula candidates, so a proposal never names a private ref or title.
    - Merge duplicates compares at most 200 open initiatives by title token similarity or shared non-context refs (default threshold 0.8). Accepting archives the duplicate; undo restores the card.
    - Batch groups open, unbatched asks by subject, else thread, in groups of 2 to 10. Accepting records the grouping server side (curation_batch_members); brief.v1 decisions then collapse the open members into one decision with a batch field, and undo removes the grouping. Answering that decision answers every still-open member.
    - A reader sees a proposal only when it can read every target; brief.v1 drops pm_proposal decisions naming a card or ask the reader cannot read.
    - Each pass reads at most 200 open asks, 200 open initiatives and 200 resolved refs.
  applied_trail:
    payload_must_include: ["curation_applied"]
    fields:
      proposal_event_id: { type: string, required: true }
      action: { type: string, required: true }
      targets: { type: array, items: ref, required: true }
      applied_by: { type: string, required: true }
      result: { type: string, enum: [applied, failed, skipped], required: true }
      undo: { type: object, required: false, description: Enough prior state to reverse the action (for merge the duplicate's prior phase). }
  metrics:
    window: Default 30 days, at most 90. Reads at most 2000 asks and 5000 notes; truncated marks a larger window.
    s17: Weighted median hours from human_attention_requested to human_attention_responded; weight is 1 + count of payload.blocks refs. Curation proposals excluded.
    s18: Of answered asks, share whose response_text equals response_proposals[0] and share with outcome needs_context; of asks, share withdrawn with a moot or overtaken reason 24h or more after filing.
    s20: Per card thread, a note with next.at opens a promise; a later note without evidence that changes next.at moves it; a reset (note with evidence, a step status change, a linked step moving, or an observation) after the note meets it. A plan edit does not. Open promises past due are unmet with slip to now.

promises:
  description: >
    One clock: promise versus evidence. A promise is a field on things agents already write,
    never an object, table or status enum. Durations are computed at read time.
  sources: [note, plan_step, due_at, wake_condition]
  rules:
    - "Which promise counts: a live note promise is the stated next. That is each principal's latest message_posted note, when it carries payload.next, that evidence, a step status change, a linked step moving, or a changed observation has not met; the earliest such note wins. Plan-step due dates, the effective due_at, and the first date inside wake_condition are milestones and supply the counted promise only when no live note promise remains, in which case the earliest unmet at wins."
    - "Met: a promise is met when a reset event lands before its `at`. A met promise no longer counts. A plan edit meets a milestone promise inside the horizon and does not meet a note promise."
    - "Reset: a note carrying a resolvable evidence ref, a plan-step status change, a linked step resource moving, newly linked or materially changed structured source_refs, or a changed source observation meets a note promise and updates last_evidence_at. A plan edit updates last_evidence_at and meets a milestone promise when it lands in (at-2d, at]."
    - "Clear: a principal's newer note without next replaces their promise with none; it does not revive an older next. CLI warns note_clears_promise with the previous next and a carry-forward command. Setting next on a card without assignees warns note_promise_unowned."
    - "Source evidence is compared on write; newly linked or materially changed structured entries and promoted changed observations advance a server-authored watermark. Poll timestamps, order and unlinking alone do not advance it. Reads consume the watermark, never rescan history."
    - "Move: a note that changes the author's latest next.at without a resolving evidence ref records a move. promise_moves counts moves since the last reset."
    - "Grammar: `at` reuses the review_by grammar; `what` is free text up to 160 characters."
    - "Horizon: a promise beyond 2 days warns at write time and shows its distance; it is never a state."
    - "Blocks: human_attention_requested payload.blocks refs that reach a terminal state clear automatically."
    - "Fallback: an active initiative with no promise reads no_promise. The only duration fallback is the constant plans.NoPromiseFallback (7d, no env knob): a no_promise row whose last evidence is older is quiet. It never creates a state; TestStalenessKnobs pins it as the single knob."
  derived_outputs: [past_promise_for, promise_moves, decide_by, overdue_for]
  states:
    past_promise: "The counted promise's `at` is in the past and no reset event landed since."
    moving: "A counted promise exists and is still in the future."
    no_promise: "An open initiative with no counted promise."
    done: "The initiative is done or cancelled."

brief:
  schema: brief.v1
  route: GET /brief
  description: >
    The principal's brief for this workspace: what needs their decision, how each initiative
    stands against its promise, their own open asks, and asks answered for them. The same
    object backs Decide, Watch and `anx orient --json`. Facts are materialized on write events;
    durations (age, overdue_for, past_promise_for) are computed at read time. One workspace
    only; aggregation across workspaces happens in a hosted shell, never in core.
  cli_output:
    command: anx orient --json
    result: The result field is the verbatim GET /brief brief.v1 object, without CLI-local keys.
    workspace:
      location: Top-level CLI envelope field, separate from result; omitted by other commands.
      fields: [alias, base_url, source, other_aliases]
      description: Locally resolved workspace identity, selection source and other configured aliases. Adds no core read.
  sections: [decisions, initiatives, your_asks, answered_for_you]
  section_limit: 50
  decision_kinds: [ask, review, access, host, pm_proposal]
  initiative_owner: Nullable first canonical assignee ref, matching work list; no new health state.
  initiative_states: [past_promise, moving, no_promise, done]
  placements: [backlog, ready, in_progress, review, done]
  decision_order: "decide_by ascending (absent last), then blocks_count descending, then priority (critical/p0, high/p1, medium/p2, low/p3, absent), then created_at ascending, then ref."
  initiative_order: "past_promise (longest past first), moving (soonest promise first), no_promise (oldest last evidence first), done (most recent first)."
  rules:
    - "Every count and ref is filtered by the reader's access; nothing reveals a withheld ref, title or value."
    - "Reads are bounded: indexed lookups, at most section_limit rows per section, truncated flags when more exist."
    - "decide_by is derived from human_attention_requested payload.by; overdue_for is now minus decide_by when positive, 0 before, null without decide_by."
    - "followed_recommendation is true when the response text equals the first response proposal."
    - "For agent readers, an initiative carries yours: true when the calling agent is assigned to the card, participates in it, or authored its counted promise."
    - "A decision with a batch field stands for every open member the reader can see. Its inbox_item_id is the single respond target: POST /inbox/{inbox_item_id}/respond with one response_text, outcome and notify_mode records that same answer on every still-open member in one transaction and replays on the same idempotency key. A filed batch (key filed:<batch_id>) uses the derived inbox id inbox:{kind}:{thread}:{batch_id}:{anchor_event_id}, the same id the inbox projection stores, so the atomic batch path runs. An accepted curation batch uses inbox:curation-batch:<key>. Each member lists its own inbox_item_id, subject_ref and the blocks the reader can see. Members the reader cannot see are not listed, counted, or revealed by the answer; a batch with a hidden open member is not answerable."


  loop_rules:
    - "Initiative loop is null unless cadence or goal exists or a run was recorded within 30 days."
    - "Done, cancelled and archived cards retain loop data with health unknown and reason done."
    - "Health precedence: two latest infra_error runs => failing; cadence missed by over twice every_seconds => overdue; no acted-or-kept effect within progress budget (default 7d) with runs => stalled; effect within budget => healthy; otherwise unknown. No-run cadence age starts at cadence assignment."
    - "effects_7d counts runs in the last seven days with outcome acted or experiment decision kept, counting each run once; overview stats sum the same counts."
    - "recent_runs newest first at most 12; goal points oldest first at most 60. Best follows goal direction; series_ref uses scoped UTC daily rollups instead of receipt metrics."

attention_records:
  semantics:
    - No models run in ANX. Placements and human feedback are workspace-local records.
    - Latest placement per subject, recipient actor and placer wins. A human-designated attention agent takes precedence; absent that agent's placement, newest placement wins.
    - Open asks addressed to the human are always Decide. No placement may demote them.
    - Every principal reads its own attention items by default; any human or auth-admin may select another principal. Any human may read feedback, with for defaulting to me; workspace agents read all workspace feedback by default. Resource visibility always applies.
    - Placements are canonical records with indexed reference ownership. attention_feedback is a protected event written by its dedicated endpoint. Reasons and notes preserve inherited resource visibility.
    - Attention visits are keyed by authenticated principal and document identity or builtin:initiatives. No agent may record a human visit. Legacy Overview uses its own builtin:overview key.
    - First visit returns null since and no changes. Reads never advance attention baselines.
    - Bounded pages have opaque continuations. Placement pages order by subject identity; rank sorts within each page. Mandatory asks precede placement and default pages.
