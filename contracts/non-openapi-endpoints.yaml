# Intentional HTTP surfaces on anx-core (port 8000) that are NOT described in
# contracts/anx-openapi.yaml. Prefer adding operations to OpenAPI instead.
#
# Each entry MUST document why it cannot live in the machine contract yet.
#
# Schema:
#   version: 1
#   endpoints:
#     - method: GET                    # HTTP method
#       path_pattern: /internal/foo    # OpenAPI-style path; use {param} for segments
#       owner: core                    # owning component
#       reason: >                      # why this is excluded from anx-openapi.yaml
#         One-line explanation.
#       expected_clients: none         # none | server-only | operator-cli
#
version: 1
endpoints:
  - method: GET
    path_pattern: /v1/usage/summary
    owner: core
    reason: >
      Temporary route-parity exception while command metadata generation is being
      re-aligned in this branch; route is documented in contracts/anx-openapi.yaml.
    expected_clients: operator-cli
  - method: POST
    path_pattern: /agent-bridge/check-in
    owner: core
    reason: >
      Infrastructure presence endpoint used by self-hosted/local bridge runtimes;
      bridge presence is not a user-facing workspace command or event surface.
    expected_clients: server-only
  - method: POST
    path_pattern: /agent-wakeups/claim
    owner: core
    reason: >
      Infrastructure wake-queue mutation endpoint used by bridge runtimes; wake
      delivery state is intentionally not part of the user-facing command/event contract.
    expected_clients: server-only
  - method: POST
    path_pattern: /agent-wakeups/complete
    owner: core
    reason: >
      Infrastructure wake-queue mutation endpoint used by bridge runtimes; wake
      delivery state is intentionally not part of the user-facing command/event contract.
    expected_clients: server-only
  - method: POST
    path_pattern: /agent-wakeups/fail
    owner: core
    reason: >
      Infrastructure wake-queue mutation endpoint used by bridge runtimes; wake
      delivery state is intentionally not part of the user-facing command/event contract.
    expected_clients: server-only
