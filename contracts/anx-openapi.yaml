      x-anx-concepts: [agents, notifications]
      x-anx-stability: beta
      parameters:
        - name: thread_id
          in: query
          required: true
          description: Backing thread public ref (`thread:<handle>`) or thread handle whose agent notification receipts should be streamed.
          schema: { type: string }
        - name: last_event_id
          in: query
          required: false
          description: Resume after this receipt stream event id (alternative to the `Last-Event-ID` header; the header wins when both are set). A currently visible untrashed receipt whose payload still matches continues after that receipt. A visible receipt whose payload changed resumes at that receipt and delivers the current state. Private, unknown, and trashed ids are indistinguishable and start at the current head, without replaying earlier receipts.
          schema: { type: string }
        - name: Last-Event-ID
          in: header
          required: false
          description: SSE resume header (preferred over the `last_event_id` query). A currently visible untrashed receipt whose payload still matches continues after that receipt. A visible receipt whose payload changed resumes at that receipt and delivers the current state. Private, unknown, and trashed ids are indistinguishable and start at the current head, without replaying earlier receipts.
