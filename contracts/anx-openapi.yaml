  /auth/token:
    post:
      operationId: issueAuthToken
      summary: Exchange host assertion or refresh auth tokens
      description: 'grant_type=host_assertion requires host_id, key_id, agent_name, signed_at, signature. Sign UTF-8 bytes of `anx-host-agent-token|<host_id>|<key_id>|<agent_name>|<signed_at>` with the host Ed25519 key and send base64 signature. signed_at is RFC3339 UTC, within 5 minutes of server time. Core atomically records a hash of message and signature; replay fails. The name is lowercase `[a-z][a-z0-9-]*` (1–32 characters). Discovered adapters use claude, codex, cursor, omp, or generic; other names are explicit personas. The returned agent handle is `<agent_name>.<host_slug>`. Missing agents are created lazily with stable actor ID. Excluded names, revoked agents, and revoked hosts receive no token. Host grants return only a short-lived agent access token, no refresh token. Existing grants apply only to their existing eligible principals; agent-key assertion cannot mint derived agents. grant_type=workspace_human_grant and workspace_managed_agent_grant exchange a signed grant from the configured trusted issuer; send issue_refresh_token=false to receive an access token without a refresh token. Grant exchanges are rate limited per caller address (each attempt reserves a request before signature work; grants that verify and are unused return it) and per principal and grant type for grants that verify (issuer and subject for humans; issuer, workspace, organization and slot for managed agents); replays never spend the principal budget. Both return 429 with Retry-After.'
      tags: [auth]
      x-anx-surface: utility
      x-anx-command-id: auth.token
      x-anx-cli-path: auth token
      x-anx-why: Assertion or refresh-token exchange for bearer access.
      x-anx-input-mode: json-body
      x-anx-streaming: { mode: none }
      x-anx-output-envelope: "Host assertion returns `{ agent, tokens: { access_token, token_type, expires_in } }`; other grants retain their existing `{ tokens }` envelope."
      x-anx-error-codes: [invalid_request, invalid_token, key_mismatch, host_revoked, agent_excluded, agent_handle_taken, agent_revoked, rate_limited, auth_unavailable]
      x-anx-concepts: [auth]
      x-anx-stability: beta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
      responses:
        '200':
          description: Token bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'

