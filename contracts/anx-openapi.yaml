  /docs/search:
    get:
      operationId: searchDocuments
      summary: Search documents
      tags: [docs]
      x-anx-surface: canonical
      x-anx-command-id: docs.search
      x-anx-cli-path: docs search
      x-anx-why: Full-text search over document title, body, and comments so agents can find knowledge another host wrote.
      x-anx-input-mode: none
      x-anx-streaming: { mode: none }
      x-anx-output-envelope: "Returns `{ documents, next_cursor?, search_coverage }`. Each document may include `search_rank` (higher is better)."
      x-anx-error-codes: [auth_required, invalid_request, invalid_token, search_repair_pending]
      x-anx-concepts: [docs]
      x-anx-stability: beta
      x-anx-examples:
        - title: Search knowledge
          command: anx docs search "runbook" --knowledge --limit 20
      x-anx-agent-notes: >
        Default search uses independent current document heads and comments. AND terms
        may span the current head and live comments of one authorized document.
        Punctuation-normalized phrases must match one resource. Latin diacritics
        fold as in the released unicode61 tokenizer (remove_diacritics=1).
        Each resource covers at most 65536 source/normalized bytes and 4096 distinct terms.
        Results use stable document order, not corpus-wide BM25 ranking. Pages contain at
        most 100 documents and can be empty with next_cursor while bounded candidates are
        verified. Follow next_cursor until absent. Content, authority, filter or reader-mode
        changes invalidate cursors; restart without cursor. search_coverage describes the
        active reader, including on empty pages. An operational aggregate fallback preserves
        its legacy FTS5 semantics and refuses stale results while lazy repair is pending (503).
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/LifecycleState' }
          description: Lifecycle states; defaults to active.
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
          description: Search query over title, body, and comments.
        - name: knowledge
          in: query
          required: false
          schema: { type: boolean }
          description: When true, only documents tagged `knowledge`.
        - name: tag
          in: query
          required: false
          schema: { type: string }
          description: Restrict results to documents that include this tag.
        - name: host
          in: query
          required: false
          schema: { type: string }
          description: Restrict results to documents whose `hosts` list includes this host name.
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: Opaque query/filter/principal/generation-bound cursor; restart without cursor after invalidation.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
          description: Page size; omit to return up to 50 hits.
      responses:
        '503':
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: Ranked document search hits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentsResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

