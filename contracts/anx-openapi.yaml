          allOf:
            - $ref: '#/components/schemas/InternalResourceUUID'
          description: Internal card UUID/debug id retained for admin/verbose compatibility.
      required: [purged, card_ref, card_handle]

    EventResponse:
      type: object
      properties:
        affected_event_ids:
          type: array
          maxItems: 2001
          items: { type: string }
