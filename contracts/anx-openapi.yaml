      x-anx-streaming: { mode: sse }
      x-anx-output-envelope: 'SSE `agents_changed` messages with JSON `{ "revision": <integer> }`; no agent data or event-log cursor.'
      x-anx-agent-notes: This is an ephemeral invalidation stream. Refetch the roster on connect, notification, and reconnect; do not treat revisions as durable event IDs.
