        '401': {$ref: '#/components/responses/ErrorResponse'}

  /hosts/{host_id}/bridge/check-in:
    post:
      operationId: checkInHostBridge
      summary: Check in host bridge
      description: Host self-authentication through the three host proof headers. Sign UTF-8 `anx-host-bridge-check-in|<host_id>|<signed_at>|<base64url(SHA256(raw request body))>` with the active host key. Timestamp skew is at most five minutes and message/signature replay is rejected. One bridge instance sends a complete workspace-local agent/job snapshot, at most 256 KiB. Each actor must belong to this active enrollment and not be excluded. Server expiry is 300 seconds. A different non-retired incarnation may replace the current one only with a signed timestamp strictly newer than its accepted timestamp high-water mark. Within one incarnation, sequence must increase; a backward clock step is accepted without lowering that mark. Proof skew/replay checks still apply. After a restart during a backward clock step, replacement waits until signed time exceeds the stored mark. Only enabled, ready wake jobs imply agent wake-online; answers alone do not.
      tags: [hosts]
      x-anx-surface: utility
      x-anx-command-id: hosts.bridge.check_in
      x-anx-cli-path: host bridge check-in
      x-anx-why: Record a host bridge heartbeat for wake routing.
      x-anx-input-mode: json-body
      x-anx-streaming: {mode: none}
      x-anx-output-envelope: Returns `{ bridge }`.
      x-anx-error-codes: [auth_required, invalid_request, key_mismatch, host_revoked, not_found]
      x-anx-concepts: [hosts, agents]
      x-anx-stability: beta
      x-anx-agent-notes: Host proof is required; no agent bearer or per-agent bridge proof is accepted.
      parameters:
        - {name: host_id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/HostKeyID'}
        - {$ref: '#/components/parameters/HostSignedAt'}
        - {$ref: '#/components/parameters/HostSignature'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/HostBridgeCheckInRequest'}}}}
      responses:
        '200': {description: Bridge presence, content: {application/json: {schema: {$ref: '#/components/schemas/HostBridgeResponse'}}}}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}

