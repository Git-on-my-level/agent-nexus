      properties:
        state: {type: string, enum: [not_onboarded, connected, offline]}
        last_seen: {type: string, format: date-time, nullable: true}
        runner: {type: string, nullable: true, maxLength: 80}
        host: {type: string, nullable: true, maxLength: 80}
