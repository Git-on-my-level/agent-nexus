      properties:
        actor_id: {type: string, minLength: 1, maxLength: 256}
        jobs: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/HostBridgeJob'}}
    HostBridgeCheckInRequest:
      type: object
      additionalProperties: false
      description: Workspace-only complete snapshot; omissions clear coverage. Signed timestamp orders incarnations; sequence orders one incarnation. No paths, commands, counters or errors. Server expiry is 300 seconds.
      required: [instance_id, sequence, config_revision, version, agents]
      properties:
        instance_id: {type: string, minLength: 1, maxLength: 128}
        sequence: {type: integer, minimum: 1}
        config_revision: {type: integer, minimum: 0}
        version: {type: string, minLength: 1, maxLength: 64}
        agents: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/HostBridgeAgent'}}
    HostBridgePresence:
      type: object
      required: [host_id, instance_id, sequence, version, last_seen_at, expires_at]
      properties:
        host_id: {type: string}
        instance_id: {type: string}
        sequence: {type: integer}
        version: {type: string}
        last_seen_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    HostBridgeResponse:
      type: object
      required: [bridge]
      properties:
        bridge: {$ref: '#/components/schemas/HostBridgePresence'}
    HostBridgeStatusRequest:
      type: object
      additionalProperties: false
      required: [host_ids]
      properties:
        host_ids: {type: array, maxItems: 100, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 256}}
    HostBridgeStatusResponse:
      type: object
      required: [as_of, hosts]
      properties:
        as_of: {type: string, format: date-time}
        hosts:
          type: array
          items:
            type: object
            required: [host_id, revoked_at, bridge, agents, agents_truncated]
            properties:
              host_id: {type: string}
              revoked_at: {type: string, nullable: true, format: date-time}
              bridge:
                oneOf:
                  - {$ref: '#/components/schemas/HostBridgePresence'}
                  - {type: 'null'}
              agents: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/HostBridgeAgent'}}
              agents_truncated: {type: boolean}
    AuthTokenRequest:
      type: object
      description: Existing grant payloads keep their documented fields; host_assertion requires the host fields below.
      properties:
        grant_type: {type: string, enum: [host_assertion, refresh_token, assertion, workspace_human_grant, workspace_managed_agent_grant]}
        host_id: {type: string}
        key_id: {type: string}
        agent_name: {$ref: '#/components/schemas/AgentName'}
        signed_at: {type: string, format: date-time}
        signature: {type: string, contentEncoding: base64}
        refresh_token: {type: string}
        agent_id: {type: string}
        assertion: {type: string}
        issue_refresh_token:
          type: boolean
          default: true
          description: 'Only for workspace_human_grant and workspace_managed_agent_grant. false issues an access token alone: the response has no refresh_token and core stores no refresh session. Callers that exchange a fresh grant whenever they need access should send false. Rejected with invalid_request for other grant types.'
      required: [grant_type]
    AuthTokenResponse:
      type: object
      properties:
        agent: {$ref: '#/components/schemas/AgentSummary'}
        tokens:
          type: object
          properties:
            access_token: {type: string}
            token_type: {type: string, enum: [Bearer]}
            expires_in: {type: integer, minimum: 1, description: Seconds until access-token expiry.}
            refresh_token: {type: string, description: Never present for host_assertion or for a grant exchange sent with issue_refresh_token=false.}
          required: [access_token, token_type, expires_in]
      required: [tokens]
    RunState:
      type: string
      enum: [starting, running, completed, failed, cancelled, unknown]
    RunLiveness:
      type: string
      enum: [alive, stale, unknown]
      description: Independent observation of launcher process liveness; terminal runs are never active.
    Run:
      type: object
      additionalProperties: false
      properties:
        id: {type: string}
        ref: {type: string, pattern: '^run:.+', description: Public typed run reference.}
        handle: {type: string}
        launcher: {type: string, enum: [agentctl]}
        external_id: {type: string, minLength: 1}
        host_id: {type: string}
        agent_id: {type: string}
        adapter: {$ref: '#/components/schemas/AgentName'}
        model: {type: string, nullable: true}
        state: {$ref: '#/components/schemas/RunState'}
        liveness: {$ref: '#/components/schemas/RunLiveness'}
        result_collected: {type: boolean}
        labels: {type: array, items: {type: string}}
        card_ref: {type: string, nullable: true, pattern: '^card:.+'}
        repository: {type: string, nullable: true}
        branch: {type: string, nullable: true}
        started_at: {type: string, nullable: true, format: date-time}
        ended_at: {type: string, nullable: true, format: date-time}
        last_observed_at: {type: string, format: date-time}
      required: [id, ref, handle, launcher, external_id, host_id, agent_id, adapter, state, liveness, result_collected, labels, last_observed_at]
    RunUpsertRequest:
      type: object
      additionalProperties: false
      description: 'card_ref may be explicit or derived from exactly one `anx.card.<card-slug>` label (maps to `card:<card-slug>`); explicit value wins when both are present. Times are RFC3339 UTC and cannot be more than two minutes ahead of server time. Preserve earliest started_at, latest last_observed_at and terminal ended_at. A terminal observation closes a nonterminal run despite a modest prior clock skew; terminal states never regress. Active roster runs require an alive observation within five minutes. Duplicate identical requests replay; older nonterminal observations cannot erase newer optional fields.'
      properties:
        launcher: {type: string, enum: [agentctl]}
        external_id: {type: string, minLength: 1}
        host_id: {type: string}
        agent_id: {type: string}
        adapter: {$ref: '#/components/schemas/AgentName'}
        model: {type: string, nullable: true}
        state: {$ref: '#/components/schemas/RunState'}
        liveness: {$ref: '#/components/schemas/RunLiveness'}
        result_collected: {type: boolean}
        labels: {type: array, items: {type: string}}
        card_ref: {type: string, nullable: true, pattern: '^card:.+'}
        repository: {type: string, nullable: true}
        branch: {type: string, nullable: true}
        started_at: {type: string, nullable: true, format: date-time}
        ended_at: {type: string, nullable: true, format: date-time}
        last_observed_at: {type: string, format: date-time}
      required: [launcher, external_id, host_id, agent_id, adapter, state, liveness, result_collected, labels, last_observed_at]
    RunResponse:
      type: object
      additionalProperties: false
      properties:
        run: {$ref: '#/components/schemas/Run'}
      required: [run]
    RunUpsertResponse:
      type: object
      additionalProperties: false
      properties:
        run: {$ref: '#/components/schemas/Run'}
        created: {type: boolean}
        replayed: {type: boolean}
      required: [run, created, replayed]
    RunsResponse:
      type: object
      additionalProperties: false
      properties:
        runs: {type: array, items: {$ref: '#/components/schemas/Run'}}
        next_cursor: {type: string}
      required: [runs]
    AgentSummary:
      type: object
      additionalProperties: false
      properties:
        id: {type: string}
        ref: {type: string, pattern: '^actor:.+', description: The agent's durable actor reference.}
        actor_id: {type: string}
        host_id: {type: string, nullable: true}
        host_slug: {type: string, nullable: true}
        name: {type: string, description: Derived agents use AgentName rules; excluded legacy standalone agents retain their previous username.}
        handle: {type: string, description: Derived agents use `<name>.<host_slug>`.}
        display_name: {type: string}
        identity_kind: {type: string, enum: [derived, adopted, standalone]}
        state: {type: string, enum: [waiting_on_human, working, idle, stale]}
        bridge_online: {type: boolean}
        current_card_ref: {type: string, nullable: true, pattern: '^card:.+'}
        current_card_title: {type: string, nullable: true}
        last_progress_note: {type: string, nullable: true}
        last_progress_at: {type: string, nullable: true, format: date-time}
        active_run: {$ref: '#/components/schemas/AgentActiveRun'}
        open_asks_count: {type: integer, minimum: 0}
        waiting_ask: {$ref: '#/components/schemas/AgentOpenAsk', nullable: true, description: Oldest open ask while waiting_on_human; null otherwise.}
        last_signal_at: {type: string, nullable: true, format: date-time}
        revoked_at: {type: string, nullable: true, format: date-time}
      required: [id, ref, actor_id, host_id, host_slug, name, handle, display_name, identity_kind, state, bridge_online, current_card_ref, current_card_title, last_progress_note, last_progress_at, active_run, open_asks_count, waiting_ask, last_signal_at, revoked_at]
    AgentOpenAsk:
      type: object
      additionalProperties: false
      properties:
        id: {type: string, description: Immutable request event ID.}
        inbox_item_id: {type: string, nullable: true, description: Inbox link target; null only while its derived projection is pending.}
        title: {type: string}
        severity: {type: string, nullable: true, description: Source-provided severity; null when omitted.}
        created_at: {type: string, format: date-time, description: Request event time and wait start.}
        kind: {type: string}
        subject_ref: {type: string, nullable: true}
        subject_title: {type: string, description: Human-readable subject when supplied by the request.}
        requester_actor_id: {type: string}
        requester_agent_id: {type: string, nullable: true}
      required: [id, inbox_item_id, title, severity, created_at]
    AgentActiveRun:
      type: object
      nullable: true
      properties:
        run_id: {type: string}
        adapter: {$ref: '#/components/schemas/AgentName'}
        model: {type: string, nullable: true}
        duration_seconds: {type: integer, minimum: 0}
      required: [run_id, adapter, duration_seconds]
    AgentsResponse:
      type: object
      additionalProperties: false
      properties:
        agents: {type: array, items: {$ref: '#/components/schemas/AgentSummary'}}
      required: [agents]
    AgentDetailResponse:
      type: object
      additionalProperties: false
      properties:
        agent: {$ref: '#/components/schemas/AgentSummary'}
        cards_truncated: {type: boolean, description: Candidate-limited preview; always true for scoped summary=1 readers to avoid revealing hidden population counts.}
        recent_cards: {type: array, items: {$ref: '#/components/schemas/Card'}}
        recent_runs: {type: array, items: {$ref: '#/components/schemas/Run'}}
        open_asks: {type: array, items: {$ref: '#/components/schemas/AgentOpenAsk'}}
        recent_notes: {type: array, items: {$ref: '#/components/schemas/AgentProgressNote'}}
      required: [agent, recent_cards, recent_runs, open_asks, recent_notes]
    AgentProgressNote:
      type: object
      additionalProperties: false
      properties:
        text: {type: string}
        at: {type: string, format: date-time}
        card_ref: {type: string, nullable: true, pattern: '^card:.+'}
      required: [text, at]
    AgentMeResponse:
      type: object
      additionalProperties: false
      properties:
        agent: {$ref: '#/components/schemas/PrincipalSelf'}
        pm: {$ref: '#/components/schemas/PMState'}
      required: [agent, pm]
    PrincipalSelf:
      type: object
      additionalProperties: false
      properties:
        id: {type: string, description: Principal ID; same value as agent_id for compatibility.}
        agent_id: {type: string}
        actor_id: {type: string}
        ref: {type: string, pattern: '^actor:.+'}
        username: {type: string}
        handle: {type: string}
        display_name: {type: string}
        principal_kind: {type: string, enum: [human, agent]}
        auth_method: {type: string}
        identity_kind: {type: string, enum: [derived, adopted, standalone], description: Present for agent principals only.}
        host_id: {type: string, description: Present for derived or adopted agents.}
        host_slug: {type: string, description: Present for derived or adopted agents.}
        name: {type: string, description: Host agent name or standalone handle. Present for agents only.}
        adapter: {$ref: '#/components/schemas/AgentName', description: Default adapter for host-derived agents; generic for an explicit persona.}
        persona: {type: boolean, description: True when the host-derived name is an explicit persona rather than a known adapter.}
      required: [id, agent_id, actor_id, ref, username, handle, display_name, principal_kind, auth_method]
    PresencePatchRequest:
      type: object
      additionalProperties: false
      properties:
        current_card_ref: {type: string, nullable: true, pattern: '^card:.+'}
        note: {type: string, nullable: true, maxLength: 500}
      minProperties: 1
    Presence:
      type: object
      additionalProperties: false
      properties:
        agent_id: {type: string}
        current_card_ref: {type: string, nullable: true, pattern: '^card:.+'}
        note: {type: string, nullable: true}
        observed_at: {type: string, format: date-time}
      required: [agent_id, observed_at]
    PresenceResponse:
      type: object
      additionalProperties: false
      properties:
        presence: {$ref: '#/components/schemas/Presence'}
      required: [presence]
    PMConversation:
      type: object
      additionalProperties: true
      properties:
        id: &id001
          type: string
        workspace_id: &id002
          type: string
        actor_id: &id003
          type: string
        context_refs:
          type: array
          maxItems: 8
          items: {type: string, maxLength: 512}
          description: Pinned typed refs, persisted on the conversation. work_ref remains the primary task for compatibility.
        work_ref: &id004
          type: string
        created_at: &id005
          type: string
        title:
          type: string
        thread_id:
          type: string
        origin:
          $ref: '#/components/schemas/PMOrigin'
    PMOrigin:
      type: object
      additionalProperties: true
      properties:
        transport:
          type: string
        tenant_id:
          type: string
        channel_id:
          type: string
        thread_id:
          type: string
        external_user_id:
          type: string
    PMTurn:
      required: [deadline, claimed]
      type: object
      additionalProperties: true
      properties:
        id: *id001
        workspace_id: *id002
        actor_id: *id003
        work_ref: *id004
        created_at: *id005
        conversation_id:
          type: string
        text:
          type: string
        context_refs:
          type: array
          maxItems: 8
          items: {type: string}
        activity:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/PMTurnActivity'}
        partial_sequence: {type: integer, minimum: 1}
        partial_response:
          type: string
          description: Latest draft answer snapshot, bounded by max_output_bytes. Not a completed answer.
        response:
          type: string
        wakeup_id:
          type: string
        agent_actor_id:
          type: string
        deadline:
          type: string
          format: date-time
          description: Turn completion deadline; open turns expire to failed on reads and periodic maintenance.
        status:
          type: string
          enum:
          - pending_delivery
          - sending
          - delivered
          - unknown
          - failed
        revision:
          type: integer
        evidence_refs:
          type: array
          items:
            type: string
        decision_ids:
          type: array
          items:
            type: string
        failure:
          type: string
        failure_kind:
          type: string
          readOnly: true
          description: Machine-readable failure reason; pm_not_onboarded means explicit uninstall terminated unfinished PM work; expired means the turn deadline elapsed. Absent for failures without a classified reason. Also returned in error.details for turn_closed 409 responses; expiry messages say expired at followed by the RFC3339 deadline.
        claimed:
          type: boolean
          readOnly: true
          description: True while a runner holds an unexpired lease. Only the runner ID is exposed as lease_owner; no lease token is exposed on public turn responses.
        lease_owner:
          type: string
          readOnly: true
          description: Runner ID of the active lease, visible to the requesting actor and configured PM actor. Never a lease token; absent after release or expiry.
        claimed_at:
          type: string
          format: date-time
          readOnly: true
          description: Time of the most recent runner claim, if recorded; retained after completion or expiry.
        max_output_bytes:
          type: integer
        origin:
          $ref: '#/components/schemas/PMOrigin'
    PMHeartbeatTurn:
      description: Renewal response with the new expiry and no lease token.
      allOf:
      - $ref: '#/components/schemas/PMTurn'
      - type: object
        required:
        - lease_expires_at
        properties:
          lease_expires_at:
            type: string
            format: date-time
            description: Renewed lease expiry, never later than the turn deadline.
    PMClaimedTurn:
      description: Authenticated runner claim response; lease credentials are returned only by the claim endpoint.
      allOf:
      - $ref: '#/components/schemas/PMTurn'
      - type: object
        properties:
          activity_supported:
            type: boolean
            readOnly: true
            description: True when this core supports bounded activity in heartbeats. Older cores omit it; direct runners then keep lease-only heartbeats.
          lease_token:
            type: string
          lease_owner:
            type: string
          lease_expires_at:
            type: string
            format: date-time
    PMActionPayload:
      type: object
      additionalProperties: false
      description: Exact action parameters bound to approval; work.phase requires phase. Instruction is prose and is never parsed for a phase. Done proposals require existing non-trashed workspace resolution refs and at least one artifact or event. Dispatch revalidates before the canonical write; missing evidence fails without sent_at and names the ref in receipt.detail.
      properties:
        phase:
          type: string
          enum: [backlog, ready, in_progress, blocked, review, done]
        resolution_refs:
          type: array
          items:
            type: string
        resolution:
          type: array
          readOnly: true
          description: Omitted when empty. Derived on decision responses only, never accepted as input or stored approval parameters. Missing, trashed, or unavailable refs have exists false and an empty title_or_summary; summaries are bounded to 240 characters plus an ellipsis.
          items:
            type: object
            additionalProperties: false
            required: [ref, kind, title_or_summary, exists]
            properties:
              ref: {type: string}
              kind: {type: string}
              title_or_summary: {type: string}
              exists: {type: boolean}
    PMDecision:
      required: [deliverable, delivery_path]
      description: Workspace-visible for reading; only the human actor_id may answer or dispatch. Clients must show answer controls only to that human.
      type: object
      additionalProperties: true
      properties:
        source_authority:
          type: string
          readOnly: true
          description: Trusted source authority captured at proposal and copied to the action for executor routing even after work is purged. Absent on legacy records; live work supplies the legacy fallback.
        replayed:
          type: boolean
          readOnly: true
          description: Response-only; true when a proposal reuses an existing decision. Absent on new proposals and ordinary reads.
        replayed_terminal_status:
          type: string
          readOnly: true
          description: Response-only status of a replayed decision that is no longer awaiting_answer. Absent on awaiting replays and ordinary reads.
        deliverable:
          type: boolean
          nullable: true
          readOnly: true
          description: Derived on every response from the same configured scope/source executor registry as action deliverable. Availability is independent of work lifecycle and does not imply approval, delivery, or a valid source revision. Null means a legacy record has lost both its work and source authority; delivery_path is unknown, never an unconfigured-executor diagnosis.
        delivery_path:
          type: string
          readOnly: true
          description: Configured executor route (for example nexus or github); none when no route is available. Open string for future integrations; configured denotes a legacy unnamed executor. Unknown denotes a legacy record whose source cannot be recovered after work purge; deliverable is null.
        id: *id001
        workspace_id: *id002
        actor_id: *id003
        proposed_by:
          type: string
          readOnly: true
          description: Actor ID of the proposing principal, distinct from actor_id (the human approver). Absent on legacy decisions whose proposer was not recorded.
        origin_kind:
          type: string
          readOnly: true
          enum: [human, pm_turn, channel]
          description: Human principal proposals retain human even through a channel; the existing origin field records the validated channel identity. PM turn proposals use pm_turn. The channel value is retained for legacy records. Absent on legacy decisions without provenance.
        turn_id:
          type: string
          readOnly: true
          description: Originating PM turn ID, present for pm_turn proposals.
        work_ref: *id004
        created_at: *id005
        instruction:
          type: string
        payload:
          $ref: '#/components/schemas/PMActionPayload'
        scope:
          type: string
        target_revision:
          type: string
          description: Copy Work.decision_revision exactly. Core uses source.revision when source.authority is external and the revision is known (nonempty); otherwise it uses <work_metadata.version>.<head_revision_number> (decimal components). Either a canonical metadata mutation or a card content revision changes this fence; refresh attempts, failures, and freshness bookkeeping do not. Dispatch checks the same rule again; freshness.source_revision is not a fallback.
        work_missing:
          type: boolean
          readOnly: true
          description: Derived on every response; true when the referenced work no longer resolves or is trashed or archived. Such decisions remain visible in lists and pages and can be declined or their actions acknowledged or closed by the owner, but cannot be approved or dispatched.
        target_current:
          type: boolean
          nullable: true
          readOnly: true
          description: Derived on every response; true when target_revision equals the referenced work's current decision_revision. False when the work is missing or the revision differs. Null when current work cannot be read or the work reader is unavailable.
        already_at_target:
          type: boolean
          nullable: true
          readOnly: true
          description: Derived on every response; true when a nonempty payload.phase equals the referenced work's current phase. False without a phase payload, when work is missing, or the phase differs. Null when current work cannot be read or the work reader is unavailable.
        can_answer:
          type: boolean
          readOnly: true
          description: Derived for the current reader; true only for the awaiting decision owner with human approval authority and readable existing work. False for missing work; the owner may still decline.
        answer:
          type: string
        superseded_by:
          type: string
          description: Replacement decision ID when a changed proposal supersedes this awaiting decision.
        superseded_by_proposed_by:
          type: string
          readOnly: true
          description: Proposing actor ID of the replacement decision; absent for legacy records with unknown attribution.
        superseded_by_origin_kind:
          type: string
          readOnly: true
          enum: [human, pm_turn, channel]
          description: Origin kind of the replacement decision; absent for legacy records with unknown attribution.
        superseded_reason:
          type: string
        supersedes:
          type: string
          readOnly: true
          description: ID of the awaiting decision replaced by this proposal. Persisted on the replacement and returned on create/propose, replay, and reads; absent when nothing was replaced.
        supersedes_proposed_by:
          type: string
          readOnly: true
          description: Proposing actor ID recorded on the replaced decision; absent when no decision was replaced or its legacy provenance is unknown.
        supersedes_origin_kind:
          type: string
          readOnly: true
          enum: [human, pm_turn, channel]
          description: Origin kind recorded on the replaced decision; absent when no decision was replaced or its legacy provenance is unknown.
        answered_by:
          type: string
        action_id:
          type: string
        status:
          type: string
          enum:
          - awaiting_answer
          - answered
          - declined
          - superseded
          description: Declined means the human rejected the proposal; superseded is reserved for replacement. Legacy superseded decisions without superseded_by are returned as declined.
        revision:
          type: integer
        origin:
          $ref: '#/components/schemas/PMOrigin'
    PMReceipt:
      description: Successful native execution followed by canonical Nexus store read-back is verified with independently_verified true in the dispatch response. External executor reports remain source_reported until independently verified.
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
        external_id:
          type: string
        url:
          type: string
        evidence_refs:
          type: array
          items:
            type: string
        independently_verified:
          type: boolean
        detail:
          type: string
    PMAction:
      required: [deliverable]
      type: object
      additionalProperties: true
      properties:
        delivery_path:
          type: string
          readOnly: true
          description: Configured scope/source executor route independent of work lifecycle; none when unconfigured. Uses the trusted source_authority snapshot, with live-work fallback for legacy records. If a legacy source cannot be recovered after purge, delivery_path is unknown and deliverable is null.
        source_authority:
          type: string
          readOnly: true
          description: Trusted source authority captured at proposal and copied to the action for executor routing even after work is purged. Absent on legacy records; live work supplies the legacy fallback.
        id: *id001
        workspace_id: *id002
        actor_id: *id003
        work_ref: *id004
        created_at: *id005
        decision_id:
          type: string
        instruction:
          type: string
        payload:
          $ref: '#/components/schemas/PMActionPayload'
        scope:
          type: string
        target_revision:
          type: string
          description: Copy Work.decision_revision exactly. Core uses source.revision when source.authority is external and the revision is known (nonempty); otherwise it uses <work_metadata.version>.<head_revision_number> (decimal components). Either a canonical metadata mutation or a card content revision changes this fence; refresh attempts, failures, and freshness bookkeeping do not. Dispatch checks the same rule again; freshness.source_revision is not a fallback.
        authorization_basis:
          type: string
        status:
          type: string
          enum:
          - pending_delivery
          - sending
          - delivered
          - acknowledged
          - source_reported
          - verified
          - failed
          - unknown
        acknowledged_by:
          type: string
          readOnly: true
          description: Decision actor who dismissed a failed, unresolvable unknown, or undeliverable pending action; this is not source acknowledgement.
        acknowledged_at:
          type: string
          format: date-time
          readOnly: true
        closed_without_delivery:
          type: boolean
          readOnly: true
          description: True when the decision actor closed an undeliverable pending request without sending it. Receipt detail names the actor and delivery limitation. This is not an acknowledged source failure.
        deliverable:
          type: boolean
          nullable: true
          description: Derived from configured executors for this scope and source on every read, except acknowledged unsent actions always remain false. For pending actions, false means dispatch returns unavailable (503) without recording an attempt. Acknowledging an undeliverable pending action prevents later delivery; a fresh proposal and approval are required.
        reconciliation_conflict:
          type: boolean
          description: Latest read-back could not advance the action status. Receipt preserves that evidence even when its status is lower.
        receipt:
          $ref: '#/components/schemas/PMReceipt'
        attempts:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              started_at:
                type: string
              sent_at:
                type: string
                format: date-time
                readOnly: true
                description: Core entered the executor handoff boundary; this is not proof of source delivery. Absent for preflight failures, confirmed native failures before commit, and legacy attempts. Native commit uncertainty is read back before choosing unknown; confirmed local failures include their cause in receipt.detail.
              finished_at:
                type: string
              status:
                type: string
              receipt:
                $ref: '#/components/schemas/PMReceipt'
        revision:
          type: integer
    PMBinding:
      type: object
      additionalProperties: true
      properties:
        id: *id001
        workspace_id: *id002
        actor_id: *id003
        work_ref: *id004
        created_at: *id005
        origin:
          $ref: '#/components/schemas/PMOrigin'
        can_approve:
          type: boolean
        enabled:
          type: boolean
        revision:
          type: integer
    PMConversationCreateRequest:
      type: object
      additionalProperties: true
      properties:
        actor_id:
          type: string
          description: When supplied, must match the authenticated actor. Binds a recovered local mutation to its original identity.
        request_key:
          type: string
        replay_key:
          type: string
          maxLength: 256
          description: Opt in to an atomic original 201 receipt, binding the authenticated actor and complete decoded request. Requires a new conversation request_key; legacy conversations without a receipt cannot be adopted. Recovery checks current access and works after PM disconnect; new writes retain the setup gate.
        title:
          type: string
        context_refs:
          type: array
          maxItems: 8
          items: {type: string, maxLength: 512}
          description: Pinned typed refs, persisted on the conversation. work_ref remains the primary task for compatibility.
        work_ref:
          type: string
      required:
      - request_key
      - title
    PMMessageCreateRequest:
      type: object
      additionalProperties: true
      properties:
        actor_id:
          type: string
          description: When supplied, must match the authenticated actor. Binds a recovered local mutation to its original identity.
        request_key:
          type: string
        replay_key:
          type: string
          maxLength: 256
          description: Opt in to the original 202 receipt. Atomically commits the turn and durable dispatch intent; binds actor, conversation and complete decoded body. Existing turns without a receipt cannot be adopted. Recovery checks current access and works after PM disconnect. Legacy callers replay current turn state.
        text:
          type: string
      required:
      - request_key
      - text
    PMErrorResponse:
      description: Temporary principal authorization lookup failures return HTTP 503 unavailable without granting permission or recording a proposal; unknown or revoked principals remain forbidden. Turn admission returns HTTP 429 with code busy. error.details.reason is conversation with turn_id identifying the blocking turn, or queue with queued and limit for the workspace (ANX_PM_MAX_QUEUED, default 20). Waiting turns are open, before their deadline, and have no unexpired runner lease, including unknown wakeup outcomes. Conversation serialization takes precedence when both limits apply. Capacity means claimed turns with unexpired leases (ANX_PM_MAX_CONCURRENT, default 2); it is enforced atomically at claim time with HTTP 204, not at message admission. The capacity reason remains reserved for compatibility.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            recoverable:
              type: boolean
              description: Standard core auth error retry classification.
            hint:
              type: string
              description: Standard core auth error guidance.
            details:
              type: object
              properties:
                turn_id:
                  type: string
                  description: Blocking turn ID for conversation busy errors, or closed turn ID for turn_closed errors.
                reason:
                  type: string
                  enum: [conversation, capacity, queue, revision_changed, work_missing, already_at_target, work_read_failed, conversation_owner_not_human]
                  description: Turn admission constraint, approval/source preflight refusal, or conversation_owner_not_human for a turn proposal whose owner is an agent principal. That 403 message is "Proposals need a human approver; this conversation belongs to an agent principal".
                queued:
                  type: integer
                  description: Current workspace waiting turns for queue errors.
                waiting:
                  type: integer
                  description: Eligible unleased turns for the selected PM actor before their deadline, for claim capacity errors.
                in_flight:
                  type: integer
                  description: Current workspace claimed turns with unexpired runner leases for capacity errors.
                limit:
                  type: integer
                  description: Workspace queue limit for queue errors, or runner lease limit for capacity errors.
                pending_decision_id:
                  type: string
                  description: Awaiting human decision blocking a different non-human proposal on the same approver actor, work, and scope.
                approved_revision:
                  type: string
                  description: Decision target_revision that the refused approval would authorize.
                current_revision:
                  type: string
                  nullable: true
                  description: Current Work.decision_revision, or null when work is missing or unreadable.
                existing_decision_id:
                  type: string
                  description: Existing proposal for a conflicting request key.
                status:
                  type: string
                  description: Current decision status for a superseded answer or dispatch conflict.
                superseded_by:
                  type: string
                  description: Replacement decision ID for a superseded answer or dispatch conflict; empty if no replacement exists.
    PMActionRequestPayload:
      type: object
      additionalProperties: false
      description: Mutation inputs only. payload.resolution is read-only; send payload.resolution_refs.
      properties:
        evidence_refs:
          type: array
          maxItems: 32
          items:
            type: string
          description: Supporting evidence for a status or note proposal. Refs must exist and be visible to the requester; participate in intent equality and inherited resource ownership.
        note:
          type: string
          minLength: 1
          maxLength: 16000
          description: Required only for work.note. Human-approved Nexus card message; instruction carries the reason. External source notes require a configured executor.
        phase:
          type: string
          enum: [backlog, ready, in_progress, blocked, review, done]
        resolution_refs:
          type: array
          maxItems: 32
          items:
            type: string
    PMTurnContextRequest:
      type: object
      additionalProperties: false
      required: [lease_token]
      properties:
        view:
          type: string
          enum: [cards, card]
          description: Optional PM card view. cards returns pinned cards (at most 8) with bounded asks, decisions and activity. Without pins it returns a bounded requester-scoped workspace overview with up to 15 open initiatives ordered by attention, 15 open asks, 15 awaiting decisions and 15 recent events. Fixed candidate windows may yield partial previews. card requires a card context_ref and opens any card visible to the requester, including unpinned plan-step refs. All views validate the turn lease and requester permissions. Query and cursor are not supported with a view.
        lease_token:
          type: string
          minLength: 1
        context_ref:
          type: string
          maxLength: 512
          description: For view card, any card ref visible to the requesting reader. For other views, an optional pinned ref selector belonging to conversation context_refs or legacy work_ref. Defaults to the primary work_ref or first pinned ref. Reads always use the requesting reader's scope.
        query:
          type: string
        cursor:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
    PMDecisionCreateRequest:
      description: Direct creation requires a human; agents use the turn decisions endpoint. Request keys bind immutable intent. Conflicting reuse (including a different target_revision) returns 409 with error.details.existing_decision_id. Identical awaiting intent (same approver, work, scope, instruction, payload, and target revision) returns the existing decision with 200 regardless of proposer or origin, preserving original authorship and origin without a new decision. A different non-human proposal is rejected with 409 human_proposal_pending while a human-origin decision awaits an answer on that same approver actor, work, and scope in the workspace; error.details.pending_decision_id identifies it, and a human must decline or answer it first. Human proposals may atomically supersede changed human or PM proposals for the same approver, work, and scope.
      type: object
      additionalProperties: false
      properties:
        actor_id:
          type: string
          description: Optional original submitting actor; when supplied it must match the authenticated actor.
        replay_key:
          type: string
          maxLength: 256
          description: Optional actor/workspace-bound original HTTP receipt key. The decision, superseding writes, origin delivery and original response commit atomically. Retain request_key, replay_key and the complete body unchanged until confirmed. Exact retries return the original status/body after fresh authorization, including after PM disconnection. Clients omitting replay_key retain current-decision replay and its terminal-state metadata.
        origin:
          allOf:
            - $ref: '#/components/schemas/PMOrigin'
          description: Optional existing enabled channel binding owned by the authenticated actor; another actor's origin is rejected.
        request_key:
          type: string
        work_ref:
          type: string
        instruction:
          type: string
        payload:
          $ref: '#/components/schemas/PMActionRequestPayload'
        scope:
          type: string
        target_revision:
          type: string
          description: Copy Work.decision_revision exactly. Core uses source.revision when source.authority is external and the revision is known (nonempty); otherwise it uses <work_metadata.version>.<head_revision_number> (decimal components). Either a canonical metadata mutation or a card content revision changes this fence; refresh attempts, failures, and freshness bookkeeping do not. Dispatch checks the same rule again; freshness.source_revision is not a fallback.
      required:
      - request_key
      - work_ref
      - instruction
      - scope
      - target_revision
    PMTurnProposeRequest:
      description: Selected PM agents must supply the current lease token; stale tokens return 409. With pinned conversation refs, work_ref must be one of those exact refs (including the legacy primary work_ref); another card returns 403. Legacy unpinned conversations retain requester-authorized proposal behavior. work.note requires a nonempty payload.note and no phase or resolution_refs; instruction is the reason, separate from note content. Request keys bind immutable intent. Conflicting reuse (including a different target_revision) returns 409 with error.details.existing_decision_id. Identical awaiting intent (same approver, work, scope, instruction, payload, and target revision) returns the existing decision with 200 regardless of proposer or origin, preserving original authorship and origin without a new decision. A different non-human proposal is rejected with 409 human_proposal_pending while a human-origin decision awaits an answer on that same approver actor, work, and scope in the workspace; error.details.pending_decision_id identifies it, and a human must decline or answer it first. Human proposals may atomically supersede changed human or PM proposals for the same approver, work, and scope.
      type: object
      additionalProperties: false
      properties:
        lease_token:
          type: string
          minLength: 1
        request_key:
          type: string
        work_ref:
          type: string
        instruction:
          type: string
        payload:
          $ref: '#/components/schemas/PMActionRequestPayload'
        scope:
          type: string
        target_revision:
          type: string
          description: Copy Work.decision_revision exactly. Core uses source.revision when source.authority is external and the revision is known (nonempty); otherwise it uses <work_metadata.version>.<head_revision_number> (decimal components). Either a canonical metadata mutation or a card content revision changes this fence; refresh attempts, failures, and freshness bookkeeping do not. Dispatch checks the same rule again; freshness.source_revision is not a fallback.
      required:
      - lease_token
      - request_key
      - work_ref
      - instruction
      - scope
      - target_revision
    PMDecisionAnswerRequest:
      description: Optional request_key binds the decision, revision, approve flag and text to an actor-scoped replay. The answer, action intent and original response commit atomically; identical keyed retries replay that response after fresh authorization, and changed key reuse returns 409. Unkeyed clients retain revision-based answer replay.
      type: object
      additionalProperties: true
      properties:
        actor_id:
          type: string
          description: When supplied, must match the authenticated actor. Binds a recovered local mutation to its original identity.
        request_key:
          type: string
          maxLength: 256
        revision:
          type: integer
        approve:
          type: boolean
        text:
          type: string
      required:
      - revision
      - approve
      - text
    PMCompleteRequest:
      description: Requires the current active lease token. Identical terminal content and the token that completed or failed the turn replay with 200, even after the deadline; changed content returns 409 turn_closed; a stale or missing replay token returns 409 lease_mismatch with the terminal status and no retry needed.
      type: object
      additionalProperties: true
      properties:
        text:
          type: string
        evidence_refs:
          type: array
          items:
            type: string
        lease_token:
          type: string
      required:
      - lease_token
      - text
    PMClaimRequest:
      type: object
      additionalProperties: true
      properties:
        runner_id:
          type: string
          description: Stable identity for one serial worker; defaults to the authenticated actor ID when omitted. Reuse on restart to recover its existing lease.
    PMTurnActivity:
      type: object
      additionalProperties: false
      required: [sequence, kind, label]
      properties:
        sequence: {type: integer, minimum: 1}
        kind: {type: string, enum: [status, tool]}
        label: {type: string, minLength: 1, maxLength: 120}
        target: {type: string, maxLength: 160}
        recorded_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp assigned by core.
    PMActivityAppend:
      type: object
      additionalProperties: false
      required: [kind, label]
      properties:
        kind: {type: string, enum: [status, tool]}
        label: {type: string, minLength: 1, maxLength: 120}
        target: {type: string, maxLength: 160}
    PMHeartbeatRequest:
      type: object
      additionalProperties: false
      required:
      - lease_token
      properties:
        activity_append:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/PMActivityAppend'}
          description: Best-effort append with core-assigned sequence numbers under the lease lock, for concurrent runner and CLI emitters. Never automatically retry; delivery uncertainty may duplicate a step if retried. Cannot be combined with activity.
        activity:
          type: array
          maxItems: 50
          description: Append events with increasing sequence numbers. Identical retries are ignored; conflicting sequences are rejected. Only short safe labels and targets, never tool arguments, output, credentials or raw payloads.
          items: {$ref: '#/components/schemas/PMTurnActivity'}
        partial_sequence: {type: integer, minimum: 1}
        partial_response:
          type: string
          description: Optional latest draft snapshot, bounded by the turn output limit. Requires increasing partial_sequence; identical retries are accepted. Omitted preserves the draft; empty clears it.
        lease_token:
          type: string
          minLength: 1
    PMReleaseRequest:
      type: object
      additionalProperties: false
      required: [runner_id, lease_token]
      properties:
        runner_id:
          type: string
          minLength: 1
          maxLength: 256
        lease_token:
          type: string
          minLength: 1
    PMFailRequest:
      description: Requires the current active lease token. Identical terminal content and the token that completed or failed the turn replay with 200, even after the deadline; changed content returns 409 turn_closed; a stale or missing replay token returns 409 lease_mismatch with the terminal status and no retry needed.
      type: object
      additionalProperties: true
      properties:
        reason:
          type: string
        lease_token:
          type: string
      required:
      - lease_token
      - reason
    PMControlRequest:
      type: object
      description: >-
        Optional keyed control. request_key and if_revision must be supplied together.
        Dispatch also requires if_action_revision. Replays return the original admitted
        action after current authorization checks. A dispatch receipt confirms admission
        (usually sending), not delivery; read the action for its current outcome. The
        first action CAS and receipt commit atomically, before an external handoff.
      properties:
        request_key: { type: string, minLength: 1, maxLength: 256 }
        if_revision: { type: integer, minimum: 1 }
        if_action_revision: { type: integer, minimum: 1 }

    PMEmptyRequest:
      type: object
      additionalProperties: true
