  /series/{name}/points:
    post:
      operationId: series_push
      summary: Push one declared series point
      description: Scoped credentials have a default-deny series.points.push capability for declared resources only. Exact same-timestamp retries are idempotent. A changed raw observation at the same timestamp replaces its value and consumes daily ingestion budget; rolled-up observations cannot be corrected through push. Safety bounds are independent of commercial quotas. Fixed UTC-minute request budgets are 1200 per adapter and 2400 per workspace, counting retries; accepted points are capped at 100000 per UTC day. In-flight scoped requests are limited to two per adapter and four per workspace. Timestamps may be at most 90 days old or five minutes ahead. Raw retention is 90 days; daily rollups never expire.
      tags: [series]
      x-anx-command-id: series.push
      x-anx-cli-input:
        mode: flags
        flags:
        - {name: adapter, description: Declared adapter; omitted means resolve from series inventory.}
        - {name: label, description: Repeated exact k=v labels.}
        - {name: ts, description: RFC3339 observation timestamp.}
        - {name: from-command, description: Read a number or JSON point from the argv after --.}
        - {name: series, description: Series name when from-command stdout is a number.}
      x-anx-examples:
      - {title: Push a number, command: "anx series push builds 12 --label initiative=launch"}
      - {title: Push command output, command: "anx series push builds --from-command -- ./count-builds"}
      x-anx-cli-path: series push
      x-anx-why: Push one declared series point.
      x-anx-input-mode: json-body
      x-anx-streaming: {mode: none}
      x-anx-output-envelope: Returns JSON with provenance and explicit freshness.
      x-anx-error-codes: [auth_required, invalid_token, forbidden, invalid_request, not_found, conflict, series_capacity, series_rate_limited]
      x-anx-concepts: [documents]
      x-anx-surface: canonical
      x-anx-agent-notes: Explicit declared push source; core never fetches external data.
      x-anx-stability: stable
      parameters:
      - name: name
        in: path
        required: true
        schema: {type: string, pattern: "^[a-z][a-z0-9_.-]{0,79}$"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SeriesPointInput"}
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "429":
          description: Safety request budget or ingestion/cardinality cap exceeded; retry storms are rejected before body reads. series_rate_limited responses carry Retry-After seconds.
          headers:
            Retry-After:
              schema: {type: integer, minimum: 1, maximum: 60}
