      x-anx-concepts: [inbox]
      x-anx-stability: beta
      parameters:
        - name: last_event_id
          in: query
          required: false
          schema: { type: string }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Inbox SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/ErrorResponse'

