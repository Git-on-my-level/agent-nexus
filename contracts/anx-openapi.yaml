openapi: 3.1.0
info:
  title: Agent Nexus HTTP API
  version: 0.6.0
  description: |
    Canonical workspace HTTP contract for Agent Nexus.

    PM designation grants no additional private-resource read permissions.
    Direct PM and native resource reads use ordinary principal visibility.
    Only explicitly queued, lease-validated PM turn operations may read for
    their requesting principal; the lease is not authority on other routes.

    Public workspace identity is ref/handle first. Durable resources expose a
    typed `ref` (for cross-resource links) and kind-scoped `handle` (for URLs
    and command arguments). Internal UUID/storage identifiers, when present, are
    debug/admin fields and are not the primary public identity.

    Topics and cards are primary durable resources. Threads remain backing
    infrastructure surfaced through read-only inspection and workspace views.

    `cards.*` is the canonical store API over card rows. `work.*` is the operator
    Tasks projection over those same rows (acceptance criteria, observations,
    freshness). Use `cards.*` for store reads and card workflow writes; use
    `work.*` to see what operators see. They are layered, not duplicates.

    `X-ANX-Run-Id` is optional on every authenticated mutating request. Its value
    is `agentctl/<external_id>` (not a server run ID). Core resolves the run by
    the caller's derived host and launcher `agentctl`, creating a provisional
    unknown-state run if necessary; it records run ID, host ID, agent ID and
    adapter on the resulting event, message, and audit record. A malformed
    header or a run belonging to another agent fails with run_attribution_invalid.
    Absence means no run attribution. This header never grants authority.
servers:
  - url: http://127.0.0.1:8000
x-anx-extension-vocabulary:
  x-anx-command-id: Stable command identifier.
  x-anx-cli-path: CLI path segments.
  x-anx-why: Why the command exists.
  x-anx-input-mode: none | json-body | raw-stream | file-and-body | multipart-form
  x-anx-streaming: Streaming characteristics for the operation.
  x-anx-output-envelope: Output shape and stability notes.
  x-anx-error-codes: Stable semantic error codes.
  x-anx-concepts: Concept tags for generated docs and help.
  x-anx-stability: experimental | beta | stable
  x-anx-surface: canonical | projection | diagnostic | utility
  x-anx-agent-notes: Idempotency, retries, and protocol caveats.
