            history (newest first, paginated).
          schema:
            type: string
            enum: [open, completed]
            default: open
        - name: limit
          in: query
          required: false
          description: Page size for open or completed inbox (default 50, max 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor returned as next_cursor from a prior page of the same inbox status. Open rows order escalation, ask, review, then other categories; newest trigger first within each category.
          schema:
            type: string
        - name: window_days
          in: query
          required: false
          description: >
            Restrict completed history to events newer than now minus this many days (default 30).
            Use 0 for all time.
          schema:
            type: integer
            minimum: 0
        - name: completed_kind
          in: query
          required: false
          description: Filter completed rows by original human attention kind (ignored when status=open).
          schema:
            type: string
            enum: [all, ask, review, escalate, unknown]
            default: all
