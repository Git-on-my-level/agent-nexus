      x-anx-surface: canonical
      x-anx-command-id: secrets.list
      x-anx-cli-path: secret list
      x-anx-why: List workspace secret metadata without exposing values.
      x-anx-input-mode: none
      x-anx-streaming: { mode: none }
      x-anx-output-envelope: "Returns `{ secrets }`."
      x-anx-error-codes: [auth_required, invalid_token]
      x-anx-concepts: [secrets]
      x-anx-stability: beta
      responses:
        '200':
          description: Secret metadata list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretsResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    post:
      operationId: createSecret
      summary: Create secret
      tags: [secrets]
      x-anx-surface: canonical
      x-anx-command-id: secrets.create
      x-anx-cli-path: secret create
      x-anx-why: Store an encrypted workspace credential with metadata.
      x-anx-input-mode: json-body
      x-anx-streaming: { mode: none }
      x-anx-output-envelope: "Returns `{ secret }` (metadata only, value is not echoed)."
      x-anx-error-codes: [auth_required, invalid_token, human_only, invalid_request, resource_exists, secrets_not_configured]
      x-anx-concepts: [secrets, write]
      x-anx-stability: beta
      x-anx-agent-notes: "Only human principals may create secrets."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecretRequest'
      responses:
        '201':
          description: Secret created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'

  /secrets/{secret_id}:
    put:
      operationId: updateSecret
      summary: Update secret value
      tags: [secrets]
      x-anx-surface: canonical
      x-anx-command-id: secrets.update
      x-anx-cli-path: secret update
      x-anx-why: Replace an encrypted secret value.
      x-anx-input-mode: json-body
      x-anx-streaming: { mode: none }
      x-anx-output-envelope: "Returns `{ secret }` (metadata only)."
      x-anx-error-codes: [auth_required, invalid_token, human_only, not_found, invalid_request, secrets_not_configured]
      x-anx-concepts: [secrets, write]
      x-anx-stability: beta
      x-anx-agent-notes: "Only human principals may update secrets."
      parameters:
        - $ref: '#/components/parameters/SecretID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSecretRequest'
      responses:
        '200':
          description: Secret updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      operationId: deleteSecret
      summary: Delete secret
      tags: [secrets]
      x-anx-surface: canonical
      x-anx-command-id: secrets.delete
      x-anx-cli-path: secret delete
      x-anx-why: Permanently remove a secret and its encrypted value.
      x-anx-input-mode: none
      x-anx-streaming: { mode: none }
      x-anx-output-envelope: "Returns `{ deleted: true, secret_id }`."
      x-anx-error-codes: [auth_required, invalid_token, human_only, not_found, secrets_not_configured]
      x-anx-concepts: [secrets, write]
      x-anx-stability: beta
      x-anx-agent-notes: "Only human principals may delete secrets."
      parameters:
        - $ref: '#/components/parameters/SecretID'
      responses:
        '200':
          description: Secret deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSecretResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'

  /secrets/{secret_id}/reveal:
    post:
      operationId: revealSecret
      summary: Reveal secret value
      tags: [secrets]
      x-anx-surface: canonical
      x-anx-command-id: secrets.reveal
      x-anx-cli-path: secret get --reveal
      x-anx-why: Decrypt and return a secret value. Logged in audit.
      x-anx-input-mode: none
      x-anx-streaming: { mode: none }
      x-anx-output-envelope: "Returns `{ name, value }`."
      x-anx-error-codes: [auth_required, invalid_token, not_found, secrets_not_configured]
      x-anx-concepts: [secrets]
      x-anx-stability: beta
      x-anx-agent-notes: "Every reveal is logged in auth audit. POST (not GET) to prevent caching."
      parameters:
        - $ref: '#/components/parameters/SecretID'
      responses:
        '200':
          description: Decrypted secret value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevealSecretResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'

  /secrets/reveal-batch:
    post:
      operationId: revealSecretsBatch
      summary: Reveal multiple secrets by name
      tags: [secrets]
      x-anx-surface: canonical
      x-anx-command-id: secrets.reveal-batch
      x-anx-cli-path: secret exec
      x-anx-why: Batch-fetch secrets for env injection. Each reveal is audited.
      x-anx-input-mode: json-body
      x-anx-streaming: { mode: none }
      x-anx-output-envelope: "Returns `{ secrets: [{ name, value }] }`."
      x-anx-error-codes: [auth_required, invalid_token, not_found, invalid_request, secrets_not_configured]
      x-anx-concepts: [secrets]
      x-anx-stability: beta
      x-anx-agent-notes: "Each resolved secret generates an audit event. Missing names return not_found."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevealSecretsBatchRequest'
      responses:
        '200':
          description: Batch of decrypted secret values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevealSecretsBatchResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'

components:
  responses:
    ErrorResponse:
      description: >
        Error payload. Every write may return HTTP 409 quota_exceeded when a configured
        workspace or upload limit would be exceeded. This error is not retryable
        (error.recoverable=false). The top-level quota object contains metric
        (artifacts, documents, revisions, blob_bytes, upload_bytes) and limit.
        Reader-visible current, delta (attempted growth), and projected are included
        only when projected exceeds limit; otherwise error.message reports the limit alone.
        Limits are deployment configuration;
        blob_bytes includes canonical content as well as blobs. Clients display
        error.message. Reclaim content or change the configured limit before resubmitting.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  parameters:
    TopicID:
      in: path
      name: topic_id
      required: true
      schema: { type: string }
      description: Public topic ref (`topic:<handle>`) or topic handle. Internal UUID lookup is compatibility/debug-only.
    ThreadID:
      in: path
      name: thread_id
      required: true
      schema: { type: string }
      description: Public thread ref (`thread:<handle>`) or thread handle. Internal UUID lookup is compatibility/debug-only.
    DocumentID:
      in: path
      name: document_id
      required: true
      schema: { type: string }
      description: Public document ref (`document:<handle>`) or document handle. Internal UUID lookup is compatibility/debug-only.
    RevisionID:
      in: path
      name: revision_id
      required: true
      schema: { type: string }
      description: Public revision ref (`document_revision:<handle>` or `card_revision:<handle>`) or revision handle. Internal UUID lookup is compatibility/debug-only.
    CommentID:
      in: path
      name: comment_id
      required: true
      schema: { type: string }
      description: Public comment/event ref (`event:<handle>`) or event handle/id.
    BoardID:
      in: path
      name: board_id
      required: true
      schema: { type: string }
      description: Public board ref (`board:<handle>`) or board handle. Internal UUID lookup is compatibility/debug-only.
    CardID:
      in: path
      name: card_id
      required: true
      schema: { type: string }
      description: Public card ref (`card:<handle>`) or card handle. Internal UUID lookup is compatibility/debug-only.
    ArtifactID:
      in: path
      name: artifact_id
      required: true
      schema: { type: string }
      description: Public artifact ref (`artifact:<handle>`) or artifact handle. Internal UUID lookup is compatibility/debug-only.
    EventID:
      in: path
      name: event_id
      required: true
      schema: { type: string }
      description: Public event ref (`event:<handle>`) or event handle. Internal UUID lookup is compatibility/debug-only.
    InboxID:
      in: path
      name: inbox_id
      required: true
      schema: { type: string }
    SecretID:
      in: path
      name: secret_id
      required: true
      schema: { type: string }
    RunAttribution:
      in: header
      name: X-ANX-Run-Id
      required: false
      schema: {type: string, pattern: '^agentctl/[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'}
      description: Optional execution attribution on every authenticated write; see top-level contract description.
    HostKeyID:
      in: header
      name: X-ANX-Host-Key-Id
      required: false
      schema: {type: string}
      description: Required with the other host proof headers for host self-access; omitted for human auth-admin bearer.
    HostSignedAt:
      in: header
      name: X-ANX-Host-Signed-At
      required: false
      schema: {type: string, format: date-time}
      description: Required with host key and signature headers for host self-access.
    HostSignature:
      in: header
      name: X-ANX-Host-Signature
      required: false
      schema: {type: string}
      description: Base64 Ed25519 signature required for host self-access.

  schemas:
    ReportPreviewRequest:
      type: object
      additionalProperties: false
      required: [report]
      properties:
        report:
          type: object
          description: Bounded anx.visual-report v1 JSON, validated with the shared visual report contract.
          additionalProperties: true
    LiveReportPreviewResponse:
      type: object
      required: [observed_at, panels]
      properties:
        observed_at: {type: string, format: date-time}
        panels:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/LiveReportPanel'
    LiveReportResponse:
      type: object
      required: [document_ref, revision_ref, observed_at, panels]
      properties:
        document_ref: {type: string}
        revision_ref: {type: string}
        observed_at: {type: string, format: date-time}
        panels:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/LiveReportPanel'
    LiveReportPanel:
      type: object
      required: [id, type, status, observed_at, truncated, data, provenance_class]
      properties:
        id: {type: string}
        type: {type: string, enum: [live-loops, live-loop, live-initiatives, live-asks, live-work-mix, live-activity, live-fleet-health, live-cards, live-timeline, explanation, milestone-timeline, dependency-diagram, artifact-preview, callout, comparison, chart, metric, metric-strip, table, metric-chart, evidence-table]}
        status: {type: string, enum: [ok, stale, unavailable]}
        observed_at: {type: string, format: date-time, nullable: true}
        truncated: {type: boolean}
        message: {type: string}
        provenance_class: {type: string, enum: [live, authored], description: Computed from the panel type and source binding, never claimed by the report author.}
        author: {type: string, description: Authored panel author from the report definition.}
        authored_at: {type: string, format: date-time}
        review_by: {type: string, format: date-time, description: Resolved review deadline; dates mean midnight UTC and durations are relative to authored_at.}
        review_by_defaulted: {type: boolean, description: True when a legacy authored panel uses the seven-day default.}
        review_due: {type: boolean}
        stale_since: {type: string, description: When the selected series became stale; empty when never observed.}
        fresh_until: {type: string, format: date-time, description: Earliest freshness deadline of the selected label sets.}
        provenance:
          type: object
          properties:
            series: {type: string}
            adapter: {type: string}
            host: {type: string}
            host_id: {type: string}
            agent_id: {type: string}
            last_push: {type: string, format: date-time, nullable: true}
            expected_interval_seconds: {type: integer}
            labels: {$ref: '#/components/schemas/SeriesLabels'}
            resolution: {type: string, enum: [raw, daily, daily+raw]}
        data:
          type: object
          additionalProperties: true
          description: >
            Initiatives return items (ref, title, summary, progress {done,total}, needs,
            priority, phase, board_ref, updated_at), plus optional plan, plan_state,
            health, assignee_refs and linked_work when supplied by the plan projection.
            Asks return items (id, title,
            status, created_at, age_seconds, request_event_ref, response_text, responded_at).
            Work mix returns group_by, total and buckets (key,label,count).
            Activity returns items (ref,type,summary,actor_id,ts,count,actor_label,subject,verb,detail,impact).
            subject is null or an access-filtered current item (ref,title,kind), where kind is initiative, card, ask, doc, board or topic.
            impact is high, normal or low. detail is short plain text (at most 140 characters). Series bindings return the panel type's static data shape, live provenance and freshness deadlines.
    LiveReportQuery:
      type: object
      additionalProperties: false
      description: >
        live-loops accepts board (default initiatives board), health (comma list), limit (1..48, default 24). live-loop requires card.
        Data-only query stored in a version 1 live panel's data field. Initiatives
        allow board_refs, project_ref, card_ref, limit, sort; work mix allows
        board_refs, project_ref, card_ref, group_by; asks allow card_ref, limit,
        include_answered, answered_only, answered_within_hours; activity allows
        limit and min_impact (high, normal, low; default low). live-fleet-health accepts an empty query and reads declared fleet.*
        series plus native host and authorized enrollment inventory. card_ref filters initiative rows and asks to one visible card.
        answered_only returns answered asks only and implies include_answered.
        live-cards allows board_refs, project_ref, card_ref, label, role, status, limit and sort (priority, updated, title). Its items use the initiative card shape without plan enrichment. live-timeline uses a series source binding with a range of at most 90d and no agg or fallback; it returns individual items (at, label, value), newest first, capped at 100. Authored panels are also returned with review metadata and their static data. No other field is allowed for that panel type.
      properties:
        board: {type: string, pattern: '^board:[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'}
        card: {type: string, pattern: '^card:[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'}
        health: {type: string, description: "Comma-separated healthy, stalled, failing, overdue, unknown. live-loops only."}
        board_refs:
          type: array
          maxItems: 16
          uniqueItems: true
          items: {type: string, pattern: '^board:[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'}
        project_ref: {type: string, pattern: '^topic:[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'}
        card_ref: {type: string, pattern: '^card:[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'}
        limit: {type: integer, minimum: 1, maximum: 100, default: 10}
        min_impact: {type: string, enum: [high, normal, low], default: low, description: Minimum activity impact after coalescing.}
        include_answered: {type: boolean, default: false}
        answered_only: {type: boolean, default: false}
        answered_within_hours: {type: integer, minimum: 1, maximum: 720, default: 168}
        sort: {type: string, enum: [priority, updated, title], default: priority}
        group_by: {type: string, enum: [phase, board], default: phase}
        label: {type: string, maxLength: 128, description: Exact match in work labels.}
        role: {type: string, maxLength: 128, description: Exact match in work roles.}
        status: {type: string, maxLength: 128, description: Exact card phase.}
    HumanInviteCreateRequest:
      type: object
      additionalProperties: false
      properties:
        kind: {type: string, enum: [human]}
        expires_at: {type: string, format: date-time}
      required: [kind]
    AgentName:
      type: string
      pattern: '^[a-z][a-z0-9-]{0,31}$'
      description: Adapter (claude, codex, cursor, omp, generic) or explicit persona.
    HostSlug:
      type: string
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      maxLength: 63
    HostAdoptionProof:
      type: object
      additionalProperties: false
      description: 'Proof of possession for an existing active standalone agent key. Sign UTF-8 `anx-host-adopt|<request_nonce>|<host_public_key>|<agent_id>|<agent_name>` with that Ed25519 key; signature is standard base64. request_nonce is client-generated random base64url (at least 128 bits). No agent may be adopted twice or mapped to a duplicate host/name. The server re-parents the same actor ID and history, renames handle, and revokes the old agent key/sessions atomically. An excluded local profile is omitted from this list and remains standalone.'
      properties:
        agent_id: {type: string, maxLength: 128}
        key_id: {type: string, maxLength: 128}
        agent_name: {$ref: '#/components/schemas/AgentName'}
        signature: {type: string, contentEncoding: base64, maxLength: 128}
      required: [agent_id, key_id, agent_name, signature]
    HostEnrollmentStartRequest:
      type: object
      additionalProperties: false
      properties:
        public_key: {type: string, contentEncoding: base64, description: Raw 32-byte Ed25519 host public key.}
        requested_slug: {$ref: '#/components/schemas/HostSlug'}
        os_user: {type: string, minLength: 1, maxLength: 128}
        hostname: {type: string, minLength: 1, maxLength: 255}
        discovered_adapters: {type: array, maxItems: 16, uniqueItems: true, items: {$ref: '#/components/schemas/AgentName'}}
        request_nonce: {type: string, minLength: 22, maxLength: 128, description: Random base64url value with at least 128 bits entropy.}
        adoptions: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/HostAdoptionProof'}}
      required: [public_key, requested_slug, os_user, hostname, discovered_adapters, request_nonce, adoptions]
    HostEnrollment:
      type: object
      additionalProperties: false
      properties:
        id: {type: string}
        user_code: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}$', description: Included in auth-admin pending list; omitted from poll response.}
        requested_slug: {$ref: '#/components/schemas/HostSlug'}
        os_user: {type: string}
        hostname: {type: string}
        discovered_adapters: {type: array, items: {$ref: '#/components/schemas/AgentName'}}
        adoption_names: {type: array, items: {$ref: '#/components/schemas/AgentName'}}
        requesting_ip: {type: string, description: Admin view only.}
        status: {type: string, enum: [pending, approved, denied, expired, completed]}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
      required: [id, requested_slug, os_user, hostname, discovered_adapters, adoption_names, status, expires_at, created_at]
    HostEnrollmentStartResponse:
      type: object
      additionalProperties: false
      properties:
        enrollment_id: {type: string}
        user_code: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}$', description: Independent 40-bit Crockford-style code shown to the human; excludes ambiguous letters.}
        verification_url: {type: string, format: uri, description: Absolute workspace-scoped web UI URL for Access → Hosts, present only when the core deployment config supplies the public web UI workspace URL. Clients must not derive this from the core origin.}
        poll_token: {type: string, description: High-entropy secret shown once.}
        poll_interval_seconds: {type: integer, minimum: 1}
        expires_at: {type: string, format: date-time}
      required: [enrollment_id, user_code, poll_token, poll_interval_seconds, expires_at]
    HostEnrollmentStatusResponse:
      type: object
      additionalProperties: false
      properties:
        enrollment: {$ref: '#/components/schemas/HostEnrollment'}
        poll_interval_seconds: {type: integer, minimum: 1}
      required: [enrollment, poll_interval_seconds]
    HostEnrollmentsResponse:
      type: object
      additionalProperties: false
      properties:
        enrollments: {type: array, items: {$ref: '#/components/schemas/HostEnrollment'}}
      required: [enrollments]
    HostEnrollmentCompleteRequest:
      type: object
      additionalProperties: false
      description: 'Host signs UTF-8 `anx-host-enroll-complete|<enrollment_id>|<poll_token>` with its submitted key. Completion is one-time and must occur before expiry.'
      properties:
        poll_token: {type: string}
        signature: {type: string, contentEncoding: base64}
      required: [poll_token, signature]
    HostEnrollmentToken:
      type: object
      additionalProperties: false
      properties:
        id: {type: string}
        label: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        consumed_at: {type: string, nullable: true, format: date-time}
        revoked_at: {type: string, nullable: true, format: date-time}
      required: [id, label, created_at, expires_at]
    HostEnrollmentTokenCreateRequest:
      type: object
      additionalProperties: false
      properties:
        label: {type: string, minLength: 1, maxLength: 120}
        expires_at: {type: string, format: date-time, description: Between 10 minutes and 24 hours from creation.}
        expires_in_seconds: {type: integer, minimum: 600, maximum: 86400, description: Lifetime measured by core; alternative to expires_at.}
      required: [label]
      oneOf:
        - required: [expires_at]
        - required: [expires_in_seconds]
    HostEnrollmentTokenCreateResponse:
      type: object
      additionalProperties: false
      properties:
        enrollment_token: {$ref: '#/components/schemas/HostEnrollmentToken'}
        token: {type: string, description: One-time secret; never returned again.}
      required: [enrollment_token, token]
    HostEnrollmentTokenResponse:
      type: object
      additionalProperties: false
      properties:
        enrollment_token: {$ref: '#/components/schemas/HostEnrollmentToken'}
      required: [enrollment_token]
    HostEnrollmentTokensResponse:
      type: object
      additionalProperties: false
      properties:
        enrollment_tokens: {type: array, items: {$ref: '#/components/schemas/HostEnrollmentToken'}}
      required: [enrollment_tokens]
    HeadlessHostEnrollmentRequest:
      type: object
      additionalProperties: false
      description: 'Host signs UTF-8 `anx-host-headless-enroll|<request_nonce>|<requested_slug>|<public_key>` with its submitted key. The token is one-time and expiry-bound; the request nonce is bound into every adoption proof.'
      properties:
        public_key: {type: string, contentEncoding: base64}
        requested_slug: {$ref: '#/components/schemas/HostSlug'}
        os_user: {type: string, minLength: 1, maxLength: 128}
        hostname: {type: string, minLength: 1, maxLength: 255}
        discovered_adapters: {type: array, maxItems: 16, uniqueItems: true, items: {$ref: '#/components/schemas/AgentName'}}
        request_nonce: {type: string, minLength: 22, maxLength: 128}
        adoptions: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/HostAdoptionProof'}}
        enrollment_token: {type: string}
        signature: {type: string, contentEncoding: base64}
      required: [public_key, requested_slug, os_user, hostname, discovered_adapters, request_nonce, adoptions, enrollment_token, signature]
    Host:
      type: object
      additionalProperties: false
      properties:
        id: {type: string}
        ref: {type: string, pattern: '^host:.+', description: Public typed host reference.}
        handle: {$ref: '#/components/schemas/HostSlug'}
        slug: {$ref: '#/components/schemas/HostSlug'}
        display_name: {type: string}
        os_user: {type: string}
        hostname: {type: string}
        discovered_adapters: {type: array, items: {$ref: '#/components/schemas/AgentName'}}
        key_id: {type: string}
        excluded_names: {type: array, items: {$ref: '#/components/schemas/AgentName'}}
        agents: {type: array, items: {$ref: '#/components/schemas/AgentSummary'}}
        created_at: {type: string, format: date-time}
        revoked_at: {type: string, nullable: true, format: date-time}
      required: [id, ref, handle, slug, display_name, os_user, hostname, discovered_adapters, key_id, excluded_names, agents, created_at]
    HostResponse:
      type: object
      additionalProperties: false
