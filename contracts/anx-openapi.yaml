  /stream/events:
    get:
      operationId: streamEvents
      summary: Stream events (SSE)
      description: Starts at the current workspace head unless the supplied resume ID identifies a currently authorized-visible, untrashed event. Hidden, trashed and unknown IDs behave identically. Accepted IDs resume in chronological timestamp/ID order. Each scan reads pages of 200 candidates in chunks of at most 2000 candidates. Chunks with remaining positions continue immediately, yielding between chunks without waiting for the poll timer. Each chunk decodes at most one visible page; the scanner returns to normal polling only after reaching the head. Hidden and nonmatching positions advance only a connection-local cursor. Keepalive comments follow the polling timer regardless of hidden activity. A `resume` SSE marker with empty JSON data follows every 200 delivered visible events and repeats that visible ID; it does not indicate hidden backlog or carry internal progress.
      tags: [events]
      x-anx-surface: canonical
      x-anx-command-id: events.stream
      x-anx-cli-path: events stream
      x-anx-why: Long-lived SSE feed of workspace events with optional thread/type filters and Last-Event-ID resume.
      x-anx-input-mode: none
      x-anx-streaming: { mode: sse }
      x-anx-output-envelope: "Resource messages use `event: event` with JSON data `{ \"event\": <event> }`. A `resume` control has empty JSON data and is excluded from delivered-event counts (see core/docs/http-api.md)."
      x-anx-error-codes: [auth_required, invalid_request, invalid_token]
      x-anx-concepts: [events]
      x-anx-stability: beta
      parameters:
        - name: thread_id
          in: query
          required: false
          description: Limit stream to events for this backing thread public ref (`thread:<handle>`) or thread handle.
          schema: { type: string }
        - name: type
          in: query
          required: false
          description: Event type filter (repeatable; comma-separated values allowed per parameter).
          schema: { type: string }
        - name: last_event_id
          in: query
          required: false
          description: Resume after this currently authorized-visible, untrashed event ID. Hidden, trashed and unknown IDs start at head (alternative to `Last-Event-ID` header).
          schema: { type: string }
        - name: Last-Event-ID
          in: header
          required: false
          description: Preferred resume ID of a currently authorized-visible, untrashed event. Hidden, trashed and unknown IDs start at head (alternative to `last_event_id` query).
          schema: { type: string }
      responses:
        '200':
          description: Server-sent events stream (`text/event-stream`).
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

