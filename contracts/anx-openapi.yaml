      x-anx-surface: projection
      x-anx-command-id: agent.notification-receipts.stream
      x-anx-why: Server-sent events feed of sender/operator-visible agent wake receipt updates for a backing thread.
      x-anx-input-mode: query
      x-anx-streaming: { mode: sse }
      x-anx-output-envelope: "SSE `notification_receipt` events with JSON payloads `{ \"receipt\": <AgentNotificationReceipt> }`."
