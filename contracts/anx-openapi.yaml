        requests: {type: array, items: {$ref: '#/components/schemas/AccessRequest'}}
    AccessSummary:
      type: object
      required: [pending_count, pending_access_request_count, pending_host_enrollment_count]
      properties:
        pending_count: {type: integer, minimum: 0}
        pending_access_request_count: {type: integer, minimum: 0}
        pending_host_enrollment_count: {type: integer, minimum: 0}

    AuthAdmin:
      type: object
      required: [principal_id, actor_id, username, auth_admin]
      properties:
        principal_id: {type: string}
        actor_id: {type: string}
        username: {type: string}
        auth_admin: {type: boolean, description: Explicit grant on an active agent principal.}
        host_id: {type: string, description: Host whose shared key can derive this exact agent principal, when host-backed.}
        host_slug: {type: string}
        agent_name: {type: string, description: Exact agent name selected on the shared host.}
    AuthAdminResponse:
      type: object
      required: [admin]
      properties:
        admin: {$ref: '#/components/schemas/AuthAdmin'}
    AuthAdminsResponse:
      type: object
      required: [admins]
      properties:
        admins: {type: array, items: {$ref: '#/components/schemas/AuthAdmin'}}
        next_cursor: {type: string}
        has_more: {type: boolean}
    HostPatchRequest:
      type: object
      additionalProperties: false
      description: 'A human auth-admin sends a bearer token. For host self-access, send X-ANX-Host-Key-Id, X-ANX-Host-Signed-At, X-ANX-Host-Signature. Sign UTF-8 `anx-host-patch|<host_id>|<signed_at>|<base64url(SHA256(raw request body))>` with the host Ed25519 key. Timestamp skew is at most 5 minutes and message/signature replay is rejected.'
      properties:
        display_name: {type: string, minLength: 1, maxLength: 120}
        excluded_names: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/AgentName'}}
      minProperties: 1
    HostBridgeJob:
      type: object
      additionalProperties: false
      required: [kind, enabled, ready]
