        created_at: { type: string, format: date-time }
        created_by: { type: string }
      required: [ref, handle, kind, content_type, content_hash, refs, created_at, created_by]

    Thread:
      type: object
      properties:
        ref: { $ref: '#/components/schemas/ResourceRef' }
        handle: { $ref: '#/components/schemas/ResourceHandle' }
        id:
          allOf:
            - $ref: '#/components/schemas/InternalResourceUUID'
