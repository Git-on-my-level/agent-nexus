paths:
  /adapters:
    get:
      operationId: adapters_list
      summary: List declared adapters
      tags: [series]
      x-anx-command-id: adapters.list
      x-anx-cli-path: adapters list
      x-anx-why: List declared adapters.
      x-anx-input-mode: none
      x-anx-streaming: {mode: none}
      x-anx-output-envelope: Returns JSON with provenance and explicit freshness.
      x-anx-error-codes: [auth_required, invalid_token, forbidden, invalid_request, not_found, conflict, series_capacity]
      x-anx-concepts: [documents]
      x-anx-surface: canonical
      x-anx-agent-notes: Explicit declared push source; core never fetches external data.
      x-anx-stability: beta
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
    post:
      operationId: adapters_declare
      summary: Declare an adapter and its series
      tags: [series]
      x-anx-command-id: adapters.declare
      x-anx-cli-input:
        mode: file-and-body
        flags:
        - {name: body-file, required: true, description: UTF-8 adapter declaration JSON file or stdin (-).}
      x-anx-examples:
      - {title: Declare before pushing, command: "anx adapters declare --body-file adapter.json"}
      x-anx-cli-path: adapters declare
      x-anx-why: Declare an adapter and its series.
      x-anx-input-mode: json-body
      x-anx-streaming: {mode: none}
      x-anx-output-envelope: Returns JSON with provenance and explicit freshness.
      x-anx-error-codes: [auth_required, invalid_token, forbidden, invalid_request, not_found, conflict, series_capacity]
      x-anx-concepts: [documents]
      x-anx-surface: canonical
      x-anx-agent-notes: Explicit declared push source; core never fetches external data.
      x-anx-stability: beta
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdapterDeclaration"}
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /adapters/{name}/revoke:
    post:
      operationId: adapters_revoke
      summary: Revoke an adapter grant
      tags: [series]
      x-anx-command-id: adapters.revoke
      x-anx-cli-path: adapters revoke
      x-anx-why: Revoke an adapter grant.
      x-anx-input-mode: none
      x-anx-streaming: {mode: none}
      x-anx-output-envelope: Returns JSON with provenance and explicit freshness.
      x-anx-error-codes: [auth_required, invalid_token, forbidden, invalid_request, not_found, conflict, series_capacity]
