        revision: { $ref: '#/components/schemas/CardRevision' }
      required: [card_ref, card_handle, revision]

    CardsResponse:
      type: object
      properties:
        next_cursor: {type: string, description: Present only with summary=1. Opaque UUID keyset cursor; empty when complete.}
        cards:
          type: array
          items: { $ref: '#/components/schemas/Card' }
