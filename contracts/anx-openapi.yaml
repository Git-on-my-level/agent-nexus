    post:
      operationId: pmTurnsClaim
      summary: Claim or recover a PM turn with an exclusive runner lease
      description: 'New leases are allocated atomically only while the workspace has fewer than ANX_PM_MAX_CONCURRENT (default 2) claimed turns with unexpired leases. When a waiting turn for the selected PM actor exists but workspace lease capacity is reached, returns 429 busy with error.details {reason: capacity, in_flight: N, limit: M, waiting: K}; waiting counts eligible unleased turns for that actor before their deadline. The message is "Workspace PM capacity reached (N in flight; limit M)". Runners retry after one poll interval. With no waiting turn for that actor, returns 204 even at capacity. Expired leases free capacity. Recovers an unexpired lease held by the same selected PM actor and runner_id before allocating new work, returning its existing token without extending expiry or changing claimed_at. Other runners cannot steal an unexpired lease. Leases last ANX_PM_LEASE_TTL (default 60s), bounded by the turn deadline. Runners must POST heartbeat with the token at a cadence strictly less than TTL/2. Expired leases are reclaimable with a fresh token until the turn deadline; the same open turn becomes unclaimed and waiting again, preserving its history rather than failing. A runner_id identifies one serial worker and must not be shared by concurrent workers. Release the lease on SIGINT or SIGTERM before exiting; a restart with the same runner_id can recover after an abrupt kill.'
      tags:
      - pm
      x-anx-surface: canonical
      x-anx-command-id: pm.turns.claim
      x-anx-cli-path: pm turns claim
      x-anx-why: Claim one queued turn for the selected PM agent so two runners never answer it.
      x-anx-input-mode: json-body
      x-anx-streaming:
        mode: none
      x-anx-output-envelope: Returns `PMClaimedTurn`.
      x-anx-error-codes:
      - auth_required
      - invalid_token
      - invalid_request
      - forbidden
      - not_found
      - conflict
      - source_revision_changed
      - busy
      - unavailable
      x-anx-concepts:
      - cards
      - evidence
      x-anx-stability: beta
      x-anx-agent-notes: Selected PM agent only. Empty body is allowed. 204 means no waiting turn; 429 busy with reason capacity means waiting work is blocked by the lease cap and should be retried after one poll interval.
        Claims recover the same runner_id lease first, or allocate a fresh lease. Past-deadline open turns are
        expired to `failed` on reads, claims, and periodic maintenance. Lease expiry is bounded by the turn deadline and ANX_PM_LEASE_TTL (default 60s). Channel-origin turns use this same claim/complete/fail pipeline.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PMClaimRequest'
      responses:
        '200':
          description: Claimed queued turn with a runner lease
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PMClaimedTurn'
        '204':
          description: No waiting turn for the selected PM actor and no owned lease to recover, including at capacity
        '429':
          description: Waiting work exists but workspace runner lease capacity is reached; busy with reason capacity, in_flight, limit, and waiting. Retry after one poll interval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PMErrorResponse'
