          type: boolean
          description: True when this artifact is owned by a document/card revision wrapper.
        owner_ref:
          allOf:
            - $ref: '#/components/schemas/TypedRef'
          description: Owning document/card ref for system-owned revision artifacts.
        owner_revision_ref:
          allOf:
            - $ref: '#/components/schemas/TypedRef'
