        trashed_by: { type: string }
        trash_reason: { type: string }
      required: [ref, handle, state, created_at, created_by, updated_at, updated_by, provenance]

    Topic:
      type: object
      properties:
        ref: { $ref: '#/components/schemas/ResourceRef' }
        handle: { $ref: '#/components/schemas/ResourceHandle' }
        id:
          allOf:
            - $ref: '#/components/schemas/InternalResourceUUID'
          description: Internal topic UUID/debug id; use `ref` or `handle` for public lookup.
        state:
          $ref: '#/components/schemas/LifecycleState'
          description: Canonical lifecycle state derived from trashed_at / archived_at.
        title: { type: string }
        summary: { type: string }
        thread_id:
          type: string
          description: Backing thread id for topic timeline and events.
        owner_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        document_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        board_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        related_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        workspace_move:
          type: object
          additionalProperties: true
          description: Stable client-side move marker retained for resumable cross-workspace copies.
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }
        provenance: { $ref: '#/components/schemas/Provenance' }
        archived_at: { type: string, format: date-time }
        archived_by: { type: string }
        trashed_at: { type: string, format: date-time }
        trashed_by: { type: string }
        trash_reason: { type: string }
        timeline_message_count:
          type: integer
          description: >
            Derived GET /topics enrichment: count of timeline `message_posted` rows on `thread_id`
            excluding trashed events. Omitted on single-topic GET; clients treat absence as zero.
      required:
        [ref, handle, state, title, summary, owner_refs, document_refs, board_refs, related_refs,
         created_at, created_by, updated_at, updated_by, provenance]

    Document:
      type: object
      properties:
        ref: { $ref: '#/components/schemas/ResourceRef' }
        handle: { $ref: '#/components/schemas/ResourceHandle' }
        id:
          allOf:
            - $ref: '#/components/schemas/InternalResourceUUID'
          description: Internal document UUID/debug id; use `ref` or `handle` for public lookup.
        title: { type: string }
        summary:
          type: string
          description: Optional short blurb for lists and detail (resource-level; not revision body).
        source:
          type: string
          description: Canonical origin this document aggregates (URL or typed ref). Empty when the document is itself the source of truth.
        tags:
          type: array
          items: { type: string }
          description: Operator/agent labels. Tag `knowledge` marks docs meant for agents.
        hosts:
          type: array
          items: { type: string }
          description: Host names this knowledge fact applies to. Empty means unspecified.
        verified_at:
          type: string
          format: date-time
          description: When an agent last verified this knowledge fact. Omitted when never verified.
        subject_ref: { $ref: '#/components/schemas/TypedRef' }
        head_revision_ref: { $ref: '#/components/schemas/TypedRef' }
        state:
          $ref: '#/components/schemas/LifecycleState'
          description: Canonical document lifecycle state.
        refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }
        provenance: { $ref: '#/components/schemas/Provenance' }
        revision_count:
          type: integer
          description: >
            Derived GET /documents list enrichment: rows in revision lineage (`document_revisions`)
            for this document handle.
        head_revision_character_count:
          type: integer
          description: >
            List-only enrichment: approximate Unicode scalar count (UTF-8 text runes) of the decoded
            head revision body. Omitted when the body exceeds a server-defined size cap (~1 MiB) or blob
            bytes are unavailable; clients show a placeholder instead.
        timeline_message_count:
          type: integer
          description: >
            List-only enrichment: timeline `message_posted` counts on backing `thread_id`,
            excluding trashed events (same derivation as `/topics`).
        last_comment:
          type: object
          description: >
            List-only enrichment: most recent `message_posted` comment on the backing thread,
            excluding trashed events. Omitted when the document has no comments.
          properties:
            body: { type: string }
            created_at: { type: string, format: date-time }
            created_by: { type: string }
          required: [body, created_at]
        search_rank:
          type: integer
          description: >
            Search-only enrichment from GET /docs/search. Independent matches have rank 1
            and stable document order. The operational aggregate fallback uses weighted FTS5 rank.
      required:
        [ref, handle, title, subject_ref, head_revision_ref, state, refs, created_at, created_by, updated_at, updated_by, provenance]

    DocumentRevision:
      type: object
      properties:
        ref: { $ref: '#/components/schemas/ResourceRef' }
        handle: { $ref: '#/components/schemas/ResourceHandle' }
        revision_id:
          allOf:
            - $ref: '#/components/schemas/InternalResourceUUID'
          description: Internal document revision UUID/debug id; use `ref` or `handle` for public lookup.
        document_ref: { $ref: '#/components/schemas/TypedRef' }
        prev_revision_ref: { $ref: '#/components/schemas/TypedRef' }
        artifact_ref: { $ref: '#/components/schemas/TypedRef' }
        revision_number: { type: integer }
        summary: { type: string }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
      required: [ref, handle, document_ref, artifact_ref, revision_number, created_at, created_by]

    Board:
      type: object
      properties:
        ref: { $ref: '#/components/schemas/ResourceRef' }
        handle: { $ref: '#/components/schemas/ResourceHandle' }
        id:
          allOf:
            - $ref: '#/components/schemas/InternalResourceUUID'
          description: Internal board UUID/debug id; use `ref` or `handle` for public lookup.
        role:
          type: string
          maxLength: 64
          description: Open board role. initiatives selects this board's eligible active cards for Overview initiatives. Empty clears; omission on patch preserves.
        title: { type: string }
        summary:
          type: string
          description: Optional one-line description for list rows and board headers.
        thread_id:
          type: string
          description: Backing thread id for board timeline and events.
        state:
          $ref: '#/components/schemas/LifecycleState'
          description: Canonical lifecycle state derived from trashed_at / archived_at.
        primary_topic_ref: { $ref: '#/components/schemas/TypedRef' }
        document_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        card_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        card_refs_truncated:
          type: boolean
          description: >
            The membership preview is partial. Single-card create responses echo only the
            created card; list board cards to read memberships. Omitted on full board reads.
        pinned_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }
        provenance: { $ref: '#/components/schemas/Provenance' }
        archived_at: { type: string, format: date-time }
        archived_by: { type: string }
        trashed_at: { type: string, format: date-time }
        trashed_by: { type: string }
        trash_reason: { type: string }
      required:
        [ref, handle, title, state, document_refs, card_refs, pinned_refs, created_at, created_by, updated_at, updated_by, provenance]

    PlanStep:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id: {type: string, maxLength: 64, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
        title: {type: string, minLength: 1, maxLength: 500}
        ref: {type: string, maxLength: 2048}
        after: {type: array, maxItems: 50, uniqueItems: true, items: {type: string}}
        due: {type: string, description: RFC3339 instant or YYYY-MM-DD date}
        status: {type: string, enum: [done, active, blocked, not_started]}
    InitiativePlan:
      type: object
      additionalProperties: false
      required: [steps]
      properties:
        steps: {type: array, maxItems: 200, items: { $ref: '#/components/schemas/PlanStep' }}
    PlanState:
      type: object
      properties:
        steps:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              status: {type: string, enum: [done, active, blocked, not_started]}
              resolvable: {type: boolean}
        progress:
          type: object
          properties:
            done: {type: integer}
            total: {type: integer}
        critical_path: {type: array, items: {type: string}}
        next_steps: {type: array, items: {type: string}}
        shape: {type: string, enum: [chain, dag, lanes]}
        last_movement_at: {type: string, format: date-time}
    PlanHealth:
      type: object
      required: [state, reason, since]
      description: "Computed on read from one clock, promise versus evidence (anx-schema promises). A live note promise is the stated next, so reason names that note's next step and date. Plan-step due dates, the effective due_at and the first RFC3339/YYYY-MM-DD date inside wake_condition are milestones and count only when no live note promise remains; then the earliest unmet at wins. A plan edit meets a milestone inside the horizon and does not meet a note promise. Evidence, a step status change, a linked step moving, or a changed source observation meets a note promise; last_evidence_at is the newest of those plus plan edits. States: done (card phase done or cancelled), past_promise (the counted promise's at is in the past and no reset landed since), moving (a counted promise is still in the future), no_promise (open, nothing promised). There are no duration thresholds; blocked is a count, not a state. since is promise.at for past_promise, last_evidence_at for moving and no_promise, null for done or when unknown."
      properties:
        state: {type: string, enum: [past_promise, moving, no_promise, done]}
        reason: {type: string}
        since: {type: string, format: date-time, nullable: true}
        promise: { $ref: '#/components/schemas/BriefPromise' }
        past_promise_for_seconds: {type: integer, minimum: 0, description: now minus promise.at; present only for past_promise. Excluded from stream change detection.}
        promise_moves: {type: integer, minimum: 0, description: Moves of a note promise since the last reset; omitted when zero.}
        last_evidence_at: {type: string, format: date-time, description: Newest reset event; omitted when none.}
    PossiblyMoot:
      type: object
      required: [flagged, sources]
      description: "Overtaken by events. Only sources ANX has actually observed count as terminal — a done card, or a PR observed merged or closed through the observation cache. A backlog or ready card, or an open ask, is flagged when at least one linked source is known and every linked source has reached a terminal state (done, cancelled, closed, merged, published, resolved). Linked sources are plan step refs and related_refs, resolved through the batched evidence-backed ref resolution; PR URLs read merged from ingested observations, never a read-time fetch. Context-only refs (documents, topics, boards, threads) neither contribute nor block; any other ref that is unresolved, invisible to the reader or of unknown workflow state withholds the flag entirely. The ask rule uses the phase the brief shows. A card placed in backlog, ready, in_progress, or review is also flagged when its latest live note — the note brief.v1 shows — cites an explicit event ref to an inbox ask or review the reader can see that is already answered, resolved, withdrawn, or expired, including a needs_context answer whose expires_at has passed. Stored blocked is placed in in_progress and stored in_review is placed in review, so both are eligible. done and cancelled stay closed. The linked-source rule stays on stored backlog and ready. The ask rule can flag with sources still zero. Prose without that ref is ignored. An ask the reader cannot see does not flag and is not named. Never closes anything: the flag only carries evidence so a human or agent can close the card or ask."
      properties:
        flagged: {type: boolean}
        reason: {type: string, description: "Evidence sentence over observed sources only, for example \"all 2 linked sources are merged\", or the code next_ask_decided when that rule is what flagged the card."}
        sources: {type: integer, description: Number of known linked sources; zero when any linked source is unobserved or of unknown state, which withholds the source rule. The next-ask rule can flag with sources still zero.}
        code: {type: string, description: "Machine reason. next_ask_decided when the latest note cites a visible inbox ask or review that is already answered, resolved, withdrawn, or expired. Omitted for the linked-source rule."}
        ask_ref: {type: string, description: "event ref of the decided ask. Omitted unless code is next_ask_decided. Never set for an ask the reader cannot see."}
        decided_at: {type: string, format: date-time, description: "When that ask was answered, withdrawn, or expired. Omitted unless code is next_ask_decided."}
    PlanStepDigestList:
      type: object
      required: [items, more]
      properties:
        items:
          type: array
          maxItems: 3
          items:
            type: object
            required: [id, title, status]
            properties:
              id: {type: string}
              title: {type: string}
              ref: {type: string, description: Absent for unlinked steps.}
              status: {type: string, enum: [done, active, blocked, not_started]}
              at: {type: string, format: date-time, description: The linked resource's last movement, which is the completion time core holds for a step its resource finished. Absent on current and next steps.}
        more: {type: integer, description: Steps this list omitted, never listed.}
    PlanStepDigest:
      type: object
      nullable: true
      required: [window_hours, completed, current, next]
      description: >
        Three bounded lists over the plan's effective steps, computed from the same steps and referenced
        facts the read already loaded: at most three rows each with the remainder counted, and no query of
        its own. Emitted on Overview initiatives only. completed holds steps a linked resource finished,
        whose resource moved within window_hours, newest movement first; a step marked done inline, or
        linked to a resource whose state says nothing, carries no completion time anywhere and is omitted
        rather than dated from a plan edit or a comment. current holds active and blocked steps; next holds
        ready unstarted steps, so an active step is never listed twice. Both keep the plan's topological
        order with lexicographic ties, the order geometry uses. Null when the card has no plan.
      properties:
        window_hours: {type: integer, description: How recently a completed step must have moved to be listed.}
        completed: { $ref: '#/components/schemas/PlanStepDigestList' }
        current: { $ref: '#/components/schemas/PlanStepDigestList' }
        next: { $ref: '#/components/schemas/PlanStepDigestList' }
    NextPlanStep:
      type: object
      nullable: true
      required: [id, title, ref]
      description: First ready unfinished unblocked step on the critical path, otherwise lexicographic ready step; unreadable linked resources are skipped. Null when none is ready.
      properties:
        id: {type: string}
        title: {type: string}
        ref: {type: string, description: Empty for unlinked steps.}
    CardPlanRequest:
      type: object
      required: [plan, if_updated_at]
      properties:
        actor_id: {type: string, description: Optional dev-mode actor; authenticated principal otherwise.}
        request_key: {type: string, maxLength: 256, description: Optional actor-bound replay key. Retries must preserve the complete original plan and if_updated_at; the original response commits atomically with the edit.}
        plan: { $ref: '#/components/schemas/InitiativePlan' }
        if_updated_at: {type: string, format: date-time}
    CardPlanResponse:
      type: object
      properties:
        summary: {$ref: '#/components/schemas/WorkSummary'}
        card_ref: {type: string}
        plan: {type: object, nullable: true, allOf: [{ $ref: '#/components/schemas/InitiativePlan' }]}
        plan_state: {type: object, nullable: true, allOf: [{ $ref: '#/components/schemas/PlanState' }]}
        plan_resolution_truncated: {type: boolean, description: True when the shared 4000 distinct plan-ref budget was exceeded; omitted refs remain unknown.}
        plan_health: { $ref: '#/components/schemas/PlanHealth' }
        next_step: { $ref: '#/components/schemas/NextPlanStep' }
        status_mismatch: {type: boolean}
        possibly_moot: { $ref: '#/components/schemas/PossiblyMoot' }
        if_updated_at: {type: string, format: date-time}
    ResolvedRef:
      type: object
      required: [ref, resolvable]
      properties:
        metric: {$ref: '#/components/schemas/SeriesMetric'}
        summary: {$ref: '#/components/schemas/WorkSummary'}
        ref: {type: string}
        resolvable: {type: boolean}
        kind: {type: string}
        title: {type: string}
        status: {type: string, nullable: true, description: Published source workflow status; null when the evidence has no status.}
        authority: {type: string}
        native_id: {type: string}
        connection_id: {type: string, description: Ingested source connection when evidence is unambiguous.}
        observed_at: {type: string, format: date-time}
        source: {type: string, enum: [evidence, parsed], description: Core emits evidence for published external keys. The legacy parsed value remains readable but is no longer produced.}
        plan_resolution_truncated: {type: boolean, description: True when the shared 4000 distinct plan-ref budget was exceeded; omitted refs remain unknown.}
        plan_health: { $ref: '#/components/schemas/PlanHealth' }
        status_mismatch: {type: boolean}
        possibly_moot: { $ref: '#/components/schemas/PossiblyMoot' }
        phase: {type: string}
        owner: {type: string}
        owner_display: {type: string}
        board:
          type: object
          required: [ref, title]
          properties:
            ref: {type: string}
            title: {type: string}
        priority: {type: string}
        last_moved_at: {type: string, format: date-time}
        next_step: { $ref: '#/components/schemas/NextPlanStep' }
        progress:
          type: object
          properties:
            done: {type: integer}
            total: {type: integer}
        url: {type: string, nullable: true, description: "Null when source evidence has no URL. Workspace-relative route; hosted clients prefix /o/<org>/w/<ws>. Absolute source URLs are used as-is. A document_revision opens its document at that revision (`/docs/<handle>?revision=<revision handle>`); a card_revision opens its card."}
        parent_ref: {type: string, description: "For document_revision and card_revision refs, the canonical ref of the document or card that owns the revision. A revision resolves only when its parent is visible to the reader."}

    Card:
      type: object
      properties:
        source_refs: { $ref: '#/components/schemas/SourceRefs' }
        ref: { $ref: '#/components/schemas/ResourceRef' }
        handle: { $ref: '#/components/schemas/ResourceHandle' }
        id:
          allOf:
            - $ref: '#/components/schemas/InternalResourceUUID'
          description: Internal card UUID/debug id; use `ref` or `handle` for public lookup.
        board_ref: { $ref: '#/components/schemas/TypedRef' }
        topic_ref: { $ref: '#/components/schemas/TypedRef' }
        thread_id:
          type: string
          description: Backing thread id for card timeline and packet lifecycle (always set for persisted cards).
        document_ref: { $ref: '#/components/schemas/TypedRef' }
        head_revision_ref: { $ref: '#/components/schemas/TypedRef' }
        head_revision_number: { type: integer }
        title: { type: string }
        work_summary: {$ref: '#/components/schemas/WorkSummary'}
        summary:
          description: Legacy prose by default; WorkSummary when summary=1 is requested.
          oneOf: [{type: string}, {$ref: '#/components/schemas/WorkSummary'}]
        summary_text: {type: string}
        plan: { $ref: '#/components/schemas/InitiativePlan' }
        plan_state: { $ref: '#/components/schemas/PlanState' }
        plan_resolution_truncated: {type: boolean, description: True when the shared 4000 distinct plan-ref budget was exceeded; omitted refs remain unknown.}
        plan_health: { $ref: '#/components/schemas/PlanHealth' }
        next_step: { $ref: '#/components/schemas/NextPlanStep' }
        status_mismatch: {type: boolean, description: True when phase is backlog and at least one plan step is done. No automatic phase changes.}
        column_key:
          type: string
          enum: [backlog, ready, in_progress, blocked, review, done]
        rank: { type: string }
        assignee_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        due_at:
          type: string
          format: date-time
          nullable: true
          description: Optional due instant for the work item.
        definition_of_done:
          type: array
          items: { type: string }
          description: Acceptance lines for completing the card.
        risk:
          type: string
          enum: [low, medium, high, critical]
        resolution:
          type: string
          nullable: true
          enum: [done]
          description: Null while the card is active; `done` when completed in the done column (abandonment uses trash/archive).
        resolution_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        related_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }
        provenance: { $ref: '#/components/schemas/Provenance' }
        archived_at: { type: string, format: date-time }
        archived_by: { type: string }
        trashed_at: { type: string, format: date-time }
        trashed_by: { type: string }
        trash_reason: { type: string }
      required:
        [ref, handle, board_ref, thread_id, head_revision_ref, head_revision_number, title, summary, column_key, rank, assignee_refs, risk, resolution_refs,
         related_refs, created_at, created_by, updated_at, updated_by, provenance]

    CardRevision:
      type: object
      properties:
        ref: { $ref: '#/components/schemas/ResourceRef' }
        handle: { $ref: '#/components/schemas/ResourceHandle' }
        revision_id:
          allOf:
            - $ref: '#/components/schemas/InternalResourceUUID'
          description: Internal card revision UUID/debug id; use `ref` or `handle` for public lookup.
        card_ref: { $ref: '#/components/schemas/TypedRef' }
        prev_revision_ref: { $ref: '#/components/schemas/TypedRef' }
        artifact_ref: { $ref: '#/components/schemas/TypedRef' }
        revision_number: { type: integer }
        summary: { type: string }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
      required: [ref, handle, card_ref, artifact_ref, revision_number, created_at, created_by]

    BoardSummary:
      type: object
      properties:
        truncated: {type: boolean}
        card_count: { type: integer }
        cards_by_column:
          type: object
          additionalProperties: { type: integer }
        unresolved_card_count: { type: integer }
        resolved_card_count: { type: integer }
        document_count: { type: integer }
        latest_activity_at: { type: string, format: date-time }
        has_document_refs: { type: boolean }
        document_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
      required: [card_count, cards_by_column, unresolved_card_count, resolved_card_count, document_count]

    BoardCardSummary:
      type: object
      properties:
        decision_request_count: { type: integer }
        decision_count: { type: integer }
        recommendation_count: { type: integer }
        document_count: { type: integer }
        inbox_count: { type: integer }
        latest_activity_at:
          type: string
          format: date-time
          nullable: true
        due_at:
          type: string
          format: date-time
          nullable: true
      required: [decision_request_count, decision_count, recommendation_count, document_count, inbox_count, latest_activity_at]

    BoardWorkspaceCard:
      type: object
      properties:
        card: { $ref: '#/components/schemas/Card' }
        summary: { $ref: '#/components/schemas/BoardCardSummary' }
        projection_freshness: { $ref: '#/components/schemas/ProjectionFreshness' }
      required: [card, summary, projection_freshness]

    BoardMembership:
      type: object
      properties:
        board_ref: { $ref: '#/components/schemas/TypedRef' }
        board_title: { type: string }
        column_key:
          type: string
          enum: [backlog, ready, in_progress, blocked, review, done]
      required: [board_ref, board_title, column_key]

    InboxItem:
      description: Open human attention requests remain actionable until response or withdrawal, independently of linked subject lifecycle. Thread privacy still applies.
      type: object
      properties:
        related_cards: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/ResolvedRef'}}
        possibly_moot: { $ref: '#/components/schemas/PossiblyMoot' }
        related_cards_truncated: {type: boolean}
        id: { type: string }
        kind:
          type: string
          description: Open classifier; v1 known values are ask, review, escalate and report_review. report_review is a nonactionable author-only deadline reminder.
        response_proposals:
          type: array
          description: >
            Ordered agent-provided response suggestions; index 0 is the recommended response
            (highlighted in the respond UI). Attention requests require 1–6 suggestions; report_review returns an empty list. Strings have max length 240 after
            server normalization (trim, drop empty, exact dedupe).
          minItems: 0
          maxItems: 6
          items:
            type: string
            maxLength: 240
        thread_id:
          type: string
          description: Backing thread id for the inbox item and response correlation.
        subject_ref: { $ref: '#/components/schemas/TypedRef' }
        request_event_ref: { $ref: '#/components/schemas/TypedRef' }
        source_event_ref: { $ref: '#/components/schemas/TypedRef' }
        title: { type: string }
        body: { type: string }
        related_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        recipient_actor_id: {type: string, description: When present this inbox item is visible only to that principal and current subject access still applies.}
        panel_id: {type: string}
        revision_ref: {type: string}
        subtype: {type: string}
        requester_actor_id: { type: string }
        requester_agent_id: { type: string }
        requester_label: { type: string }
        severity: { type: string }
        allowed_response_outcomes:
          type: array
          description: When present, clients must restrict response actions to these outcomes. Structured access requests expose only approved and rejected; clarification is not supported for grant decisions.
          items: {$ref: '#/components/schemas/HumanAttentionResponseOutcome'}
        access_request_id: {type: string}
        requested_grant: {type: string}
        requester_principal_id: {type: string}
        notification_target_status:
          type: object
          additionalProperties: true
      required: [id, kind, subject_ref, title, related_refs, response_proposals]

    TopicWriteInput:
      type: object
      properties:
        id:
          type: string
          description: Optional caller-selected topic id for replay-safe copies.
        title: { type: string }
        summary: { type: string }
        owner_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        document_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        board_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        related_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        workspace_move:
          type: object
          additionalProperties: true
          description: Stable client-side move marker included in the topic creation event.
        thread_id:
          type: string
          description: Optional caller-selected backing thread id for an idempotent topic copy.
        provenance: { $ref: '#/components/schemas/Provenance' }
      required: [title, summary, owner_refs, document_refs, board_refs, related_refs, provenance]

    TopicPatchInput:
      type: object
      properties:
        title: { type: string }
        summary: { type: string }
        owner_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        document_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        board_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        related_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        workspace_move:
          type: object
          additionalProperties: true
        provenance: { $ref: '#/components/schemas/Provenance' }

    DocumentCreateInput:
      type: object
      properties:
        document_id:
          type: string
          description: Optional caller-selected document id for replay-safe copies.
        handle:
          $ref: '#/components/schemas/ResourceHandle'
        title: { type: string }
        summary:
          type: string
          description: Optional resource-level blurb (list/detail); distinct from revision content.
        thread_id:
          type: string
          description: Optional backing thread id for a replay-safe document copy.
        source:
          type: string
          description: Canonical origin URL or typed ref this document aggregates.
        tags:
          type: array
          items: { type: string }
          description: Operator/agent labels. Include `knowledge` for agent-facing docs.
        hosts:
          type: array
          items: { type: string }
          description: Host names this knowledge fact applies to.
        verified_at:
          type: string
          format: date-time
          description: When this knowledge fact was last verified.
        subject_ref: { $ref: '#/components/schemas/TypedRef' }
        refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        provenance: { $ref: '#/components/schemas/Provenance' }
        workspace_move:
          type: object
          additionalProperties: true
          description: Stable client-side move marker included in the document creation event and revision artifact metadata.
      required: [title]

    DocumentRevisionCreateInput:
      type: object
      properties:
        summary: { type: string }
        refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        provenance: { $ref: '#/components/schemas/Provenance' }

    BoardCreateInput:
      type: object
      properties:
        id:
          type: string
          description: Optional caller-selected board id for replay-safe copies.
        thread_id:
          type: string
          description: Optional backing thread id for a replay-safe board copy.
        role:
          type: string
          maxLength: 64
          description: Open board role. initiatives selects this board's eligible active cards for Overview initiatives. Empty clears; omission on patch preserves.
        title: { type: string }
        summary:
          type: string
          description: Optional one-line description for list and board header.
        primary_topic_ref: { $ref: '#/components/schemas/TypedRef' }
        document_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        pinned_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        column_schema:
          type: object
          additionalProperties: true
          description: Optional board column definitions retained when copying a board.
        workspace_move:
          type: object
          additionalProperties: true
          description: Stable client-side move marker included in the board creation event.
        provenance: { $ref: '#/components/schemas/Provenance' }
      required: [title, document_refs, pinned_refs, provenance]

    BoardPatchInput:
      type: object
      properties:
        role:
          type: string
          maxLength: 64
          description: Open board role. initiatives selects this board's eligible active cards for Overview initiatives. Empty clears; omission on patch preserves.
        title: { type: string }
        summary:
          type: string
          description: Optional one-line description for list and board header.
        primary_topic_ref: { $ref: '#/components/schemas/TypedRef' }
        document_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        pinned_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        provenance: { $ref: '#/components/schemas/Provenance' }

    CardHandle:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      description: Canonical lowercase slug; reserved resource names and UUIDs are rejected. Conflicts return HTTP 409. Omit to derive a word-bounded handle of at most 40 characters from the title; existing handles are unchanged.

    CardCreateInput:
      type: object
      properties:
        handle:
          $ref: '#/components/schemas/CardHandle'
        id:
          type: string
          description: Optional caller-selected storage id, including UUIDs; independent of the public handle. Existing storage-id validation applies. If both id and card_id are supplied, card_id takes precedence.
        card_id:
          type: string
          description: Optional caller-selected storage id, including UUIDs; independent of the public handle. Existing storage-id validation applies. If both id and card_id are supplied, card_id takes precedence.
        topic_ref: { $ref: '#/components/schemas/TypedRef' }
        document_ref: { $ref: '#/components/schemas/TypedRef' }
        title: { type: string }
        summary: { type: string }
        column_key:
          type: string
          enum: [backlog, ready, in_progress, blocked, review, done]
        before_card_id:
          type: string
          description: Optional neighbor card ref or handle for initial ordering within column_key.
        after_card_id:
          type: string
          description: Optional neighbor card ref or handle for initial ordering; mutually exclusive with before_card_id.
        assignee_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        risk:
          type: string
          enum: [low, medium, high, critical]
        resolution:
          type: string
          nullable: true
          enum: [done]
        resolution_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        related_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        due_at:
          type: string
          format: date-time
          nullable: true
        definition_of_done:
          type: array
          items: { type: string }
        provenance: { $ref: '#/components/schemas/Provenance' }
      required: [title]

    CardPatchInput:
      type: object
      description: >
        Mutable non-content card fields only. Versioned card content (`title`, `summary`,
        `definition_of_done`) is changed through POST /cards/{card_id}/revisions.
      properties:
        topic_ref: { $ref: '#/components/schemas/TypedRef' }
        document_ref: { $ref: '#/components/schemas/TypedRef' }
        assignee_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        risk:
          type: string
          enum: [low, medium, high, critical]
        resolution:
          type: string
          nullable: true
          enum: [done]
        resolution_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        related_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        due_at:
          type: string
          format: date-time
          nullable: true
        provenance: { $ref: '#/components/schemas/Provenance' }

    CardRevisionCreateInput:
      type: object
      properties:
        title: { type: string }
        summary: { type: string }
        definition_of_done:
          type: array
          items: { type: string }
        refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        provenance: { $ref: '#/components/schemas/Provenance' }
      required: [title, summary]

    MoveCardInput:
      type: object
      properties:
        request_key:
          type: string
          maxLength: 256
          description: Optional actor-bound key for atomic replay of the original move and lifecycle-event receipt. Reuse requires the same target, body and concurrency tokens.
        if_version:
          type: integer
          format: int64
          description: Optional original work-version fence, checked in the move transaction alongside the board token.
        column_key:
          type: string
          enum: [backlog, ready, in_progress, blocked, review, done]
        before_card_id:
          type: string
          description: Insert immediately before this card ref or handle in column_key; mutually exclusive with after_card_id. Resolved like path `{card_id}` (typed `card:` ref, handle, or UUID).
        after_card_id:
          type: string
          description: Insert immediately after this card ref or handle in column_key; mutually exclusive with before_card_id. Resolved like path `{card_id}` (typed `card:` ref, handle, or UUID).
        resolution:
          type: string
          enum: [done]
        resolution_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        if_board_updated_at:
          type: string
          format: date-time
          description: Parent board optimistic concurrency token; required for moves that update column/rank (matches core).
      required: [column_key, if_board_updated_at]

    EventCreateInput:
      type: object
      properties:
        type: { type: string }
        actor_id: { type: string }
        thread_ref: { $ref: '#/components/schemas/TypedRef' }
        refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        summary: { type: string }
        payload:
          type: object
          additionalProperties: true
          description: For human_attention_responded, see HumanAttentionRespondedPayload; for human_attention_withdrawn, see HumanAttentionWithdrawnPayload.
        provenance: { $ref: '#/components/schemas/Provenance' }
      required: [type, actor_id, refs, summary, provenance]

    CreateTopicRequest:
      type: object
      properties:
        request_key: { type: string, description: Stable idempotency key for replay-safe topic creation. }
        topic: { $ref: '#/components/schemas/TopicWriteInput' }
      required: [topic]

    PatchTopicRequest:
      type: object
      properties:
        actor_id: { type: string }
        request_key: { type: string, maxLength: 256, description: "Original-result replay committed atomically with topic, backing thread, refs and update event. Binds the original actor, canonical topic, complete decoded body and metadata base; keep unchanged until confirmed." }
        patch: { $ref: '#/components/schemas/TopicPatchInput' }
        if_updated_at:
          type: string
          format: date-time
      required: [patch, if_updated_at]

    CreateDocumentRequest:
      type: object
      properties:
        actor_id: { type: string }
        request_key: { type: string, maxLength: 256, description: "Original-result replay committed atomically with document and first revision; retain unchanged until confirmed." }
        document: { $ref: '#/components/schemas/DocumentCreateInput' }
        content: {}
        content_base64:
          type: string
          format: byte
          description: Binary document bytes encoded as standard base64; mutually exclusive with content.
        content_type:
          type: string
          enum: [text, structured, binary]
        refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
      required: [document, content_type]
      anyOf:
      - required: [content]
      - required: [content_base64]

    PutDocumentRequest:
      type: object
      properties:
        actor_id: { type: string }
        document:
          type: object
          properties:
            title: { type: string }
            summary: { type: string }
            source: { type: string }
            tags:
              type: array
              items: { type: string }
            hosts:
              type: array
              items: { type: string }
            verified_at:
              type: string
              format: date-time
            subject_ref: { $ref: '#/components/schemas/TypedRef' }
            refs:
              type: array
              items: { $ref: '#/components/schemas/TypedRef' }
            provenance: { $ref: '#/components/schemas/Provenance' }
        content: {}
        content_type:
          type: string
          enum: [text, structured, binary]
        refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
      required: [content, content_type]

    DocumentPatchInput:
      type: object
      description: >
        Resource-only fields. Omitted keys are preserved. Empty string on `summary` or `source`
        clears that field. `tags` replaces the full tag list when present.
      properties:
        title:
          type: string
          description: Resource-level title.
        summary:
          type: string
          description: Resource-level blurb for lists and detail (not revision body).
        source:
          type: string
          description: Canonical origin URL or typed ref; empty string clears.
        tags:
          type: array
          items: { type: string }
          description: Replaces the document tag list when present.
        hosts:
          type: array
          items: { type: string }
          description: Replaces the host list this knowledge fact applies to when present.
        verified_at:
          type: string
          format: date-time
          description: When this knowledge fact was last verified; empty string clears.

    PatchDocumentRequest:
      type: object
      properties:
        actor_id: { type: string }
        request_key:
          type: string
          maxLength: 256
          description: Actor-scoped original-result replay committed atomically with this mutation; retain unchanged until confirmed.
        patch: { $ref: '#/components/schemas/DocumentPatchInput' }
        if_updated_at:
          type: string
          format: date-time
      required: [patch, if_updated_at]

    CreateDocumentRevisionRequest:
      type: object
      properties:
        request_key:
          type: string
          maxLength: 256
          description: Actor-scoped original-result replay committed atomically with this mutation; retain unchanged until confirmed.
        if_base_revision:
          type: string
          description: Base revision ref or handle for optimistic concurrency; must match the document head when appending from the current tip.
        actor_id: { type: string }
        document:
          type: object
          additionalProperties: true
          description: Optional document metadata patch to apply with this revision.
        content: {}
        content_type:
          type: string
          enum: [text, structured, binary]
        refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        provenance: { $ref: '#/components/schemas/Provenance' }
      required: [if_base_revision, content, content_type]

    CreateCardRevisionRequest:
      type: object
      properties:
        if_base_revision:
          type: string
          description: Base card revision ref or handle for optimistic concurrency; must match the card head.
        actor_id: { type: string }
        request_key: { type: string, maxLength: 256, description: "Optional actor-bound original-result replay key; retain the original revision body and base token until confirmed." }
        revision: { $ref: '#/components/schemas/CardRevisionCreateInput' }
      required: [if_base_revision, revision]

    CreateBoardRequest:
      type: object
      properties:
        board: { $ref: '#/components/schemas/BoardCreateInput' }
      required: [board]

    PatchBoardRequest:
      type: object
      properties:
        patch: { $ref: '#/components/schemas/BoardPatchInput' }
        if_updated_at:
          type: string
          format: date-time
      required: [patch, if_updated_at]

    CreateCardRequest:
      type: object
      properties:
        actor_id: { type: string }
        request_key:
          type: string
          description: >
            Stable actor-scoped idempotency key. The card and replay result commit atomically.
            Reuse the same key and original body after an unknown outcome; a different body
            with the same key is a conflict. The CLI generates a key when omitted and prints
            it on transport errors. Replays remain subject to current resource authorization.
        board_id:
          type: string
          deprecated: true
          description: >
            Deprecated compatibility alias for board_handle. Prefer board_ref. Ignored for
            POST /boards/{board_id}/cards (path segment resolves as public ref or handle).
        board_handle:
          $ref: '#/components/schemas/ResourceHandle'
        board_ref:
          allOf:
            - $ref: '#/components/schemas/TypedRef'
          description: Preferred board identity for POST /cards; MUST be a board:<handle> public ref.
        card: { $ref: '#/components/schemas/CardCreateInput' }
        if_board_updated_at:
          type: string
          format: date-time
      required: [card]

    BatchCreateBoardCardsRequest:
      type: object
      properties:
        actor_id: { type: string }
        request_key: { type: string }
        if_board_updated_at:
          type: string
          format: date-time
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/BoardCardBatchItemInput'
      required: [items]

    BoardCardBatchItemInput:
      type: object
      description: >
        One card to create; same field conventions as POST /boards/{board_id}/cards for a single
        card (flat fields and optional nested `card`). Do not send actor_id, request_key,
        if_board_updated_at, board_id, board_handle, or board_ref on each item — use the batch envelope.
      additionalProperties: true
      properties:
        card: { $ref: '#/components/schemas/CardCreateInput' }
        card_id:
          type: string
          description: Optional caller-selected storage id, including UUIDs; independent of the public handle. Existing storage-id validation applies. If both id and card_id are supplied, card_id takes precedence.
        handle:
          $ref: '#/components/schemas/CardHandle'
        id:
          type: string
          description: Optional caller-selected storage id, including UUIDs; independent of the public handle. Existing storage-id validation applies. If both id and card_id are supplied, card_id takes precedence.
        title: { type: string }
        summary: { type: string }
        column_key:
          type: string
          enum: [backlog, ready, in_progress, blocked, review, done]
        before_card_id:
          type: string
          description: Optional neighbor card ref or handle; compatibility field name retained for older clients.
        after_card_id:
          type: string
          description: Optional neighbor card ref or handle; compatibility field name retained for older clients.
        before_thread_id:
          type: string
          deprecated: true
          description: Deprecated legacy neighbor thread selector; prefer card refs/handles for ordering.
        after_thread_id:
          type: string
          deprecated: true
          description: Deprecated legacy neighbor thread selector; prefer card refs/handles for ordering.
        parent_thread:
          type: string
          deprecated: true
          description: Deprecated legacy backing thread selector; card identity is public ref/handle based.
        thread_id:
          type: string
          deprecated: true
          description: Deprecated legacy backing thread selector; card identity is public ref/handle based.
        assignee_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        risk:
          type: string
          enum: [low, medium, high, critical]
        resolution:
          type: string
          nullable: true
          enum: [done]
        resolution_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        related_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        topic_ref: { $ref: '#/components/schemas/TypedRef' }
        document_ref: { $ref: '#/components/schemas/TypedRef' }
        due_at:
          type: string
          format: date-time
          nullable: true
        definition_of_done:
          type: array
          items: { type: string }
        provenance: { $ref: '#/components/schemas/Provenance' }
      required: [title]

    BatchCreateBoardCardsResponse:
      type: object
      properties:
        board: { $ref: '#/components/schemas/Board' }
        cards:
          type: array
          items: { $ref: '#/components/schemas/Card' }
        markdown_hygiene: { $ref: '#/components/schemas/MarkdownHygiene' }
      required: [board, cards]

    PatchCardRequest:
      type: object
      properties:
        request_key: {type: string, maxLength: 256, description: Optional actor-bound replay key; preserve the original patch and concurrency token on retry.}
        actor_id: { type: string }
        patch: { $ref: '#/components/schemas/CardPatchInput' }
        if_updated_at:
          type: string
          format: date-time
      required: [patch, if_updated_at]

    MoveCardRequest:
      description: >
        Flat card move body (`column_key`, optional placement
        hints, optional terminal resolution).
      allOf:
        - $ref: '#/components/schemas/MoveCardInput'
        - type: object
          properties:
            actor_id:
              type: string
              description: Optional actor performing the move (may also be supplied via auth headers).

    CreateEventRequest:
      type: object
      properties:
        event: { $ref: '#/components/schemas/EventCreateInput' }
      required: [event]

    AskEvidence:
      type: object
      required: [label, url]
      properties:
        label: {type: string, minLength: 1}
        url: {type: string, format: uri}
      description: External ask evidence in event.payload.evidence. Native evidence stays in payload.related_refs. Ask bodies use Decision, Context (2–5 sentences), What each option does and Evidence sections. Link named PRs and commit-pinned code lines; summarise code. event.payload.supersedes links a previous ask. event.payload.authoring_override_reason records a CLI lint override.
    AskWebhookPayload:
      type: object
      additionalProperties: false
      required: [ask_id, card_ref, status, outcome, response_event_id, response_text]
      description: Signed webhook POST body after recipient authorization. X-ANX-Signature is sha256= plus HMAC-SHA256 of X-ANX-Timestamp + '.' + exact body bytes using the returned secret text as key. Receivers enforce the 300-second replay window and deduplicate the stable Idempotency-Key. No response bodies are logged.
      properties:
        ask_id: {type: string}
        card_ref: {type: string}
        status: {type: string, enum: [answered, needs_context, withdrawn, expired]}
        outcome: {type: string, nullable: true}
        response_event_id: {type: string}
        response_text: {type: string, nullable: true}
    AskSubscription:
      type: object
      required: [id, kind, label]
      properties:
        id: {type: string}
        kind: {type: string, enum: [await, bridge, webhook]}
        label: {type: string}
        secret: {type: string, description: Webhook HMAC key returned once on creation; never returned by ask reads.}
        state: {type: string, enum: [none]}
        attempts: {type: integer, minimum: 0}
    AskSubscriptionInput:
      type: object
      additionalProperties: false
      required: [kind, label]
      properties:
        kind: {type: string, enum: [await, bridge, webhook]}
        label: {type: string, minLength: 1, maxLength: 120}
        url: {type: string, maxLength: 2048, description: HTTPS webhook URL. No credentials, fragments, redirects or non-public resolved addresses.}
    AskDeliveryReceipt:
      type: object
      required: [subscription_id, state, attempts]
      properties:
        subscription_id: {type: string}
        state: {type: string, enum: [pending, delivered, failed]}
        attempts: {type: integer, minimum: 0, maximum: 20}
        reason: {type: string, maxLength: 200}
    AskTaskOutcome:
      type: object
      nullable: true
      properties:
        card_ref: {type: string}
        phase: {type: string}
        next_actor: {type: string}
        reason: {type: string, description: source_owned means source phase was preserved.}
    AskOutcome:
      type: object
      required: [ask_id, status, subject_ref, delivery]
      properties:
        ask_id: {type: string}
        access_request_ref: {type: string, description: Set when the ask is the caller's own access request, or a human is reading that request's event. Absent for ordinary asks.}
        status: {type: string, enum: [open, answered, needs_context, withdrawn, expired]}
        subject_ref: {type: string}
        response: {type: object, additionalProperties: true, nullable: true}
        task_outcome:
          type: object
          properties:
            card_ref: {type: string}
            phase: {type: string}
            next_actor: {type: string}
            reason: {type: string}
        delivery:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/AskDelivery'}
    AskDelivery:
      type: object
      required: [kind, label, state, attempts]
      properties:
        id: {type: string}
        kind: {type: string, enum: [await, bridge, webhook]}
        label: {type: string, maxLength: 120}
        state: {type: string, enum: [pending, delivered, failed, none]}
        log:
          type: array
          maxItems: 5
          items:
            type: object
            properties:
              attempt: {type: integer}
              at: {type: string}
              status_code: {type: integer}
              latency_ms: {type: integer}
        status_code: {type: integer, description: Last HTTP status, zero before a response.}
        latency_ms: {type: integer, minimum: 0}
        attempts: {type: integer, minimum: 0}
        last_at: {type: string, nullable: true}
        reason: {type: string, maxLength: 200}
    RespondInboxItemRequest:
      type: object
      description: >
        Records a human response to a human attention inbox item. The response target must be
        resolvable unless `notify_mode` is `none` or a replacement target is supplied.
        Server-linked access requests accept only approved or rejected; needs_context and other outcomes
        return 400 without mutation. Approval atomically grants the persisted requested
        grant to its persisted principal. Event-supplied correlation never grants authority.
        A single-ask item requires response_text and outcome. A batch item — the derived
        inbox id of a POST /asks/batch filing, or a brief curation id inbox:curation-batch:{key} —
        accepts that same flat response_text, outcome and notify_mode (`none` or `original`)
        and records it on every open member in one transaction. `none` records every member
        without a wake; `original` releases each member on its own delivery mode. A filed
        batch also accepts answers (one entry per
        member); flat fields and notify overrides must then be empty, and each member releases
        on its own delivery mode. The same idempotency key replays the original combined result.
      properties:
        idempotency_key: {type: string, minLength: 1, maxLength: 128, description: Stable key for one intended response. Reuse the same key and body after an ambiguous failure to retrieve the original event and result.}
        actor_id: { type: string }
        inbox_item_id:
          type: string
          description: Must match path inbox_id when both are provided.
        response_text: { type: string }
        outcome: { $ref: '#/components/schemas/HumanAttentionResponseOutcome' }
        related_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        notify_mode:
          type: string
          enum: [original, replacement, none]
          description: Defaults to original requester when resolvable.
        notify_target_actor_id: { type: string }
        notify_target_agent_id: { type: string }
        answers:
          type: array
          items: { $ref: '#/components/schemas/RespondInboxItemAnswer' }
          description: >
            Optional per-member answers for a filed ask batch (one derived from POST /asks/batch).
            When present, one entry per member, flat response_text/outcome must be empty, and
            notify overrides are rejected. Omit answers to apply one flat response_text, outcome
            and notify_mode to every open member instead. A curation batch id only accepts the flat form.

    RespondInboxItemAnswer:
      type: object
      description: One member answer inside a batch inbox response.
      properties:
        ask_ref:
          type: string
          description: The batch member's ask event ref (event:<id>) matching one entry of the batch item.
        response_text: { type: string }
        outcome: { $ref: '#/components/schemas/HumanAttentionResponseOutcome' }
        related_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
      required: [ask_ref, response_text, outcome]

    RespondInboxBatchResponse:
      type: object
      description: Response recorded for every member of a batch inbox item in one atomic pass.
      properties:
        batch_id: { type: string }
        answers:
          type: array
          items:
            type: object
            properties:
              ask_ref:
                type: string
                description: The member's ask event ref, echoing the submitted ask_ref for correlation. The answer event id is answers[].event.id.
              event: { $ref: '#/components/schemas/Event' }
              task_outcome: {$ref: '#/components/schemas/AskTaskOutcome'}
        notify:
          type: object
          additionalProperties: true
        markdown_hygiene: { $ref: '#/components/schemas/MarkdownHygiene' }
      required: [batch_id, answers, notify]

    HumanAttentionResponseOutcome:
      type: string
      enum: [answered, approved, rejected, acknowledged, needs_context, resolved]
      description: >
        answered means a chosen proposal or free reply; approved and rejected mean the
        explicit review Approve and Reject actions; acknowledged means the operator
        closed the item without answering it. needs_context returns the task to its owner without counting as answered; re-ask with supersedes. resolved explicitly closes a native task. The response text remains the audit note.

    CurationCandidate:
      type: object
      required: [key, action, targets, title, rationale, response_proposals]
      properties:
        key: {type: string, description: Stable key over the action and its sorted targets.}
        action: {type: string, enum: [withdraw, merge, batch]}
        targets:
          type: array
          items: {type: string}
          description: "withdraw: [ask event ref]; merge: [duplicate card ref, kept card ref]; batch: member ask event refs."
        title: {type: string}
        body: {type: string}
        rationale: {type: string}
        score: {type: number}
        response_proposals:
          type: array
          items: {type: string}
          description: Index 0 accepts the proposal.
    CurationCandidatesResponse:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          items: {$ref: '#/components/schemas/CurationCandidate'}
        limitations:
          type: array
          items: {type: string}
    CurationProposalRequest:
      type: object
      required: [action, targets, rationale]
      properties:
        action: {type: string, enum: [withdraw, merge, batch]}
        targets:
          type: array
          minItems: 1
          maxItems: 10
          items: {type: string}
        rationale: {type: string, maxLength: 2000, description: Why a human should accept; shown in the decision body.}
        title: {type: string, maxLength: 160, description: Optional one-line decision; defaults to the formula title.}
    CurationProposal:
      type: object
      required: [key, status, action, targets]
      properties:
        key: {type: string}
        status: {type: string, enum: [created, existing, dismissed]}
        action: {type: string, enum: [withdraw, merge, batch]}
        targets:
          type: array
          items: {type: string}
        event_id: {type: string, description: The proposal ask event id.}
        source: {type: string, enum: [formula, pm]}
    CurationProposalResponse:
      type: object
      required: [proposal]
      properties:
        proposal: {$ref: '#/components/schemas/CurationProposal'}
    CurationRunResponse:
      type: object
      required: [proposals, skipped]
      properties:
        proposals:
          type: array
          items: {$ref: '#/components/schemas/CurationProposal'}
        skipped: {type: integer}
    CurationMetricsResponse:
      type: object
      required: [metrics]
      properties:
        metrics:
          type: object
          additionalProperties: true
          description: "`{window_start, window_end, s17, s18, s20, truncated}`; see the curation section of anx-schema.yaml."
    CreateAskBatchRequest:
      type: object
      description: >
        Files 2 to 10 human_attention_requested events as one atomic batch addressed to one
        backing thread. Each ask must pass the same validation as POST /events; the server
        assigns the shared batch id and rejects client-supplied batch ids.
      properties:
        actor_id: { type: string }
        request_key: { type: string, maxLength: 128, description: Stable key for one intended batch; replay returns the original batch result. }
        asks:
          type: array
          items: { $ref: '#/components/schemas/Event' }
          description: 2 to 10 human_attention_requested events sharing one thread_id.
      required: [asks]

    CreateAskBatchResponse:
      type: object
      properties:
        batch_id: { type: string, description: Shared id recorded in every member's payload; the human inbox derives one item from it. }
        events:
          type: array
          items: { $ref: '#/components/schemas/Event' }
      required: [batch_id, events]

    HumanAttentionRespondedPayload:
      type: object
      description: Payload of a human_attention_responded event.
      properties:
        inbox_item_id: { type: string }
        kind: { type: string }
        response_text: { type: string }
        outcome: { $ref: '#/components/schemas/HumanAttentionResponseOutcome' }
        responding_actor_id: { type: string }
      required: [inbox_item_id, kind, response_text, outcome, responding_actor_id]

    HumanAttentionWithdrawnPayload:
      type: object
      description: Payload of a requester-authored human_attention_withdrawn event.
      properties:
        request_event_id: { type: string }
        request_event_ref: { $ref: '#/components/schemas/TypedRef' }
        withdrawn_by_actor_id: { type: string }
        reason: { type: string, minLength: 1 }
      required: [request_event_id, request_event_ref, withdrawn_by_actor_id, reason]

    EventLifecycleMutationRequest:
      type: object
      description: |
        Optional original-result replay. Keyed calls require if_lifecycle, the
        original parent visibility state. Mutations and reply cascades commit
        atomically. A cascade admits at most 2000 descendants and each expanded
        event admits at most 2001 inbound raw reference edges of any kind,
        including unrelated sources. Saturated targets or larger trees return conflict without changes. Legacy unkeyed calls remain supported.
      properties:
        actor_id: { type: string }
        request_key: { type: string, maxLength: 256 }
        reason: { type: string }
        selected_bases:
          type: object
          maxProperties: 2000
          description: Frozen lifecycle bases for explicitly selected events. Every scoped member of the ancestor cascade is compared in the writer transaction before any changes; a mismatch conflicts the entire request.
          additionalProperties:
            type: object
            required: [archived_at, trashed_at]
            properties:
              archived_at: { type: string, nullable: true }
              trashed_at: { type: string, nullable: true }
        if_lifecycle:
          type: object
          required: [archived_at, trashed_at]
          properties:
            archived_at: { type: string, nullable: true }
            trashed_at: { type: string, nullable: true }

    TopicLifecycleMutationRequest:
      type: object
      properties:
        actor_id: { type: string }
        if_updated_at:
          type: string
          format: date-time

    TopicTrashRequest:
      type: object
      properties:
        actor_id: { type: string }
        reason: { type: string }
      required: [reason]

    BoardLifecycleMutationRequest:
      type: object
      properties:
        actor_id: { type: string }
        if_updated_at:
          type: string
          format: date-time

    BoardOnlyResponse:
      type: object
      properties:
        board: { $ref: '#/components/schemas/Board' }
      required: [board]

    PurgeBoardRequest:
      type: object
      properties:
        actor_id: { type: string }

    PurgeBoardResponse:
      type: object
      properties:
        purged: { type: boolean }
        board_ref: { $ref: '#/components/schemas/ResourceRef' }
        board_handle: { $ref: '#/components/schemas/ResourceHandle' }
        board_id:
          allOf:
            - $ref: '#/components/schemas/InternalResourceUUID'
          description: Internal board UUID/debug id retained for admin/verbose compatibility.
      required: [purged, board_ref, board_handle]

    DocumentLifecycleMutationRequest:
      description: Optional request_key recovers the original actor-bound HTTP receipt atomically. Keyed requests require if_updated_at; actual lifecycle changes advance updated_at and updated_by.
      type: object
      properties:
        actor_id: { type: string }
        request_key: { type: string, maxLength: 256 }
        if_updated_at:
          type: string
          format: date-time

    DocumentTrashRequest:
      description: Optional request_key recovers the original actor-bound HTTP receipt atomically. Keyed requests require if_updated_at; actual lifecycle changes advance updated_at and updated_by.
      type: object
      required: [reason]
      properties:
        actor_id: { type: string }
        request_key: { type: string, maxLength: 256 }
        reason: { type: string }
        if_updated_at:
          type: string
          format: date-time

    DocumentRestoreFromTrashRequest:
      description: Optional request_key recovers the original actor-bound HTTP receipt atomically. Keyed requests require if_updated_at; actual lifecycle changes advance updated_at and updated_by.
      type: object
      properties:
        actor_id: { type: string }
        request_key: { type: string, maxLength: 256 }
        reason: { type: string }
        if_updated_at:
          type: string
          format: date-time

    PurgeDocumentRequest:
      type: object
      properties:
        actor_id: { type: string }

    PurgeDocumentResponse:
      type: object
      properties:
        purged: { type: boolean }
        document_ref: { $ref: '#/components/schemas/ResourceRef' }
        document_handle: { $ref: '#/components/schemas/ResourceHandle' }
        document_id:
          allOf:
            - $ref: '#/components/schemas/InternalResourceUUID'
          description: Internal document UUID/debug id retained for admin/verbose compatibility.
      required: [purged, document_ref, document_handle]

    PurgeArtifactResponse:
      type: object
      properties:
        purged: { type: boolean }
        artifact_ref: { $ref: '#/components/schemas/ResourceRef' }
        artifact_handle: { $ref: '#/components/schemas/ResourceHandle' }
        artifact_id:
          allOf:
            - $ref: '#/components/schemas/InternalResourceUUID'
          description: Internal artifact UUID/debug id retained for admin/verbose compatibility.
      required: [purged, artifact_ref, artifact_handle]

    RefEdge:
      type: object
      properties:
        source_ref: { type: string, description: "Typed ref for the edge source (e.g. board:abc123)" }
        target_ref: { type: string, description: "Typed ref for the edge target (e.g. card:def456)" }
        relation: { type: string, description: "Edge relation type" }
        discovered_at: { type: string, format: date-time, description: "When this edge was first recorded" }
        metadata:
          type: object
          additionalProperties: true
      required: [source_ref, target_ref, relation, discovered_at]

    RefEdgesResponse:
      type: object
      properties:
        ref_edges:
          type: array
          items: { $ref: '#/components/schemas/RefEdge' }
      required: [ref_edges]

    MarkdownHygieneWarning:
      type: object
      properties:
        field:
          type: string
          description: Request field path whose markdown was normalized.
        code:
          type: string
          description: Stable warning code for the conservative normalization rule.
        message:
          type: string
          description: Human-readable summary of the normalization.
      required: [field, code, message]

    MarkdownHygiene:
      type: object
      description: >
        Present only on mutation responses when core conservatively normalized documented
        prose/markdown fields before storage. Core does not recursively rewrite arbitrary
        JSON strings.
      properties:
        warnings:
          type: array
          items: { $ref: '#/components/schemas/MarkdownHygieneWarning' }
        changed_fields:
          type: array
          items: { type: string }
      required: [warnings]

    TopicResponse:
      type: object
      properties:
        topic: { $ref: '#/components/schemas/Topic' }
        markdown_hygiene: { $ref: '#/components/schemas/MarkdownHygiene' }
      required: [topic]

    TopicsResponse:
      type: object
      properties:
        topics:
          type: array
          items: { $ref: '#/components/schemas/Topic' }
        next_cursor:
          type: string
          description: Present when further pages exist after a bounded `limit` query.
      required: [topics]

    TopicTimelineResponse:
      type: object
      properties:
        cards_truncated: {type: boolean, description: Present only with summary=1; computed card preview was capped at 50.}
        topic: { $ref: '#/components/schemas/Topic' }
        events:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        artifacts:
          type: array
          items: { $ref: '#/components/schemas/Artifact' }
        cards:
          type: array
          items: { $ref: '#/components/schemas/Card' }
        documents:
          type: array
          items: { $ref: '#/components/schemas/Document' }
        threads:
          type: array
          items: { $ref: '#/components/schemas/Thread' }
        notification_receipts:
          type: object
          description: Agent wake notification receipts keyed by triggering event id.
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/AgentNotificationReceipt' }
      required: [topic, events, artifacts, cards, documents, threads]

    CardTimelineResponse:
      type: object
      properties:
        cards_truncated: {type: boolean, description: Present only with summary=1; computed card preview was capped at 50.}
        card: { $ref: '#/components/schemas/Card' }
        events:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        artifacts:
          type: array
          items: { $ref: '#/components/schemas/Artifact' }
        cards:
          type: array
          items: { $ref: '#/components/schemas/Card' }
        documents:
          type: array
          items: { $ref: '#/components/schemas/Document' }
        threads:
          type: array
          items: { $ref: '#/components/schemas/Thread' }
      required: [card, events, artifacts, cards, documents, threads]

    TopicWorkspaceResponse:
      type: object
      properties:
        cards_truncated: {type: boolean, description: Workspace card preview is bounded to 50 cards.}
        resources_truncated: {type: boolean, description: Some resource collections are candidate limited; use collection/detail routes to read more.}
        topic: { $ref: '#/components/schemas/Topic' }
        cards:
          type: array
          items: { $ref: '#/components/schemas/Card' }
        boards:
          type: array
          items: { $ref: '#/components/schemas/Board' }
        documents:
          type: array
          items: { $ref: '#/components/schemas/Document' }
        threads:
          type: array
          items: { $ref: '#/components/schemas/Thread' }
        inbox:
          type: array
          items: { $ref: '#/components/schemas/InboxItem' }
        projection_freshness: { $ref: '#/components/schemas/ProjectionFreshness' }
        generated_at: { type: string, format: date-time }
      required: [topic, cards, boards, documents, threads, inbox, projection_freshness, generated_at]

    ThreadResponse:
      type: object
      properties:
        thread: { $ref: '#/components/schemas/Thread' }
      required: [thread]

    ThreadsResponse:
      type: object
      properties:
        threads:
          type: array
          items: { $ref: '#/components/schemas/Thread' }
      required: [threads]

    ThreadTimelineResponse:
      type: object
      properties:
        thread: { $ref: '#/components/schemas/Thread' }
        events:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        artifacts:
          type: array
          items: { $ref: '#/components/schemas/Artifact' }
        topics:
          type: array
          items: { $ref: '#/components/schemas/Topic' }
        cards:
          type: array
          items: { $ref: '#/components/schemas/Card' }
        documents:
          type: array
          items: { $ref: '#/components/schemas/Document' }
        notification_receipts:
          type: object
          description: Agent wake notification receipts keyed by triggering event id.
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/AgentNotificationReceipt' }
      required: [thread, events, artifacts, topics, cards, documents]

    AgentNotificationReceipt:
      type: object
      description: Sender/operator-visible projection of an agent wake notification.
      properties:
        notification_id: { type: string }
        wakeup_id: { type: string }
        status:
          type: string
          description: Notification read state for compatibility with agent notification rows.
          enum: [unread, read, dismissed]
        notification_status:
          type: string
          description: Notification read state.
          enum: [unread, read, dismissed]
        delivery_status:
          type: string
          description: Bridge delivery state for the wake.
          enum: [requested, claimed, completed, failed]
        target_handle: { type: string }
        target_actor_id: { type: string }
        thread_id: { type: string }
        trigger_event_id: { type: string }
        related_refs:
          type: array
          description: Ask and answer event refs included in a debounced answer wake batch.
          items: { $ref: '#/components/schemas/TypedRef' }
        created_at: { type: string, format: date-time }
        claimed_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        failed_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time }
        dismissed_at: { type: string, format: date-time }
        failure_reason: { type: string }
      required: [notification_id, wakeup_id, status, notification_status, delivery_status, target_handle, target_actor_id, thread_id, trigger_event_id, created_at]

    ThreadWorkspaceResponse:
      type: object
      properties:
        thread: { $ref: '#/components/schemas/Thread' }
        related_topics:
          type: array
          items: { $ref: '#/components/schemas/Topic' }
        cards:
          type: array
          items: { $ref: '#/components/schemas/Card' }
        documents:
          type: array
          items: { $ref: '#/components/schemas/Document' }
        board_memberships:
          type: array
          items: { $ref: '#/components/schemas/BoardMembership' }
        inbox:
          type: array
          items: { $ref: '#/components/schemas/InboxItem' }
        projection_freshness: { $ref: '#/components/schemas/ProjectionFreshness' }
      required: [thread, related_topics, cards, documents, board_memberships, inbox, projection_freshness]

    DocumentsResponse:
      type: object
      properties:
        documents:
          type: array
          items: { $ref: '#/components/schemas/Document' }
        next_cursor: { type: string }
        search_coverage:
          type: object
          description: Search-only coverage metadata, present even for empty pages.
          properties:
            mode: { type: string, enum: [independent, aggregate] }
            bytes_per_resource: { type: integer }
            terms_per_resource: { type: integer }
          required: [mode]
      required: [documents]

    DocumentComment:
      type: object
      properties:
        ref: { $ref: '#/components/schemas/ResourceRef' }
        handle: { $ref: '#/components/schemas/ResourceHandle' }
        id:
          allOf:
            - $ref: '#/components/schemas/InternalResourceUUID'
          description: Stable comment id (backing event id). The public deep-link is `ref`.
        document_ref: { $ref: '#/components/schemas/TypedRef' }
        parent_id:
          type: string
          description: Parent comment id when this row is a reply.
        reply_to:
          type: string
          description: Parent comment public ref (`event:<handle>`) when this row is a reply.
        body: { type: string }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        edited_at:
          type: string
          format: date-time
          description: Set when the author edited the comment body.
        edited_by:
