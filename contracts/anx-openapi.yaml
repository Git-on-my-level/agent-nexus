      - conversation
      - turns
    PMConversationListResponse:
      type: object
      additionalProperties: true
      properties:
        next_cursor: {type: string}
        items:
          type: array
          items:
            $ref: '#/components/schemas/PMConversation'
        has_more:
          type: boolean
