        event: { $ref: '#/components/schemas/Event' }
        markdown_hygiene: { $ref: '#/components/schemas/MarkdownHygiene' }
      required: [event]

    EventsResponse:
      type: object
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        page_info: { $ref: '#/components/schemas/EventPageInfo' }
      required: [events]

    EventPageInfo:
      type: object
      properties:
        next_cursor: { type: string }
        has_more: { type: boolean }
      required: [has_more]

    OverviewResponse:
      type: object
      required: [generated_at, work, initiatives, needs_you, dashboard, agents]
      additionalProperties: true
      properties:
        generated_at: { type: string, format: date-time }
        since_you_last_looked: { $ref: '#/components/schemas/OverviewChanges' }
        brief: { $ref: '#/components/schemas/OverviewBrief' }
        work:
          type: object
          required: [status, total, human_count, items]
          properties:
            status: { type: string }
            total: { type: integer }
            human_count: { type: integer }
            items: { type: array, items: { $ref: '#/components/schemas/Work' } }
            truncated: { type: boolean }
          description: Visible active work from at most 100 open and 100 closed visit candidates, prioritizing open work; counts describe the bounded visible set. With work_view=summary, optional full-detail fields are omitted from items. Use /work to page through further initiatives and /work/{card_ref} for full details.
        initiatives:
          type: object
          required: [status, count, items]
          properties:
            status: { type: string }
            hint: { type: string, description: Suggests setting a board role when no initiatives board exists. }
            count: { type: integer }
            items: { type: array, items: { $ref: '#/components/schemas/OverviewInitiative' } }
            truncated: { type: boolean }
        needs_you:
          type: object
          required: [status, count, rows, href]
          properties:
            status: { type: string, enum: [ok, unavailable] }
            count: { type: integer }
            href: { type: string }
            message: { type: string }
            truncated: { type: boolean }
            rows: { type: array, items: { $ref: '#/components/schemas/OverviewAttentionRow' } }
          description: Open asks, blocked work, human next actors and at most 100 actionable PM decision candidates, respecting the reader's existing permissions. truncated flags additional candidates; use the inbox and PM lists for further items.
        dashboard: { $ref: '#/components/schemas/OverviewDashboard' }
        agents:
          type: object
          required: [status]
          additionalProperties: true
          properties:
            status: { type: string, enum: [ok, unavailable] }
            message: { type: string }
            items: { type: array, items: { type: object, additionalProperties: true } }
    Brief:
      type: object
      required: [schema, generated_at, principal, decisions, initiatives, your_asks, answered_for_you, truncated]
      description: brief.v1. See anx-schema.yaml `brief` and `promises` for ordering and derivation rules.
      properties:
        schema: { type: string, enum: [brief.v1] }
        generated_at: { type: string, format: date-time }
        principal: { $ref: '#/components/schemas/BriefPrincipal' }
        decisions: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/BriefDecision' } }
        initiatives: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/BriefInitiative' } }
        your_asks: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/BriefDecision' } }
        answered_for_you: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/BriefAnswered' } }
        truncated:
          type: object
          required: [decisions, initiatives, your_asks, answered_for_you]
          properties:
            decisions: { type: boolean }
            initiatives: { type: boolean }
            your_asks: { type: boolean }
            answered_for_you: { type: boolean }
    BriefPrincipal:
      type: object
      required: [id, display]
      properties:
        id: { type: string }
        display: { type: string }
        kind: { type: string, enum: [human, agent, service] }
    BriefRefTitle:
      type: object
      required: [ref]
      properties:
        ref: { type: string }
        title: { type: string }
    BriefDecision:
      type: object
      required: [ref, inbox_item_id, kind, title, requested_by, created_at, age_seconds, decide_by, overdue_for_seconds, blocks, blocks_count, proposals]
      properties:
        ref: { type: string, description: "Same value as inbox_item_id." }
        inbox_item_id:
          type: string
          description: >
            Inbox id to answer. When batch is present this one id answers every open member:
            a filed batch uses the derived batch inbox id (inbox:{kind}:{thread}:{batch_id}:{anchor_event_id}),
            and an accepted curation batch uses inbox:curation-batch:{key}.
            POST /inbox/{inbox_item_id}/respond with response_text, outcome and notify_mode
            records that answer on every still-open member in one transaction.
        event_ref:
          type: string
          description: "Authoritative ask event reference (event:<id>) when backed by a canonical ask event."
        kind: { type: string, enum: [ask, review, access, host, pm_proposal] }
        title: { type: string }
        body: { type: string }
        requested_by: { $ref: '#/components/schemas/BriefPrincipal' }
        subject: { $ref: '#/components/schemas/BriefRefTitle' }
        created_at: { type: string, format: date-time }
        age_seconds: { type: integer }
        decide_by: { type: string, format: date-time, nullable: true }
        overdue_for_seconds: { type: integer, nullable: true, description: "now - decide_by when positive, 0 before decide_by, null without decide_by." }
        blocks: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/BriefRefTitle' }, description: Open blocked refs the reader can see. Terminal refs clear automatically. }
        blocks_count: { type: integer }
        priority: { type: string }
        proposals: { type: array, maxItems: 6, items: { type: string }, description: First is the recommended response. }
        pm_decision:
          type: object
          description: Present on a PM decision record awaiting this human; answer it through the PM decision answer route with this revision.
          required: [id, revision]
          properties:
            id: { type: string }
            revision: { type: integer }
        curation: { type: object, additionalProperties: true, description: "Present on a curation proposal ask (kind pm_proposal): {action, targets, source}. proposals[0] accepts. Omitted entirely, with the decision, when the reader cannot read every target." }
        batch:
          type: object
          description: "Present when these asks were filed together through POST /asks/batch (key filed:<batch_id>) or a human accepted a curation batch proposal over them. The decision's inbox_item_id answers every open member in one request (flat response_text, outcome and notify_mode). Members the reader cannot see are not listed or counted, and a hidden open member makes the batch unanswerable."
          required: [key, count, members]
          properties:
            key: { type: string }
            count: { type: integer, description: Open members listed here, including this decision. }
            members:
              type: array
              maxItems: 10
              items:
                type: object
                required: [ref, inbox_item_id, title]
                properties:
                  ref: { type: string }
                  inbox_item_id: { type: string }
                  event_ref: { type: string, description: "Authoritative ask event reference (event:<id>) for this member." }
                  title: { type: string }
                  subject_ref: { type: string, description: "Subject of this member ask, when it has one." }
                  blocks:
                    type: array
                    maxItems: 20
                    items: { $ref: '#/components/schemas/BriefRefTitle' }
                    description: Open blocked refs on this member that the reader can see.
    BriefPromise:
      type: object
      required: [at, what, source]
      properties:
        at: { type: string, format: date-time }
        what: { type: string, maxLength: 160 }
        source: { type: string, enum: [note, plan_step, due_at, wake_condition] }
        source_ref: { type: string }
        author: { $ref: '#/components/schemas/BriefPrincipal' }
    BriefNote:
      type: object
      required: [text, author, at]
      properties:
        text: { type: string }
        author: { $ref: '#/components/schemas/BriefPrincipal' }
        at: { type: string, format: date-time }
    BriefInitiative:
      type: object
      required: [ref, title, owner, state, placement, promise, past_promise_for_seconds, promise_moves, last_evidence_at, progress, blocked_count, waiting_on_you_count, note, possibly_moot, loop]
      properties:
        ref: { type: string, description: "card:<handle-or-id>" }
        title: { type: string }
        owner: { type: string, nullable: true, description: First canonical assignee ref, as in work list; null when unassigned. }
        state: { type: string, enum: [past_promise, moving, no_promise, done] }
        placement: { type: string, enum: [backlog, ready, in_progress, review, done] }
        promise: { nullable: true, allOf: [{ $ref: '#/components/schemas/BriefPromise' }] }
        past_promise_for_seconds: { type: integer, nullable: true }
        promise_moves: { type: integer }
        last_evidence_at: { type: string, format: date-time, nullable: true }
        progress:
          type: object
          nullable: true
          required: [done, total]
          properties:
            done: { type: integer }
            total: { type: integer }
        blocked_count: { type: integer, description: Open asks and blocks refs holding this initiative. }
        waiting_on_you_count: { type: integer, description: Open decisions addressed to the reader about this initiative. }
        note: { nullable: true, allOf: [{ $ref: '#/components/schemas/BriefNote' }] }
        series:
          type: array
          maxItems: 2
          description: >
            First two valid, distinct series refs in canonical card refs order,
            considering at most 200 authored refs within the first 64 KiB of refs JSON,
            filtered through the same scoped series relations as series reads.
            Hidden or unmatched explicit label selectors are omitted. Ambiguous
            selectors retain authored labels with null last_value/last_at.
            Latest observations are bounded to the last 7 days.
          items: { $ref: '#/components/schemas/BriefSeries' }
        loop: { nullable: true, allOf: [{ $ref: '#/components/schemas/BriefLoop' }] }
        metric_flat:
          nullable: true
          description: Null when no visible series is returned.
          allOf: [{ $ref: '#/components/schemas/BriefMetricFlat' }]
        possibly_moot:
          type: object
          required: [flagged]
          properties:
            flagged: { type: boolean }
            reason: { type: string, description: "Linked-source evidence sentence, or next_ask_decided when the latest note cites a decided ask." }
            code: { type: string, description: "next_ask_decided when that rule flags the initiative." }
            ask_ref: { type: string, description: "event ref of the decided ask. Absent when the reader cannot see it; an invisible ask does not flag." }
            decided_at: { type: string, format: date-time }
        yours:
          type: boolean
          description: "Present for agent readers when the calling agent is assigned to this initiative, participates in it, or authored its counted promise."
    BriefLoop:
      type: object
      required: [health, health_reason, every_seconds, progress_budget_seconds, stop_rule, last_run_at, last_effect_at, next_run_due_at, recent_runs, runs_7d, effects_7d, goal]
      properties:
        health: {type: string, enum: [healthy, stalled, failing, overdue, unknown]}
        health_reason: {type: string}
        every_seconds: {type: integer, nullable: true}
        progress_budget_seconds: {type: integer, nullable: true}
        stop_rule: {type: string, nullable: true}
        last_run_at: {type: string, format: date-time, nullable: true}
        last_effect_at: {type: string, format: date-time, nullable: true}
        next_run_due_at: {type: string, format: date-time, nullable: true}
        recent_runs:
          type: array
          maxItems: 12
          items:
            type: object
            required: [at, outcome, decision]
            properties:
              at: {type: string, format: date-time}
              outcome: {type: string, enum: [acted, measured, no_op, infra_error]}
              decision: {type: string, nullable: true, enum: [kept, reverted, rejected]}
        runs_7d: {$ref: '#/components/schemas/LoopRunCounts'}
        effects_7d: {type: integer, minimum: 0, description: Runs in the last seven days with outcome acted or experiment decision kept; each run counts once.}
        goal:
          nullable: true
          allOf: [{$ref: '#/components/schemas/LoopGoal'}]
    LoopRunCounts:
      type: object
      required: [acted, measured, no_op, infra_error]
      properties:
        acted: {type: integer}
        measured: {type: integer}
        no_op: {type: integer}
        infra_error: {type: integer}
    LoopGoal:
      type: object
      required: [metric, direction, target, unit, latest, best, baseline, points]
      properties:
        metric: {type: string}
        direction: {type: string, enum: [up, down]}
        target: {type: number, nullable: true}
        unit: {type: string, nullable: true}
        latest: {type: number, nullable: true}
        best: {type: number, nullable: true}
        baseline: {type: number, nullable: true}
        points:
          type: array
          maxItems: 60
          items:
            type: object
            required: [at, value, decision]
            properties:
              at: {type: string, format: date-time}
              value: {type: number}
              decision: {type: string, nullable: true, enum: [kept, reverted, rejected]}
    BriefSeries:
      type: object
      required: [ref, name, labels, last_value, last_at]
      properties:
        ref: { type: string }
        name: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        last_value:
          oneOf: [{ type: number, nullable: true }, { type: string }]
        last_at: { type: string, format: date-time, nullable: true }
    BriefMetricFlat:
      type: object
      required: [flat, for_seconds, window_seconds]
      description: >
        Primary (first returned) series only. Numeric daily extrema must stay within
        max(1e-9, abs(latest value)*1e-6) of the latest value for at least 3 days.
        Uses at most 8 UTC daily buckets intersecting a 7-day lookback, including
        whole boundary buckets conservatively. for_seconds is the observed span
        from the oldest consecutive qualifying bucket's last observation to the
        latest observation, capped at 7 days. Missing days break the span.
        Missing, ambiguous, nonnumeric or older-than-24h latest data yields false/0.
        Ref _range and _baseline options do not alter this fixed computation.
      properties:
        flat: { type: boolean }
        for_seconds: { type: integer, minimum: 0 }
        window_seconds: { type: integer, enum: [604800] }
    BriefAnswered:
      type: object
      required: [ref, inbox_item_id, title, answer, answered_at, answered_by, followed_recommendation]
      properties:
        ref: { type: string }
        inbox_item_id: { type: string }
        title: { type: string }
        answer: { type: string }
        outcome: { type: string }
        answered_at: { type: string, format: date-time }
        answered_by: { $ref: '#/components/schemas/BriefPrincipal' }
        followed_recommendation: { type: boolean }
    OverviewBrief:
      type: object
      required: [status, generated_at, decisions, since_last_look, at_risk, machine, initiatives]
      additionalProperties: true
      description: >
        Morning brief: five ranked, computed answers for the top of Overview — what needs a decision, what changed since the
        caller's previous visit, what is off track and why, whether agents are working, and where each initiative actually is.
        Derived entirely from the rows this request already loaded and already filtered (the bounded visit work snapshot, the
        assembled needs_you rows, since_you_last_looked and the agent roster), so it issues no additional query and adds no
        O(workspace) pass. Nothing is hand-maintained. Counts describe only what the caller is authorized to see: where access
        is denied the number is smaller, and no field reveals that something was withheld. Sections carry at most section_limit
        rows plus a `more` remainder.
      properties:
        status: { type: string, enum: [ok] }
        generated_at: { type: string, format: date-time }
        section_limit: { type: integer, description: Rows a section shows before the more remainder. }
        throughput_hours: { type: integer, description: Window for machine.finished_24h. }
        decisions: { $ref: '#/components/schemas/OverviewBriefDecisions' }
        since_last_look: { $ref: '#/components/schemas/OverviewBriefChanges' }
        at_risk: { $ref: '#/components/schemas/OverviewBriefRisk' }
        machine: { $ref: '#/components/schemas/OverviewBriefMachine' }
        initiatives: { $ref: '#/components/schemas/OverviewBriefInitiatives' }

    OverviewBriefDecisions:
      type: object
      required: [status, count, items, more, href]
      description: >
        The needs_you rows, ranked. Score precedence is blocking open work (1000 per visible dependent), then an overdue (600)
        or within-48h (300) due date, then priority (critical/p0 320, high/p1 200, medium/p2 80, low/p3 20), then a blocked
        phase (150), then age at a third of a point per hour capped at 30 days (240). Age is deliberately sub-critical: it
        lifts work everyone has walked past without letting a stale question outrank a p0 raised this morning. Ties break
        oldest first, then by id, so the order is stable across reads. `reason` is the computed explanation for the rank, at most
        three clauses. blocks counts only dependents this caller can see, so it is a lower bound and never implies a hidden row.
      properties:
        status: { type: string, enum: [ok, unavailable] }
        message: { type: string }
        count: { type: integer, description: Ranked candidates, not just the rows returned. }
        more: { type: integer }
        truncated: { type: boolean }
        href: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/OverviewBriefDecision' } }

    OverviewBriefDecision:
      type: object
      required: [id, title, href, reason, signals]
      properties:
        id: { type: string, description: Matching needs_you row id. }
        title: { type: string }
        source: { type: string }
        href: { type: string }
        reason: { type: string, description: Computed rank explanation, e.g. "blocks 2 cards · 3d without a change". }
        signals:
          type: object
          additionalProperties: true
          properties:
            kind: { type: string, enum: [task, ask, decision] }
            blocks: { type: integer, description: Visible open rows declaring depends_on this one; a lower bound. }
            priority: { type: string }
            phase: { type: string }
            due_at: { type: string, format: date-time }
            age_hours: { type: integer }
            since: { type: string, format: date-time }

    OverviewBriefChanges:
      type: object
      required: [since, groups, total]
      description: >
        Grouped digest of what changed since the caller's previous Overview visit, computed over the same bounded visible rows.
        Groups are ordered finished, newly blocked, new asks, new decisions, asks answered, plan steps done, initiatives off
        track, cancelled, updated; empty groups are omitted. first_visit is true when there is no previous visit to compare with,
        which is not the same as nothing having changed. newly_blocked counts transitions, not current state: a card already
        blocked at the previous visit, or one whose previous phase is unknown, is reported under updated, so editing a blocked
        card is never reported as a new blocker.
      properties:
        since: { type: string, format: date-time, nullable: true }
        first_visit: { type: boolean }
        total: { type: integer }
        truncated: { type: boolean }
        groups: { type: array, items: { $ref: '#/components/schemas/OverviewBriefChangeGroup' } }

    OverviewBriefChangeGroup:
      type: object
      required: [key, label, count, items, more]
      properties:
        key: { type: string, enum: [completed, newly_blocked, new_asks, decisions, answered, steps, initiatives, cancelled, updated] }
        label: { type: string }
        count: { type: integer }
        more: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [ref, title, href]
            properties:
              ref: { type: string }
              title: { type: string }
              href: { type: string }
              at: { type: string, format: date-time }
              step_id: { type: string, description: Plan step this row reports, for a completed-step row. Two steps of one initiative share its ref, so ref plus step_id is the row identity. }

    OverviewBriefRisk:
      type: object
      required: [status, count, items, more]
      description: >
        Initiatives and work past their promise, longest past first. Every row carries the computed promise reason. A row with
        no computed reason is omitted rather than guessed at.
      properties:
        status: { type: string, enum: [ok] }
        count: { type: integer }
        more: { type: integer }
        truncated: { type: boolean }
        items:
          type: array
          items:
            type: object
            required: [ref, title, href, state, reason]
            properties:
              ref: { type: string }
              title: { type: string }
              href: { type: string }
              state: { type: string, enum: [past_promise] }
              reason: { type: string }
              since: { type: string, format: date-time }
              progress:
                type: object
                properties:
                  done: { type: integer }
                  total: { type: integer }

    OverviewBriefMachine:
      type: object
      required: [status, finished_24h, agents_finished_24h, href]
      description: >
        Is the machine running. working and waiting reuse the roster's derived states; stuck is the three-way silence split —
        an agent with no recent signal counts as stuck only while it holds an open run or a card, never merely for being
        offline or never enrolled. finished_24h counts visible cards that reached done or cancelled inside throughput_hours and
        agents_finished_24h the distinct owners among them, so throughput survives a roster read failure; working, waiting and
        stuck are then null and roster_status is unavailable.
      properties:
        status: { type: string, enum: [ok] }
        roster_status: { type: string, enum: [ok, unavailable] }
        message: { type: string }
        working: { type: integer, nullable: true }
        waiting: { type: integer, nullable: true }
        stuck: { type: integer, nullable: true }
        finished_24h: { type: integer }
        agents_finished_24h: { type: integer }
        truncated: { type: boolean }
        roster_truncated: { type: boolean }
        href: { type: string }
        stuck_items:
          type: array
          items:
            type: object
            required: [ref, title, href, reason]
            properties:
              ref: { type: string }
              title: { type: string }
              href: { type: string }
              reason: { type: string }
              last_signal_at: { type: string, format: date-time }

    OverviewBriefInitiatives:
      type: object
      required: [status, count, items, more, by_state, href]
      description: >
        Every initiative's promise state, in the shared order (past_promise, no_promise, moving, done). by_state counts all
        of them by state, so an initiative with no promise is visible as a gap rather than reported as moving.
      properties:
        status: { type: string, enum: [ok] }
        count: { type: integer }
        more: { type: integer }
        truncated: { type: boolean }
        href: { type: string }
        by_state: { type: object, additionalProperties: { type: integer } }
        items:
          type: array
          items:
            type: object
            required: [ref, title, href, state, reason]
            properties:
              ref: { type: string }
              title: { type: string }
              href: { type: string }
              state: { type: string, enum: [past_promise, moving, no_promise, done] }
              reason: { type: string }
              phase: { type: string }
              next_step: { type: string }
              progress:
                type: object
                properties:
                  done: { type: integer }
                  total: { type: integer }

    OverviewDashboard:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        has_more: { type: boolean, description: Unread candidate documents may contain more reports. }
        next_cursor: { type: string, description: Cursor for the next report candidate page. }
        pinned_ref: { type: string, nullable: true }
        warning: { type: string }
        message: { type: string }
        reports: { type: array, items: { $ref: '#/components/schemas/OverviewReport' } }
      description: Fully validated active report, pinned first or newest valid fallback from at most 100 recent document candidates. has_more flags unread candidates. Overview loads only the selected report; selector candidates load separately.

    OverviewInitiative:
      type: object
      required: [ref, title, summary, progress, priority, needs, phase, board_ref, updated_at, plan_state, plan_step_digest, plan_health, geometry]
      properties:
        plan_state: {type: object, nullable: true, allOf: [{ $ref: '#/components/schemas/PlanState' }]}
        plan_resolution_truncated: {type: boolean, description: True when the shared 4000 distinct plan-ref budget was exceeded; omitted refs remain unknown.}
        plan_health: { $ref: '#/components/schemas/PlanHealth' }
        next_step: { $ref: '#/components/schemas/NextPlanStep' }
        plan_step_digest: { $ref: '#/components/schemas/PlanStepDigest' }
        status_mismatch: {type: boolean}
        possibly_moot: { $ref: '#/components/schemas/PossiblyMoot' }
        geometry: {type: object, nullable: true, allOf: [{ $ref: '#/components/schemas/InitiativeGeometry' }]}
        ref: { type: string }
        title: { type: string }
        work_summary: {$ref: '#/components/schemas/WorkSummary'}
        summary:
          description: Legacy prose by default; WorkSummary when summary=1 is requested.
          oneOf: [{type: string}, {$ref: '#/components/schemas/WorkSummary'}]
        summary_text: {type: string, description: First prose line outside fenced examples.}
        priority: { type: string }
        needs: { type: array, items: { type: string }, description: Human asks parsed outside fenced examples, preserving every matching line. }
        phase: { type: string }
        board_ref: { type: string }
        updated_at: { type: string, format: date-time }
        progress:
          type: object
          required: [done, total]
          properties:
            done: { type: integer }
            total: { type: integer }
    InitiativeGeometry:
      type: object
      required: [shape, nodes, total_nodes, collapsed_nodes]
      properties:
        shape: {type: string, enum: [chain, dag, lanes]}
        total_nodes: {type: integer}
        collapsed_nodes: {type: integer}
        nodes:
          type: array
          maxItems: 24
          items:
            type: object
            required: [id, status, layer, after]
            properties:
              id: {type: string}
              status: {type: string, enum: [done, active, blocked, not_started]}
              layer: {type: integer}
              after: {type: array, items: {type: string}}
    OverviewChanges:
      type: object
      description: At most 200 accessible answer-event candidates and 4000 distinct subject refs, resolved in batches of at most 200. Access is applied before budgets. Truncated is true when any event, subject-ref or output budget is exceeded; answers with omitted subjects are excluded.
      required: [since, generated_at, items, truncated]
      properties:
        since: {type: string, format: date-time, nullable: true}
        generated_at: {type: string, format: date-time}
        truncated: {type: boolean}
        items:
          type: array
          maxItems: 100
          items:
            type: object
            required: [kind, ref, title]
            properties:
              kind: {type: string, enum: [step_completed, initiative_past_promise, ask_answered, decision_created]}
              ref: {type: string}
              title: {type: string}
              step_id: {type: string}
              ts: {type: string, format: date-time}
    OverviewAttentionRow:
      type: object
      required: [id, title, source, href]
      additionalProperties: true
      properties:
        waiting_since: {type: string, format: date-time, description: Oldest visible waiting anchor; rows sort oldest first with undated rows last.}
        id: { type: string }
        title: { type: string }
        source: { type: string }
        href: { type: string }
    OverviewReport:
      type: object
      required: [id, ref, segment, title, updated_at, revision_ref, report]
      properties:
        id: { type: string }
        ref: { type: string }
        segment: { type: string }
        title: { type: string }
        updated_at: { type: string, format: date-time }
        revision_ref: { type: string, description: Selected head revision identity used to reject live data from a different report definition. }
        report: { type: object, additionalProperties: true, description: anx.visual-report v1 body; validated by the shared Go validator with renderer conformance tests. }

    HomeUnreadResponse:
      type: object
      properties:
        groups:
          type: array
          items: { $ref: '#/components/schemas/HomeUnreadGroup' }
        unread_count: { type: integer, minimum: 0, description: "Unread events represented by this page, not a workspace total." }
        group_count: { type: integer, minimum: 0, description: "Groups represented by this page; a group may recur on later pages." }
        next_cursor: { type: string }
        has_more: { type: boolean }
        generated_at: { type: string, format: date-time }
      required: [groups, unread_count, group_count, generated_at]

    HomeUnreadGroup:
      type: object
      properties:
        group_ref: { type: string, description: "Typed ref identifying the group, e.g. topic:<handle> or board:<handle>." }
        group_type: { type: string, description: "Group type: topic, board, document, or workspace." }
        display_name: { type: string }
        priority: { type: string, description: "Priority label for sorting (P0/P1/P2 or empty)." }
        unread_count: { type: integer, minimum: 0 }
        newest_event: { $ref: '#/components/schemas/Event' }
        events:
          type: array
          items: { $ref: '#/components/schemas/Event' }
      required: [group_ref, group_type, display_name, unread_count, newest_event, events]

    MarkHomeReadRequest:
      type: object
      properties:
        request_key:
          type: string
          maxLength: 256
          description: Keyed requests require a frozen cursor for every group; the original receipt commits atomically.
        reader_id:
          type: string
          description: Development legacy actor-mode reader id. Authenticated deployments derive the reader from the bearer token principal.
        actor_id:
          type: string
          description: Development legacy actor-mode alias for reader_id.
        group_ref: { type: string, description: "Single group typed ref, e.g. topic:<handle> or board:<handle>." }
        group_refs:
          type: array
          items: { type: string }
          description: Batch of group typed refs to mark read.
        expected_newest_event_cursor:
          type: object
          properties:
            ts: { type: string, format: date-time }
            id: { type: string }
          required: [ts, id]
        group_cursors:
          type: object
          description: Optional race-safe per-group newest event cursors for batch mark-read.
          additionalProperties:
            type: object
            properties:
              ts: { type: string, format: date-time }
              id: { type: string }
            required: [ts, id]
      anyOf:
        - required: [group_ref]
        - required: [group_refs]

    MarkHomeReadResponse:
      type: object
      properties:
        ok: { type: boolean }
        unread_count: { type: integer, minimum: 0 }
        group_count: { type: integer, minimum: 0 }
      required: [ok]

    ArtifactResponse:
      type: object
      properties:
        artifact: { $ref: '#/components/schemas/Artifact' }
      required: [artifact]

    CompletedInboxItem:
      type: object
      description: Human attention item closed by human_attention_responded; list/get history row.
      properties:
        id:
          type: string
          description: Stable id formatted as completed:<response_event_id>.
        status:
          type: string
          enum: [completed]
        inbox_item_id: { type: string }
        kind: { type: string }
        thread_id: { type: string }
        subject_ref: { $ref: '#/components/schemas/TypedRef' }
        title: { type: string }
        body: { type: string }
        related_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        response_proposals:
          type: array
          items: { type: string }
        request_event_ref: { $ref: '#/components/schemas/TypedRef' }
        response_event_ref: { $ref: '#/components/schemas/TypedRef' }
        response_text: { type: string }
        outcome: { $ref: '#/components/schemas/HumanAttentionResponseOutcome' }
        response_summary: { type: string }
        responded_at: { type: string }
        responding_actor_id: { type: string }
        requester_actor_id: { type: string }
        requester_agent_id: { type: string }
        requester_label: { type: string }
        original_request_missing: { type: boolean }
      required: [id, status, title, related_refs]

    InboxResponse:
      type: object
      properties:
        status:
          type: string
          enum: [open, completed]
        items:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/InboxItem'
              - $ref: '#/components/schemas/CompletedInboxItem'
        has_more: {type: boolean, description: Open inbox has additional candidate rows.}
        next_cursor:
          type: string
          nullable: true
          description: Present when another page of the selected inbox status exists.
        generated_at:
          type: string
        projection_freshness:
          type: object
          additionalProperties: true
          description: Present for status=open materialized projections when applicable. Thread identities, metadata, counts and aggregate status include only accessible backing threads, inheriting containing card and board access. Workspace status and thread_count remain complete; threads contains at most 100 details, and truncated signals additional threads.
      required: [items]

    RespondInboxItemResponse:
      type: object
      properties:
        event: { $ref: '#/components/schemas/Event' }
        task_outcome: {$ref: '#/components/schemas/AskTaskOutcome'}
        notify:
          type: object
          additionalProperties: true
        markdown_hygiene: { $ref: '#/components/schemas/MarkdownHygiene' }
      required: [event, notify]

    ArtifactsListResponse:
      type: object
      properties:
        artifacts:
          type: array
          items: { $ref: '#/components/schemas/Artifact' }
      required: [artifacts]

    CreateArtifactRequest:
      type: object
      properties:
        actor_id: { type: string }
        artifact:
          type: object
          additionalProperties: true
          description: Artifact fields before persistence (e.g. kind, refs, summary).
        content: {}
        content_type: { type: string }
      required: [artifact, content_type]

    ThreadContextArtifactEntry:
      type: object
      description: Key artifact row; may include ref, artifact, and optional content_preview.
      additionalProperties: true

    ThreadContextResponse:
      type: object
      properties:
        thread: { $ref: '#/components/schemas/Thread' }
        recent_events:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        key_artifacts:
          type: array
          items: { $ref: '#/components/schemas/ThreadContextArtifactEntry' }
        open_cards:
          type: array
          items: { type: object, additionalProperties: true }
        documents:
          type: array
          items: { type: object, additionalProperties: true }
      additionalProperties: true
      required: [thread, recent_events, key_artifacts, open_cards, documents]

    ArchiveCardRequest:
      type: object
      properties:
        if_lifecycle:
          type: object
          required: [archived_at, trashed_at]
          properties:
            archived_at: { type: string, nullable: true }
            trashed_at: { type: string, nullable: true }
          description: Frozen visibility tuple; a concurrent archive/restore conflicts before writing.
        request_key:
          type: string
          maxLength: 256
          description: Original receipt key committed atomically with archive; reuse on retry. Keyed archives require if_version, if_lifecycle and if_latest_observation_id.
        actor_id: { type: string }
        if_board_updated_at:
          type: string
          format: date-time
        if_version:
          type: integer
          minimum: 0
          description: Optional monotonic work-version fence for atomic archive. Every committed archive and restore advances this version, including an archive/restore round trip.
        if_latest_observation_id:
          type: string
          description: Optional atomic fence matching work.latest_observation.id from work get. Keyed archives also allow an empty string to fence the absence of any successful observation; legacy unkeyed requests must use a nonempty ID. A different or absent latest successful observation returns 409 conflict, including observations that leave phase and board timestamp unchanged. Checked in the archive transaction; use with if_board_updated_at and if_version to fence canonical and annotation changes too.

    SecretMetadata:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by: { type: string }
        updated_by: { type: string }
      required: [id, name, created_at, updated_at, created_by, updated_by]

    CreateSecretRequest:
      type: object
      properties:
        name:
          type: string
          description: Unique secret name (e.g. OPENAI_API_KEY).
        value:
          type: string
          description: Secret plaintext value to encrypt.
        description:
          type: string
          description: Optional note about this secret's purpose.
      required: [name, value]

    UpdateSecretRequest:
      type: object
      properties:
        value:
          type: string
          description: New secret plaintext value.
        description:
          type: string
          description: Updated description (omit to keep current).
      required: [value]

    SecretResponse:
      type: object
      properties:
        secret: { $ref: '#/components/schemas/SecretMetadata' }
      required: [secret]

    SecretsResponse:
      type: object
      properties:
        secrets:
          type: array
          items: { $ref: '#/components/schemas/SecretMetadata' }
      required: [secrets]

    DeleteSecretResponse:
      type: object
      properties:
        deleted: { type: boolean }
        secret_id: { type: string }
      required: [deleted, secret_id]

    RevealSecretResponse:
      type: object
      properties:
        name: { type: string }
        value: { type: string }
      required: [name, value]

    RevealSecretsBatchRequest:
      type: object
      properties:
        names:
          type: array
          items: { type: string }
          description: List of secret names to reveal.
      required: [names]

    RevealSecretsBatchResponse:
      type: object
      properties:
        secrets:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              value: { type: string }
            required: [name, value]
      required: [secrets]

    SeriesLabels:
      type: object
      description: At most eight label keys; each label value is limited to 128 UTF-8 bytes.
      maxProperties: 8
      propertyNames: {pattern: "^[a-z][a-z0-9_.-]{0,79}$"}
      additionalProperties: {type: string, maxLength: 128}
    SeriesDefinition:
      type: object
      additionalProperties: false
      required: [name, kind, unit]
      properties:
        name: {type: string, pattern: "^[a-z][a-z0-9_.-]{0,79}$"}
        kind: {type: string, enum: [gauge, counter, state]}
        unit: {type: string, maxLength: 80}
    AdapterDeclaration:
      type: object
      additionalProperties: false
      required: [name, description, agent_id, expected_interval]
      properties:
        name: {type: string, pattern: "^[a-z][a-z0-9_.-]{0,79}$"}
        description: {type: string, minLength: 1, maxLength: 2000}
        agent_id: {type: string, description: Exact active enrolled agent ID or username; host resolved by core.}
        expected_interval: {type: string, description: Duration from 1s to 30d.}
        series:
          type: array
          minItems: 0
          maxItems: 100
          description: May be empty when delivers is non-empty.
          items: {$ref: '#/components/schemas/SeriesDefinition'}
        delivers:
          type: array
          maxItems: 8
          uniqueItems: true
          description: Notification channels this adapter delivers. "bridge" is reserved.
          items: {type: string, pattern: "^[a-z][a-z0-9_-]{0,31}$", not: {const: bridge}}
        kinds:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          description: Delivery kinds the delivered channels accept. Defaults to push and digest. Host adapters always use settings addressing; only a trusted grant may declare a principal-addressed channel.
          items: {type: string, enum: [push, digest]}
        label: {type: string, maxLength: 80, description: Short channel name shown to people in notification settings.}
    Delivery:
      type: object
      additionalProperties: false
      required: [delivery_id, principal_id, channel, kind, status, payload, attempt, max_attempts, next_attempt_at, created_at, updated_at]
      properties:
        delivery_id: {type: string}
        principal_id: {type: string}
        channel: {type: string, pattern: "^[a-z][a-z0-9_-]{0,31}$"}
        kind: {type: string}
        status: {type: string}
        payload: {type: object, additionalProperties: true}
        source_ref: {type: string}
        attempt: {type: integer}
        max_attempts: {type: integer}
        next_attempt_at: {type: string, format: date-time}
        claim_token: {type: string, description: Returned only by deliveries claim.}
        lease_expires_at: {type: string, format: date-time}
        last_error: {type: string}
        address: {type: string, description: Returned only by deliveries claim.}
        recipient:
          type: object
          additionalProperties: false
          description: Returned only by deliveries claim on a principal-addressed channel, and only for a human signed in through an external identity grant. The adapter maps this identity to its own address.
          required: [external_issuer, external_subject]
          properties:
            external_issuer: {type: string}
            external_subject: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        delivered_at: {type: string, format: date-time}
        failed_at: {type: string, format: date-time}
    DeliveryReceipt:
      type: object
      additionalProperties: false
      required: [delivery_id, outcome, attempt, created_at]
      properties:
        delivery_id: {type: string}
        outcome: {type: string}
        attempt: {type: integer}
        error: {type: string}
        created_at: {type: string, format: date-time}
    NotificationChannelAddressing:
      type: string
      enum: [settings, principal]
      description: settings channels deliver to the address a person enters and are off until they do. principal channels need no address, are on by default for every person, and the adapter resolves the recipient itself; a saved row with both toggles off turns the channel off.
    NotificationChannelOptions:
      type: object
      additionalProperties: false
      required: [addressing, kinds]
      properties:
        addressing: {$ref: '#/components/schemas/NotificationChannelAddressing'}
        kinds:
          type: array
          items: {type: string, enum: [push, digest]}
        label: {type: string}
        manage_url: {type: string, format: uri, maxLength: 512, description: "Absolute https URL where people manage how a principal-addressed channel reaches them; set by the declaring grant."}
    NotificationChannelSetting:
      type: object
      additionalProperties: false
      required: [channel, address, push_enabled, digest_enabled]
      properties:
        channel: {type: string, pattern: "^[a-z][a-z0-9_-]{0,31}$"}
        address: {type: string, description: Empty on principal-addressed channels.}
        push_enabled: {type: boolean}
        digest_enabled: {type: boolean}
        updated_at: {type: string, format: date-time}
    NotificationSettingsInput:
      type: object
      additionalProperties: false
      required: [channels]
      properties:
        channels:
          type: array
          items: {$ref: '#/components/schemas/NotificationChannelSetting'}
    NotificationSettings:
      type: object
      additionalProperties: false
      required: [channels, available_channels]
      properties:
        channels:
          type: array
          items: {$ref: '#/components/schemas/NotificationChannelSetting'}
        available_channels:
          type: array
          items: {type: string}
        channel_options:
          type: object
          description: Options per available channel.
          additionalProperties: {$ref: '#/components/schemas/NotificationChannelOptions'}
    SeriesPointInput:
      type: object
      additionalProperties: false
      properties:
        ts: {type: string, format: date-time, description: Defaults to now; no older than 90 days or more than 5 minutes ahead.}
        value: {type: number, minimum: -1000000000000, maximum: 1000000000000}
        state: {type: string, minLength: 1, maxLength: 128}
        labels: {$ref: '#/components/schemas/SeriesLabels'}
    SeriesPanelSource:
      type: object
      additionalProperties: false
      required: [series]
      properties:
        series: {type: string, pattern: "^[a-z][a-z0-9_.-]{0,79}$"}
        labels: {$ref: '#/components/schemas/SeriesLabels'}
        range: {type: string, description: Duration up to 3650d; default 24h.}
