    SessionCapabilities:
      type: object
      additionalProperties: false
      required: [resume, history, logs]
      description: Explicit caller-reported capabilities. Unknown means not established. These flags grant no access and do not implement remote resume or transcript retrieval.
      properties:
        resume: {type: string, enum: [supported, unsupported, unknown]}
        history: {type: string, enum: [supported, unsupported, unknown]}
        logs: {type: string, enum: [supported, unsupported, unknown]}
    SessionRegisterRequest:
      type: object
      additionalProperties: false
      required: [provider, native_session_id, capabilities, activity, sequence]
      properties:
        provider: {type: string, minLength: 1, maxLength: 64}
        host_scope:
          type: string
          minLength: 1
          maxLength: 128
          description: Optional for enrolled agents; core uses the authenticated enrolled host ID and rejects another host ID or slug. Existing standalone agents must supply an opaque caller-reported namespace. This field grants no host authority.
        native_session_id:
          type: string
          minLength: 1
          maxLength: 512
          description: Opaque stable provider-native correlator. Prefer a privacy-preserving hash; never send credentials, paths, transcripts, or resume tokens. ANX never interprets this value as a resume target. Do not invent an identifier when the native session is unknown.
        capabilities:
          $ref: '#/components/schemas/SessionCapabilities'
        native_session_id_kind: {type: string, enum: [opaque, provider_session_sha256], default: opaque}
        sequence: {type: integer, minimum: 0, maximum: 9007199254740991, description: Monotonically increasing per session identity. Equal sequence and identical normalized body replay without renewing the lease; stale or conflicting sequences return 409.}
        activity: {type: string, enum: [active, idle, closed]}
    AgentSession:
      type: object
      additionalProperties: false
      required: [session_id, agent_id, actor_id, provider, host_scope, native_session_id, native_session_id_kind, capabilities, sequence, activity, active, created_at, last_seen_at, expires_at]
      properties:
        session_id: {type: string}
        agent_id: {type: string}
        actor_id: {type: string}
        provider: {type: string}
        host_scope: {type: string}
        native_session_id: {type: string}
        native_session_id_kind: {type: string, enum: [opaque, provider_session_sha256]}
        sequence: {type: integer}
        capabilities:
          $ref: '#/components/schemas/SessionCapabilities'
        activity: {type: string, enum: [active, idle, closed, stale]}
        active: {type: boolean, description: True only while activity is active and its server-clock lease is unexpired.}
        created_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    SessionResponse:
      type: object
      required: [session]
      properties:
        session:
          $ref: '#/components/schemas/AgentSession'
    WorkParticipantRequest:
      type: object
      additionalProperties: false
      required: [session_id, activity, sequence]
      properties:
        session_id: {type: string, description: An existing session belonging to the authenticated agent.}
        sequence: {type: integer, minimum: 0, maximum: 9007199254740991, description: Monotonically increasing per task and session pair. Exact retries do not renew activity.}
        activity: {type: string, enum: [active, idle, left]}
    WorkParticipant:
      type: object
      additionalProperties: false
      required: [participant_id, agent_id, actor_id, sequence, activity, active, created_at, last_seen_at, expires_at]
      properties:
        participant_id: {type: string, description: Opaque identity scoped to this task and session; grants no lock or ownership.}
        agent_id: {type: string}
        actor_id: {type: string}
        session_id: {type: string, description: Present only for the authenticated session owner. Never included for other readers.}
        sequence: {type: integer}
        activity: {type: string, enum: [active, idle, left, closed, stale]}
        active: {type: boolean, description: Requires unexpired participation and session leases with both the session and participation reporting active.}
        created_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, description: Earliest expiry of participation and session leases.}
    WorkParticipantResponse:
      type: object
      required: [participant]
      properties:
        participant:
          $ref: '#/components/schemas/WorkParticipant'
    WorkParticipantListResponse:
      type: object
      required: [participants, next_cursor]
      properties:
        participants:
          type: array
          items:
            $ref: '#/components/schemas/WorkParticipant'
        next_cursor: {type: string}
    IndexedAliases:
      type: object
      additionalProperties: true
      description: All fields used by the evidence lookup index share these caps, including source, observation facts, evidence and source_refs. Limits on strings are UTF-8 byte limits enforced by core. Unknown non-indexed fields round-trip.
      properties:
        authority: {type: string, maxLength: 2048, nullable: true}
        connection_id: {type: string, maxLength: 2048, nullable: true}
        native_id: {type: string, maxLength: 2048, nullable: true}
        identifier: {type: string, maxLength: 2048, nullable: true}
        url: {type: string, maxLength: 2048, nullable: true}
        identifier_aliases: {type: array, maxItems: 50, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 2048}}
        aliases: {type: array, maxItems: 50, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 2048}}
    WorkSource:
      allOf: [{ $ref: '#/components/schemas/IndexedAliases' }]
      type: object
      additionalProperties: true
      properties:
        authority:
          type: string
        connection_id:
          type: string
        native_id:
          type: string
        url:
          type: string
        native_status:
          type: string
        revision:
          type: string
      required:
      - authority
    WorkObservation:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        idempotency_key:
          type: string
        reader_id:
          type: string
        reader_revision:
          type: string
        observed_at:
          type: string
        received_at:
          type: string
        source_revision:
          type: string
        source_activity_at:
          type: string
        meaningful_progress_at:
          type: string
        actor_id:
          type: string
        work_ref:
          type: string
        status:
          type: string
          enum:
          - reported
          - verified
          - uncertain
          - error
        verification:
          type: string
          enum:
          - reported
        source_sequence:
          type: integer
          minimum: 0
        facts:
          allOf: [{ $ref: '#/components/schemas/IndexedAliases' }]
          type: object
          additionalProperties: true
          properties: &id001 {}
        evidence:
          type: array
          maxItems: 2000
          items:
            allOf: [{ $ref: '#/components/schemas/IndexedAliases' }]
            type: object
            additionalProperties: true
            properties: *id001
        uncertainty:
          type: array
          items:
            type: string
        coverage:
          type: object
          additionalProperties: true
          properties: *id001
        error:
          type: object
          additionalProperties: true
          properties:
            code:
              type: string
            message:
              type: string
        stale_after_seconds:
          type: integer
          minimum: 1
          maximum: 2592000
      required:
      - idempotency_key
      - reader_id
      - reader_revision
      - observed_at
      - status
    WorkRefresh:
      type: object
      additionalProperties: true
      properties:
        state:
          type: string
          enum:
          - idle
          - queued
          - running
          - succeeded
          - failed
        requested_at:
          type: string
        requested_by:
          type: string
        last_attempt_at:
          type: string
        last_success_at:
          type: string
        next_due_at:
          type: string
        last_error:
          type: object
          additionalProperties: true
          properties:
            code:
              type: string
            message:
              type: string
      required:
      - state
    SourceRef:
      allOf: [{ $ref: '#/components/schemas/IndexedAliases' }]
      type: object
      additionalProperties: true
      required: [authority, connection_id, native_id]
      description: Generic structured source evidence attached to a card-backed work item. Any adapter may write it; core never parses adapter markdown. Unknown fields round-trip.
      properties:
        authority: {type: string, minLength: 1}
        connection_id: {type: string, minLength: 1}
        native_id: {type: string, minLength: 1}
        identifier: {type: string, nullable: true, description: Legacy single alias; resolved generically without inferring authority.}
        aliases: {type: array, maxItems: 50, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 2048}, description: Compatible spelling of exact adapter-published identifier_aliases.}
        identifier_aliases: {type: array, maxItems: 50, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 2048}, description: Exact adapter-published aliases for this authority/connection/native identity.}
        title: {type: string, nullable: true}
        url: {type: string, nullable: true, description: Absolute HTTP(S) source URL without credentials.}
        status: {type: string, nullable: true, description: Open source status; unknown values round-trip.}
        phase: {type: string, nullable: true, description: Optional normalized phase for plan rollups.}
        observed_at: {type: string, format: date-time, nullable: true}
        source_activity_at: {type: string, format: date-time, nullable: true, description: Source activity, never the time of an unchanged poll.}
    SourceRefs:
      type: array
      maxItems: 2000
      items: { $ref: '#/components/schemas/SourceRef' }
      description: Generic source evidence stored in card-backed work annotations. Write via work.create or work.patch with if_version. Full list replacement; omission preserves and [] clears. Identities authority/connection_id/native_id must be unique.

    SeriesMetric:
      type: object
      required: [ref, name, kind, unit, status]
      properties:
        ref: {type: string}
        name: {type: string}
        kind: {type: string, enum: [gauge, counter, state]}
        unit: {type: string}
        status: {type: string, enum: [ok, stale, unavailable, ambiguous]}
        labels: {type: object, additionalProperties: {type: string}}
        latest: {$ref: '#/components/schemas/SeriesObservation'}
        baseline: {$ref: '#/components/schemas/SeriesObservation'}
        baseline_source: {type: string, enum: [first_in_range, declared]}
        change: {type: number, description: Latest minus baseline for numeric series.}
        change_percent: {type: number, description: 100 * change / absolute baseline; omitted for zero baseline.}
        changed: {type: boolean, description: State or numeric values differ.}
        observed_at: {type: string, format: date-time}
        age: {type: integer, minimum: 0}
        stale: {type: boolean}
    SeriesObservation:
      type: object
      properties:
        ts: {type: string, format: date-time}
        value: {type: number}
        state: {type: string}

    WorkSummary:
      type: object
      description: Computed card presentation, independent of board role. status.state is the card's promise state (past_promise, moving, no_promise, done), the same value plan_health.state carries; label and reason are computed from it. no_plan is a hint and never a status. Existing Card/Work collections expose this only with summary=1, aliased at summary with prose in summary_text. Default collection shapes remain unchanged; writes still accept prose. Card ref previews and the plan read expose computed summaries directly.
      required: [status]
      properties:
        status:
          type: object
          required: [state, label, reason]
          properties:
            state: {type: string, enum: [past_promise, moving, no_promise, done]}
            label: {type: string}
            reason: {type: string}
            since: {type: string, nullable: true, format: date-time}
        hints:
          type: array
          description: Secondary non-status facts. no_plan means there are no plan steps; the client decides whether to show it.
          items: {type: string}
        progress:
          type: object
          required: [done, total, unit]
          properties:
            done: {type: integer, minimum: 0}
            total: {type: integer, minimum: 0}
            unit: {type: string, enum: [steps, cards]}
            truncated: {type: boolean}
        next:
          type: object
          required: [id, title, ref, more]
          properties:
            id: {type: string}
            title: {type: string}
            ref: {type: string}
            more: {type: integer, minimum: 0, description: Additional readable ready steps.}
        owner: {type: string, description: Assignee or lead agent reference.}
        due: {type: string, format: date-time}
        age: {type: integer, minimum: 0, description: Seconds since creation; excluded from stream change detection.}
        created_at: {type: string, format: date-time, description: Canonical creation anchor for age.}
        last_movement_at: {type: string, format: date-time}
        source: {$ref: '#/components/schemas/WorkSource'}
        steps: {$ref: '#/components/schemas/PlanStepDigest'}
        resolution_truncated: {type: boolean, description: Linked plan or child facts exceeded the bounded ref budget.}
        metrics:
          type: array
          maxItems: 8
          items: {$ref: '#/components/schemas/SeriesMetric'}
        metrics_truncated: {type: boolean}
        attention:
          type: object
          required: [count, oldest_age]
          properties:
            count: {type: integer, minimum: 1, description: Visible open asks in the bounded oldest-first candidate window.}
            oldest_age: {type: integer, minimum: 0, description: Seconds since the oldest visible sampled ask; excluded from stream change detection.}
            oldest_at: {type: string, format: date-time, description: Canonical trigger timestamp of the oldest visible sampled ask.}
            truncated: {type: boolean, description: Count is a lower bound when the candidate window is full.}
        attention_truncated: {type: boolean, description: Attention is sampled; scoped readers always receive this marker so private candidate counts cannot be inferred. Omitted asks may exist. When attention is absent and this is true, waiting status is unknown rather than zero.}

    WorkCadence:
      type: object
      additionalProperties: false
      required: [every_seconds]
      properties:
        every_seconds: {type: integer, minimum: 60, maximum: 3155760000}
        progress_budget_seconds: {type: integer, minimum: 60, maximum: 3155760000, description: Must be at least every_seconds.}
        stop_rule: {type: string, maxLength: 500}
    WorkGoal:
      type: object
      additionalProperties: false
      required: [metric, direction]
      properties:
        metric: {type: string, maxLength: 120, pattern: '^[a-z][a-z0-9_.-]{0,119}$'}
        direction: {type: string, enum: [up, down]}
        target: {type: number}
        baseline: {type: number}
        unit: {type: string, maxLength: 80}
        series_ref: {type: string, maxLength: 2048, description: Existing series ref with optional label selectors.}
    Work:
      type: object
      additionalProperties: true
      properties:
        cadence: {nullable: true, allOf: [{$ref: '#/components/schemas/WorkCadence'}]}
        goal: {nullable: true, allOf: [{$ref: '#/components/schemas/WorkGoal'}]}
        source_refs: { $ref: '#/components/schemas/SourceRefs' }
        plan: { $ref: '#/components/schemas/InitiativePlan' }
        plan_state: { $ref: '#/components/schemas/PlanState' }
        plan_resolution_truncated: {type: boolean, description: True when the shared 4000 distinct plan-ref budget was exceeded; omitted refs remain unknown.}
        plan_health: { $ref: '#/components/schemas/PlanHealth' }
        next_step: { $ref: '#/components/schemas/NextPlanStep' }
        status_mismatch: {type: boolean, description: True when phase is backlog and at least one plan step is done. No automatic phase changes.}
        possibly_moot: { $ref: '#/components/schemas/PossiblyMoot' }
        decision_revision:
          type: string
          readOnly: true
          description: Revision fence to copy into PM proposal target_revision. Uses nonempty source.revision for external authority; otherwise <work_metadata.version>.<head_revision_number> (decimal components). Canonical metadata mutations and card content revisions each change the fence; refresh attempts, failures, and freshness bookkeeping do not. Successful external observations with a new source.revision change the fence. Recomputed on every work response.
        project_ref: &id002
          type: string
        priority: &id003
          type: string
        next_actor: &id004
          type: string
        next_action: &id005
          type: string
        wake_condition: &id006
          type: string
        start_at: &id007
          type: string
        due_at: &id008
          type: string
        blockers: &id009
          type: array
          items:
            type: string
        relations: &id010
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              kind:
                type: string
                enum:
                - parent
                - child
                - depends_on
                - related
                - artifact
              ref:
                type: string
            required:
            - kind
            - ref
        executions: &id011
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              authority:
                type: string
              run_id:
                type: string
              host:
                type: string
              harness:
                type: string
              agent:
                type: string
              model:
                type: string
              url:
                type: string
              result_ref:
                type: string
            required:
            - authority
            - run_id
        workspace_move:
          type: object
          additionalProperties: true
          description: Stable client-side move marker used to resume cross-workspace copies.
        ref:
          type: string
        handle:
          type: string
        board_ref:
          type: string
        title:
          type: string
        work_summary: {$ref: '#/components/schemas/WorkSummary'}
        summary:
          description: Legacy prose by default; WorkSummary when summary=1 is requested.
          oneOf: [{type: string}, {$ref: '#/components/schemas/WorkSummary'}]
        summary_text:
          type: string
        labels: {type: array, maxItems: 16, items: {type: string, minLength: 1, maxLength: 128}}
        roles: {type: array, maxItems: 16, items: {type: string, maxLength: 128}}
        owner:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        definition_of_done:
          type: array
          items:
            type: string
        source:
          $ref: '#/components/schemas/WorkSource'
        phase:
          type: string
          enum:
          - backlog
          - ready
          - in_progress
          - blocked
          - review
          - done
          - cancelled
          - unknown
        column_key:
          type: string
          readOnly: true
          description: Board column for the backing card. Matches phase for Nexus-owned work.
        rank:
          type: string
          readOnly: true
          description: Board membership rank within the backing card's column. Projected from the card; work.list remains updated_at order. Board-like clients sort within a phase by board_ref then rank.
        version:
          type: integer
        freshness:
          type: object
          additionalProperties: true
          properties:
            status:
              type: string
              enum:
              - unknown
              - fresh
              - stale
              - error
            last_observed_at:
              type: string
            source_activity_at:
              type: string
            meaningful_progress_at:
              type: string
            stale_after_seconds:
              type: integer
            last_error:
              type: object
              additionalProperties: true
              properties:
                code:
                  type: string
                message:
                  type: string
        refresh:
          $ref: '#/components/schemas/WorkRefresh'
        latest_observation:
          nullable: true
          type: object
          additionalProperties: true
          properties: *id001
      required:
      - decision_revision
      - ref
      - title
      - source
      - phase
      - version
      - freshness
      - refresh
    WorkResponse:
      type: object
      additionalProperties: true
      properties:
        work:
          $ref: '#/components/schemas/Work'
      required:
      - work
    WorkListResponse:
      type: object
      additionalProperties: true
      properties:
        work:
          type: array
          items:
            $ref: '#/components/schemas/Work'
        archived_refs:
          type: array
          items: { type: string }
          description: Card refs and aliases hidden by card, parent-board or project-topic lifecycle, for excluding associated Watching decisions. These are excluded from work and its counts.
        next_cursor:
          type: string
      required:
      - work
    WorkCreateRequest:
      type: object
      additionalProperties: true
      properties:
        handle: {$ref: '#/components/schemas/CardHandle'}
        cadence: {nullable: true, allOf: [{$ref: '#/components/schemas/WorkCadence'}]}
        goal: {nullable: true, allOf: [{$ref: '#/components/schemas/WorkGoal'}]}
        request_key:
          type: string
          maxLength: 256
          description: Actor-scoped original-result replay committed atomically with this mutation; retain unchanged until confirmed.
        source_refs: { $ref: '#/components/schemas/SourceRefs' }
        actor_id:
          type: string
        id:
          type: string
          description: Optional caller-selected card id for idempotent native work creation.
        board_ref:
          type: string
          description: Optional board to place the card on (`board:<handle-or-id>`). When omitted, the server uses the
            workspace's oldest active board, creating a default Tasks board if none exists.
        labels: {type: array, maxItems: 16, nullable: true, items: {type: string, minLength: 1, maxLength: 128}}
        roles: {type: array, maxItems: 16, nullable: true, items: {type: string, maxLength: 128}}
        title:
          type: string
        summary:
          type: string
        owner:
          type: string
        phase:
          type: string
        source:
          $ref: '#/components/schemas/WorkSource'
        definition_of_done:
          type: array
          items:
            type: string
        project_ref: *id002
        priority: *id003
        next_actor: *id004
        next_action: *id005
        wake_condition: *id006
        start_at: *id007
        due_at: *id008
        blockers: *id009
        relations: *id010
        executions: *id011
        workspace_move:
          type: object
          additionalProperties: true
          description: Stable client-side move marker used to resume cross-workspace copies.
        plan: { $ref: '#/components/schemas/InitiativePlan' }
        topic_ref: { $ref: '#/components/schemas/TypedRef' }
        document_ref: { $ref: '#/components/schemas/TypedRef' }
        related_refs:
          type: array
          items: { $ref: '#/components/schemas/TypedRef' }
        risk: { type: string, enum: [low, medium, high, critical] }
      required:
      - title
    WorkPatchRequest:
      type: object
      additionalProperties: true
      properties:
        actor_id:
          type: string
        if_version:
          type: integer
          minimum: 0
        patch:
          type: object
          additionalProperties: true
          properties:
            cadence: {nullable: true, allOf: [{$ref: '#/components/schemas/WorkCadence'}]}
            goal: {nullable: true, allOf: [{$ref: '#/components/schemas/WorkGoal'}]}
            labels: {type: array, maxItems: 16, nullable: true, items: {type: string, minLength: 1, maxLength: 128}}
            roles: {type: array, maxItems: 16, nullable: true, items: {type: string, minLength: 1, maxLength: 128}}
            source_refs: { $ref: '#/components/schemas/SourceRefs' }
            project_ref: *id002
            priority: *id003
            next_actor: *id004
            next_action: *id005
            wake_condition: *id006
            start_at: *id007
            due_at: *id008
            blockers: *id009
            relations: *id010
            workspace_move:
              type: object
              additionalProperties: true
            plan: {}
            executions: *id011
      required:
      - if_version
      - patch
    WorkObservationRequest:
      type: object
      additionalProperties: true
      properties:
        actor_id:
          type: string
        observation:
          $ref: '#/components/schemas/WorkObservation'
      required:
      - observation
    WorkObservationResponse:
      type: object
      additionalProperties: true
      properties:
        observation:
          $ref: '#/components/schemas/WorkObservation'
        work:
          $ref: '#/components/schemas/Work'
        duplicate:
          type: boolean
      required:
      - observation
      - work
      - duplicate
    WorkObservationListResponse:
      type: object
      additionalProperties: true
      properties:
        observations:
          type: array
          items:
            $ref: '#/components/schemas/WorkObservation'
        next_cursor:
          type: string
      required:
      - observations
    WorkRefreshResponse:
      type: object
      additionalProperties: true
      properties:
        refresh:
          $ref: '#/components/schemas/WorkRefresh'
      required:
      - refresh
    WorkRefreshRequest:
      type: object
      additionalProperties: true
      properties:
        actor_id:
          type: string
    WorkCapabilitiesResponse:
      type: object
      additionalProperties: true
      properties:
        capabilities:
          type: object
          additionalProperties: true
          properties: *id001
      required:
      - capabilities
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
      required: [code, message]

    HealthResponse:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]

    VersionResponse:
      type: object
      properties:
        schema_version: { type: string }
        command_registry_digest: { type: string }
      required: [schema_version, command_registry_digest]

    JsonObject:
      type: object
      additionalProperties: true
      description: >
        Untyped JSON object for auth and meta envelopes; prefer tightening to
        named schemas when shapes stabilize.

    JsonValue:
      description: Any JSON value (object, array, string, number, boolean, or null).
      oneOf:
        - type: object
          additionalProperties: true
        - type: array
          items: {}
        - type: string
        - type: number
        - type: boolean
        - type: "null"

    HandshakeResponse:
      type: object
      additionalProperties: true
      description: >
        Compatibility handshake from GET /meta/handshake; fields include
        core_version, api_version, schema_version, command_registry_digest,
        min_cli_version, recommended_cli_version, cli_download_url,
        core_instance_id, workspace_id, dev_actor_mode, human_auth_mode, and
        optional workspace_service_identity_id and web_url. capabilities includes host_bridge_v1
        when signed host snapshots and per-agent bridge jobs are supported.
      properties:
        capabilities:
          type: array
          items: {type: string}
          description: Optional supported protocol capabilities; absent means unsupported.
        web_url:
          type: string
          format: uri
          description: >
            Optional absolute URL of this workspace's web UI root, without a
            trailing slash, query, or fragment. Clients build a browser link for
            any typed ref as `<web_url>/r/<path-escaped ref>`. Configured with
            ANX_WEB_BASE_URL; when unset it falls back to
            ANX_PUBLIC_WEB_UI_WORKSPACE_URL. Absent when neither is configured;
            clients must not guess a web URL from the API base.

    TypedRef:
      type: string
      description: Typed public ref string such as `topic:roadmap` or `artifact:art_123`.

    ResourceRef:
      allOf:
        - $ref: '#/components/schemas/TypedRef'
      description: >
        Primary public identity for a durable resource. Format is
        `<kind>:<handle>` and clients should use this value for links, refs,
        command arguments, and cross-resource payloads.

    ResourceHandle:
      type: string
      description: >
        Public, kind-scoped resource handle. Handles are URL/CLI friendly and
        resolve within the resource kind; carry `ref` when kind context is not
        already known.

    LifecycleState:
      type: string
      enum: [active, archived, trashed]
      description: Canonical lifecycle state derived from trashed_at / archived_at.

    InternalResourceUUID:
      type: string
      description: >
        Internal storage UUID/debug id. Exposed only for admin, verbose, or
        compatibility diagnostics; do not use as primary public identity.

    Provenance:
      type: object
      properties:
        sources:
          type: array
          items: { type: string }
        notes: { type: string }
        by_field:
          type: object
          additionalProperties:
            type: array
